<!DOCTYPE html>
<html lang="en" class="bg-black text-white select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aiden Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .edit-grid-bg {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .touch-none { touch-action: none; }

    .folder-cube {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .folder-cube:active { transform: scale(0.95); }

    .resize-handle {
      width: 28px;
      height: 28px;
      bottom: -4px;
      right: -4px;
      border-top-left-radius: 12px;
      touch-action: none;
      display: none;
    }

    body.edit-mode .resize-handle {
      display: flex;
    }

    #modal-text-input:empty:before {
      content: attr(data-placeholder);
      color: #71717a;
      pointer-events: none;
    }
    #modal-text-input { outline: none; }
  </style>
</head>
<body class="bg-black min-h-screen text-zinc-100 selection:bg-zinc-800 overflow-hidden">
  <div id="app" class="h-screen w-screen bg-black text-white flex flex-col overflow-hidden"></div>

  <input id="file-input" type="file" multiple class="hidden" />
  <input id="photo-input" type="file" accept="image/*,video/*,audio/*" multiple class="hidden" />
  <input id="change-image-input" type="file" accept="image/*" class="hidden" />
  <input id="folder-cover-input" type="file" accept="image/*" class="hidden" />
  <input id="app-thumbnail-input" type="file" accept="image/*" class="hidden" />
  <input id="link-thumbnail-input" type="file" accept="image/*" class="hidden" />

  <script>
    const CONFIG = {
      ghRepo: 'aidamn81/aidenfiles',
      ghPath: 'aiden_meta.json',
      GRID_SIZE: 24
    };

    let state = {
      editMode: false,
      selectMode: false,
      selectedIds: [],
      currentFolderId: null,
      folders: [],
      files: [],
      textBubbles: [],
      ghToken: localStorage.getItem('af_gh_token') || '',
      isSyncing: false,
      activeMenuId: null,
      hamburgerMenuOpen: false,
      targetChangeImageId: null,
      targetFolderCoverId: null,
      quickViewFileId: null,
      showUploadModal: false,
      textEditorModal: null,
      linkModal: false,
      linkModalThumbData: null,
      appModal: false,
      appModalThumbData: null
    };

    const uid = () => Math.random().toString(36).substring(2, 9);
    const isFolder = item => !('fileType' in item) && !('isBubble' in item);
    const isBubble = item => item.isBubble === true;

    function isVideoFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('video/') || n.endsWith('.mp4') || n.endsWith('.mov') || n.endsWith('.webm') || n.endsWith('.m4v') || n.endsWith('.mkv');
    }
    function isAudioFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('audio/') || n.endsWith('.mp3') || n.endsWith('.m4a') || n.endsWith('.wav') || n.endsWith('.aac');
    }

    async function getOrCreateBlobUrl(file) {
      if (file.blobUrl) {
        try {
          const testRes = await fetch(file.blobUrl).catch(() => null);
          if (testRes && testRes.ok) return file.blobUrl;
        } catch (e) {}
      }
      if (!file.dataUrl) return '';
      try {
        const res = await fetch(file.dataUrl);
        const blob = await res.blob();
        file.blobUrl = URL.createObjectURL(blob);
        return file.blobUrl;
      } catch (e) {
        return file.dataUrl;
      }
    }

    const DB_NAME = 'aiden_files_db';
    const DB_VERSION = 4;

    function openDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('textBubbles')) db.createObjectStore('textBubbles', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function loadData() {
      const db = await openDB();
      if (db) {
        state.folders = await new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const req = tx.objectStore('folders').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.files = await new Promise(res => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.textBubbles = await new Promise(res => {
          const tx = db.transaction('textBubbles', 'readonly');
          const req = tx.objectStore('textBubbles').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }

      for (let file of state.files) {
        if (file.dataUrl && (isVideoFile(file) || isAudioFile(file))) {
          await getOrCreateBlobUrl(file);
        }
      }

      if (state.folders.length === 0) {
        const root = { id: 'root', name: 'Aiden Files', parentId: null, width: 96, height: 96 };
        state.folders = [root];
        saveFolder(root);
      }
      render();
    }

    async function saveFolder(folder) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
      }
    }

    async function saveFile(file) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('files', 'readwrite');
        const fileToSave = { ...file };
        delete fileToSave.blobUrl;
        tx.objectStore('files').put(fileToSave);
      }
    }

    async function saveTextBubble(bubble) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('textBubbles', 'readwrite');
        tx.objectStore('textBubbles').put(bubble);
      }
    }

    async function deleteFromDB(storeName, id) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
      }
    }

    function resetToken() {
      const token = prompt('Enter your GitHub Personal Access Token:', state.ghToken);
      if (token !== null) {
        state.ghToken = token.trim();
        localStorage.setItem('af_gh_token', state.ghToken);
        alert('New token saved successfully!');
        syncWithGitHub();
      }
    }

    async function syncWithGitHub(forcePull = false) {
      if (!state.ghToken) {
        resetToken();
        if (!state.ghToken) return;
      }

      state.isSyncing = true;
      render();

      try {
        let cleanToken = state.ghToken.replace(/^(token|Bearer)\s+/i, '').trim();
        const authHeader = `token ${cleanToken}`;
        const headers = {
          'Authorization': authHeader,
          'Accept': 'application/vnd.github.v3+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };

        const metaUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/aiden_meta.json`;

        if (forcePull) {
          const getRes = await fetch(metaUrl, { headers });
          if (getRes.ok) {
            const getJson = await getRes.json();
            const manifest = JSON.parse(decodeURIComponent(escape(atob(getJson.content))));

            let allFolders = [];
            let allFiles = [];
            let allBubbles = [];

            for (let chunkFileName of manifest.chunks) {
              const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;
              const chunkRes = await fetch(chunkUrl, { headers });
              if (chunkRes.ok) {
                const chunkJson = await chunkRes.json();
                const chunkData = JSON.parse(decodeURIComponent(escape(atob(chunkJson.content))));
                if (chunkData.folders) allFolders.push(...chunkData.folders);
                if (chunkData.files) allFiles.push(...chunkData.files);
                if (chunkData.textBubbles) allBubbles.push(...chunkData.textBubbles);
              }
            }

            state.folders = allFolders.length > 0 ? allFolders : state.folders;
            state.files = allFiles.length > 0 ? allFiles : state.files;
            state.textBubbles = allBubbles.length > 0 ? allBubbles : state.textBubbles;

            for (let file of state.files) {
              if (file.dataUrl && (isVideoFile(file) || isAudioFile(file))) {
                await getOrCreateBlobUrl(file);
              }
            }

            for (let f of state.folders) await saveFolder(f);
            for (let fi of state.files) await saveFile(fi);
            for (let b of state.textBubbles) await saveTextBubble(b);
            alert('Synced chunks down from Cloud successfully!');
            state.isSyncing = false;
            render();
            return;
          }
        }

        const sanitizedFiles = state.files.map(file => {
          const copy = { ...file };
          delete copy.blobUrl;
          return copy;
        });

        const CHUNK_SIZE = 15;
        const fileChunks = [];
        for (let i = 0; i < sanitizedFiles.length; i += CHUNK_SIZE) {
          fileChunks.push(sanitizedFiles.slice(i, i + CHUNK_SIZE));
        }
        if (fileChunks.length === 0) fileChunks.push([]);

        const chunkFileNames = [];

        for (let index = 0; index < fileChunks.length; index++) {
          const chunkFileName = `chunk_${index}.json`;
          chunkFileNames.push(chunkFileName);
          const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;

          let chunkSha = null;
          const existingChunkRes = await fetch(chunkUrl, { headers });
          if (existingChunkRes.ok) {
            const existingData = await existingChunkRes.json();
            chunkSha = existingData.sha;
          }

          const chunkPayloadData = {
            folders: index === 0 ? state.folders : [],
            files: fileChunks[index],
            textBubbles: index === 0 ? state.textBubbles : []
          };

          const chunkPutPayload = {
            message: `Sync Aiden Files Chunk ${index}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(chunkPayloadData)))),
            ...(chunkSha && { sha: chunkSha })
          };

          let putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          if (putRes.status === 500) {
            await new Promise(r => setTimeout(r, 1500));
            putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          }
          if (!putRes.ok) {
            throw new Error(`Failed to upload chunk ${index} (status ${putRes.status})`);
          }
        }

        let metaSha = null;
        const existingMetaRes = await fetch(metaUrl, { headers });
        if (existingMetaRes.ok) {
          const metaJson = await existingMetaRes.json();
          metaSha = metaJson.sha;
        }

        const metaManifest = { chunks: chunkFileNames, updatedAt: new Date().toISOString() };
        const metaPutPayload = {
          message: 'Update Aiden Files Manifest',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(metaManifest)))),
          ...(metaSha && { sha: metaSha })
        };

        const metaPutRes = await fetch(metaUrl, { method: 'PUT', headers, body: JSON.stringify(metaPutPayload) });
        if (!metaPutRes.ok) {
          throw new Error('Failed to update manifest file on GitHub.');
        }

        alert('Chunked Sync Successful! Cloud backup updated safely without server errors.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      const currentFolder = state.folders.find(f => f.id === state.currentFolderId);
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];
      const allChildrenSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));

      if (state.editMode) {
        document.body.classList.add('edit-mode');
      } else {
        document.body.classList.remove('edit-mode');
      }

      app.innerHTML = `
        <header class="shrink-0 z-50 bg-black/95 backdrop-blur-lg border-b border-zinc-900 px-3 py-2 flex items-center justify-between gap-2 relative">
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
                <i data-lucide="menu" class="w-5 h-5"></i>
              </button>
              ${state.currentFolderId !== null ? `
                <button onclick="navigateBack()" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1 text-xs font-bold shadow-md cursor-pointer shrink-0" title="Back">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  <span>Back</span>
                </button>
              ` : ''}
              <button onclick="toggleSelectMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.selectMode ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                ${state.selectMode ? 'Cancel' : 'Select'}
              </button>
              <button onclick="toggleEditMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.editMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                ${state.editMode ? 'Edit Mode On' : 'Edit Mode Locked'}
              </button>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0">
              <span onclick="navigateTo(null)" class="cursor-pointer hover:text-white">Home</span>
              ${currentFolder ? `<span class="text-zinc-600">/</span><span class="text-white font-semibold truncate">${currentFolder.name}</span>` : ''}
            </div>
          </div>

          ${state.hamburgerMenuOpen ? `
            <div onclick="event.stopPropagation()" class="absolute top-14 left-3 w-64 bg-black border border-zinc-700/90 rounded-2xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-2 flex flex-col gap-1 px-2">
              <button onclick="navigateTo(null); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
              </button>
              <button onclick="openNewFolderModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
              </button>
              <button onclick="openUploadModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i> Add Item
              </button>
              <button onclick="openLinkModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="link" class="w-4 h-4 text-amber-400"></i> Add Link
              </button>
              <button onclick="openAppModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i> Add App
              </button>
              <div class="h-px bg-zinc-800 my-1"></div>
              <button onclick="syncWithGitHub(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
                <i data-lucide="${state.isSyncing ? 'refresh-cw' : 'cloud'}" class="w-4 h-4 ${state.isSyncing ? 'animate-spin text-amber-400' : 'text-zinc-400'}"></i>
                <span>${state.isSyncing ? 'Syncing...' : 'Sync'}</span>
              </button>
              <button onclick="resetToken(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
                <i data-lucide="key" class="w-4 h-4 text-zinc-400"></i> Update GitHub token
              </button>
              <button onclick="forcePullCloudData(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-amber-400 font-bold cursor-pointer">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Pull Cloud
              </button>
            </div>
          ` : ''}
        </header>

        <main onclick="closeMenu(); closeHamburgerMenu();" class="flex-1 relative w-full h-full overflow-auto ${state.editMode ? 'edit-grid-bg' : ''}">
          ${state.hamburgerMenuOpen ? `<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40" onclick="closeHamburgerMenu()"></div>` : ''}
          ${items.length === 0 ? `
            <div class="flex flex-col items-center justify-center h-full text-center p-6 text-zinc-500 text-sm gap-3">
              <span>Folder is empty</span>
              <button onclick="forcePullCloudData()" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-xl text-xs text-amber-400 font-bold flex items-center gap-2">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Restore / Sync from Cloud Backup
              </button>
            </div>
          ` : `
            <div class="relative min-w-[1200px] min-h-[1200px] p-4" id="canvas-container">
              ${items.map((item, index) => renderItem(item, index)).join('')}
            </div>
          `}
        </main>

        ${state.selectMode ? `
          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900/95 border border-zinc-700 backdrop-blur-xl px-6 py-3.5 rounded-2xl shadow-2xl z-40 flex items-center gap-4 flex-wrap justify-center">
            <button onclick="toggleSelectAll()" class="px-3 py-2 bg-indigo-950 border border-indigo-700 rounded-xl text-xs font-bold text-indigo-300 flex items-center gap-1.5 shadow-sm shrink-0">
              <i data-lucide="${allChildrenSelected ? 'check-square' : 'square'}" class="w-4 h-4"></i>
              ${allChildrenSelected ? 'Deselect All' : 'Select All'}
            </button>
            ${state.selectedIds.length > 0 ? `
              <div class="h-4 w-px bg-zinc-800"></div>
              <span class="text-xs font-bold text-zinc-300">${state.selectedIds.length} Selected</span>
              <div class="h-4 w-px bg-zinc-800"></div>
              <button onclick="bulkCopy()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="copy" class="w-4 h-4"></i> Copy</button>
              <button onclick="bulkMove()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="folder-output" class="w-4 h-4"></i> Move</button>
              <button onclick="bulkShare()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="share" class="w-4 h-4"></i> Share</button>
              <button onclick="bulkDelete()" class="flex items-center gap-1.5 text-xs text-red-400 hover:text-red-300 font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
            ` : ''}
          </div>
        ` : ''}

        ${state.showUploadModal ? renderUploadModal() : ''}
        ${state.linkModal ? renderLinkModal() : ''}
        ${state.appModal ? renderAppModal() : ''}
        ${state.quickViewFileId ? renderQuickViewModal() : ''}
        ${state.textEditorModal ? renderTextEditorModal() : ''}
      `;

      if (window.lucide) window.lucide.createIcons();
      attachDragAndResizeListeners();
    }

    function getFileIcon(type, name) {
      if (type === 'link' || name.startsWith('http')) return 'link';
      if (type === 'app' || type === 'ios-app') return 'smartphone';
      if (isVideoFile({ fileType: type, name })) return 'video';
      if (isAudioFile({ fileType: type, name })) return 'music';
      if (type === 'application/pdf' || name.endsWith('.pdf')) return 'file-text';
      if (type.startsWith('text/') || name.endsWith('.txt') || name.endsWith('.html') || name.endsWith('.json') || name.endsWith('.csv')) return 'file-text';
      if (name.endsWith('.docx') || name.endsWith('.doc') || name.endsWith('.xlsx') || name.endsWith('.xls')) return 'file-spreadsheet';
      return 'file';
    }

    function bubbleInlineStyle(item) {
      let style = '';
      if (item.fontSize === 'lg') style += 'font-size:16px;';
      else if (item.fontSize === 'sm') style += 'font-size:10px;';
      else style += 'font-size:11px;';
      if (item.isBold) style += 'font-weight:bold;';
      if (item.isItalic) style += 'font-style:italic;';
      if (item.isUnderline) style += 'text-decoration:underline;';
      if (item.fontColor) style += `color:${item.fontColor};`;
      if (item.align) style += `text-align:${item.align};`;
      return style;
    }

    function renderItem(item, index) {
      const col = index % 4;
      const row = Math.floor(index / 4);
      const posX = item.x !== undefined ? item.x : (20 + col * 140);
      const posY = item.y !== undefined ? item.y : (20 + row * 160);
      const itemWidth = item.width || (isFolder(item) ? 96 : isBubble(item) ? 140 : 112);
      const itemHeight = item.height || (isFolder(item) ? 96 : isBubble(item) ? 80 : 144);
      const folder = isFolder(item);
      const bubble = isBubble(item);
      const isMenuOpen = state.activeMenuId === item.id;
      const isSelected = state.selectedIds.includes(item.id);

      if (bubble) {
        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; min-height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false, true)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : (state.editMode ? 'border-yellow-500/60' : 'border-zinc-700')} rounded-2xl p-3 shadow-lg relative flex flex-col justify-between overflow-hidden">
              <div class="w-full h-full whitespace-pre-wrap break-words leading-tight select-none pointer-events-none" style="${bubbleInlineStyle(item)}">${item.text || 'Empty bubble'}</div>

        const isImage = type.startsWith('image/');

        const icon = getFileIcon(type, item.name);

        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false)">

                    ${isApp ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">iOS App</span>' : ''}
                    ${isVideo ? '<span class="text-[9px] uppercase font-bold tracking-wider text-zinc-500">Video</span>' : ''}
                    ${type.startsWith('audio/') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-zinc-500">Audio</span>' : ''}
                    ${type === 'application/pdf' || item.name.endsWith('.pdf') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-red-400">PDF</span>' : ''}
                    ${type.startsWith('text/') || item.name.endsWith('.txt') || item.name.endsWith('.html') || item.name.endsWith('.json') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">DOC</span>' : ''}
                  </div>

                ${state.selectMode ? `<div class="absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>` : ''}

              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">

                <button type="button" onclick="applyTextEditorFormat('isItalic')" class="p-1.5 rounded-md ${ed.isItalic ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Italic"><i data-lucide="italic" class="w-4 h-4"></i></button>
                <button type="button" onclick="applyTextEditorFormat('isUnderline')" class="p-1.5 rounded-md ${ed.isUnderline ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Underline"><i data-lucide="underline" class="w-4 h-4"></i></button>
              </div>
              <div class="h-5 w-px bg-zinc-800"></div>
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
                ${aligns.map(a => `
                  <button type="button" onclick="applyTextEditorFormat('align', '${a.key}')" class="p-1.5 rounded-md ${ed.align === a.key ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Align ${a.key}"><i data-lucide="${a.icon}" class="w-4 h-4"></i></button>
                `).join('')}
              </div>
              <div class="h-5 w-px bg-zinc-800"></div>
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
                <label class="cursor-pointer relative" title="Font colour">
                  <input type="color" value="${ed.fontColor || '#ffffff'}" oninput="applyTextEditorFormat('fontColor', this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" />
                  <span class="p-1.5 rounded-md text-zinc-300 hover:bg-zinc-800 flex items-center"><i data-lucide="palette" class="w-4 h-4" style="color:${ed.fontColor || '#ffffff'}"></i></span>
                </label>
                ${colorSwatches.map(c => `
                  <button type="button" onclick="applyTextEditorFormat('fontColor', '${c}')" class="w-5 h-5 rounded-full border ${ed.fontColor === c ? 'ring-2 ring-amber-400 border-amber-400' : 'border-zinc-600'}" style="background:${c}" title="${c}"></button>
                `).join('')}
                <button type="button" onclick="applyTextEditorFormat('fontColor', null)" class="p-1.5 rounded-md text-zinc-400 hover:bg-zinc-800" title="Reset colour"><i data-lucide="eraser" class="w-4 h-4"></i></button>
              </div>
            </div>

            <textarea id="modal-text-input" oninput="updateTextEditorContent(this.value)" placeholder="Type your text note here..." class="w-full h-36 bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-white resize-none outline-none focus:border-amber-500 text-sm font-normal" style="${ed.isBold ? 'font-weight:bold;' : ''}${ed.isItalic ? 'font-style:italic;' : ''}${ed.isUnderline ? 'text-decoration:underline;' : ''}${ed.fontColor ? 'color:' + ed.fontColor + ';' : ''}${ed.align ? 'text-align:' + ed.align + ';' : ''}${ed.fontSize === 'lg' ? 'font-size:16px;' : ed.fontSize === 'sm' ? 'font-size:10px;' : 'font-size:11px;'}">${ed.text || ''}</textarea>

            <p class="text-[10px] text-zinc-500 -mt-2">Tip: select text and tap a button to apply formatting to that selection only. With no selection it applies to the whole bubble.</p>

            <div class="flex items-center justify-end gap-3 pt-2">
              <button onclick="closeTextEditorModal()" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button onclick="saveTextEditorModal()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs shadow-lg shadow-amber-500/20">Save Bubble</button>
            </div>
          </div>
        </div>
      `;
    }

    async function renderQuickViewContent(file) {
      if (isVideoFile(file) || isAudioFile(file)) {
        await getOrCreateBlobUrl(file);
      }
      const type = file.fileType || '';
      const name = file.name || '';
      const mediaUrl = file.blobUrl || file.dataUrl;
      const isVideo = isVideoFile(file);
      const isLink = type === 'link';
      const isApp = type === 'app' || type === 'ios-app';

      if (isLink) {
        return `
          <div class="flex flex-col items-center gap-6 p-8 bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-400"><i data-lucide="link" class="w-8 h-8"></i></div>
            <span class="text-sm font-semibold text-zinc-200 max-w-full truncate">${file.name}</span>
            <a href="${file.dataUrl}" target="_blank" class="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs flex items-center gap-2 shadow-lg shadow-amber-500/20"><i data-lucide="external-link" class="w-4 h-4"></i> Open Web Link</a>
          </div>
        `;
      }
      if (isApp) {
        return `
          <div class="flex flex-col items-center gap-6 p-8 bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-400"><i data-lucide="smartphone" class="w-8 h-8"></i></div>
            <span class="text-sm font-semibold text-zinc-200 max-w-full truncate">Launch App: ${file.name}</span>
            <p class="text-xs text-zinc-400">Scheme: <code class="text-amber-400">${file.dataUrl}</code></p>
            <a href="${file.dataUrl}" class="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs flex items-center gap-2 shadow-lg shadow-amber-500/20"><i data-lucide="external-link" class="w-4 h-4"></i> Open on iOS Device</a>
          </div>
        `;
      }
      if (type.startsWith('image/')) return `<img src="${file.dataUrl}" class="max-w-[90vw] max-h-[75vh] w-auto h-auto object-contain rounded-2xl shadow-2xl" />`;
      if (isVideo) return `<video controls autoplay playsinline webkit-playsinline preload="auto" class="max-w-[90vw] max-h-[75vh] w-auto h-auto object-contain rounded-2xl shadow-2xl bg-black" src="${mediaUrl}"></video>`;
      if (isAudioFile(file)) {

            <audio controls autoplay preload="auto" class="w-full" src="${mediaUrl}"></audio>
          </div>
        `;
      }
      if (type === 'application/pdf' || name.endsWith('.pdf')) {
        return `
          <div class="w-[98vw] h-[92vh] max-w-7xl bg-zinc-900 border border-zinc-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-zinc-950 px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-300 shrink-0">
              <span class="font-semibold truncate">${file.name}</span>
              <a href="${file.dataUrl}" download="${file.name}" class="px-3 py-1 bg-amber-500 text-black font-bold rounded-lg hover:bg-amber-400 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Download Full PDF</a>
            </div>
            <div class="flex-1 w-full h-full bg-zinc-950 relative overflow-auto">
              <embed src="${file.dataUrl}#toolbar=1&view=FitH" type="application/pdf" width="100%" height="100%" class="w-full h-full border-0 bg-white" />
            </div>
          </div>
        `;
      }
      if (name.endsWith('.html') || name.endsWith('.htm') || type === 'text/html') {
        return `
          <div class="w-[95vw] h-[85vh] max-w-5xl bg-zinc-900 border border-zinc-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-zinc-950 px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-300">
              <span class="font-semibold truncate">${file.name}</span>
              <a href="${file.dataUrl}" download="${file.name}" class="px-3 py-1 bg-amber-500 text-black font-bold rounded-lg hover:bg-amber-400 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Download File</a>

            <div class="flex-1 w-full h-full bg-white relative">
              <iframe src="${file.dataUrl}" class="w-full h-full border-0"></iframe>
            </div>

      if (type.startsWith('text/') || name.endsWith('.txt') || name.endsWith('.json') || name.endsWith('.csv') || name.endsWith('.md')) {
        return `
          <div class="w-[95vw] h-[85vh] max-w-4xl bg-zinc-900 border border-zinc-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-zinc-950 px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-300">
              <span class="font-semibold truncate">${file.name}</span>

            </div>

      }
      return `
        <div class="w-[95vw] h-[85vh] max-w-4xl bg-zinc-900 border border-zinc-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
          <div class="bg-zinc-950 px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between text-xs text-zinc-300">
            <span class="font-semibold truncate">${file.name}</span>
            <a href="${file.dataUrl}" download="${file.name}" class="px-3 py-1 bg-amber-500 text-black font-bold rounded-lg hover:bg-amber-400 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Download File</a>

          <div class="flex-1 w-full h-full bg-zinc-950 flex flex-col items-center justify-center p-8 text-center gap-4">
            <i data-lucide="file-text" class="w-16 h-16 text-amber-400"></i>
            <span class="text-sm font-semibold text-zinc-200">${file.name}</span>
          </div>

    async function renderQuickViewModal() {
      const currentFolderFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const currentIndex = currentFolderFiles.findIndex(f => f.id === state.quickViewFileId);
      const file = currentFolderFiles[currentIndex];
      if (!file) return '';

      const hasPrev = currentIndex > 0;
      const hasNext = currentIndex < currentFolderFiles.length - 1;
      const contentHtml = await renderQuickViewContent(file);

      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex flex-col justify-between p-4" onclick="closeQuickView()">
          <div class="flex items-center justify-between text-zinc-300 pt-2 px-4 shrink-0" onclick="event.stopPropagation()">
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold truncate max-w-[200px]">${file.name}</span>
              <span class="text-xs text-zinc-500">(${currentIndex + 1} of ${currentFolderFiles.length})</span>
            </div>
            <button onclick="closeQuickView()" class="p-2 bg-zinc-900 border border-zinc-800 rounded-full hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="flex-1 flex items-center justify-center overflow-hidden my-2 px-2 relative" onclick="event.stopPropagation()">
            ${hasPrev ? `
              <button onclick="navigateQuickView(-1)" class="absolute left-4 z-20 p-3 bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-700 text-white rounded-full shadow-xl backdrop-blur-md transition-transform active:scale-95" title="Previous Media">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
              </button>
            ` : ''}
            ${contentHtml}
            ${hasNext ? `
              <button onclick="navigateQuickView(1)" class="absolute right-4 z-20 p-3 bg-zinc-900/80 hover:bg-zinc-800 border border-zinc-700 text-white rounded-full shadow-xl backdrop-blur-md transition-transform active:scale-95" title="Next Media">
                <i data-lucide="chevron-right" class="w-6 h-6"></i>
              </button>
            ` : ''}
          </div>
          <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 flex items-center justify-center gap-8 text-xs font-semibold text-zinc-200 shrink-0" onclick="event.stopPropagation()">
            <button onclick="copySingleFileClipboard('${file.id}')" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="copy" class="w-5 h-5"></i> Copy</button>
            <button onclick="moveToFolder('${file.id}', false); closeQuickView();" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="folder-output" class="w-5 h-5"></i> Move</button>
            <button onclick="shareFile('${file.id}')" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="share" class="w-5 h-5"></i> Share</button>
            <button onclick="deleteItemConfirm('${file.id}', false); closeQuickView();" class="flex flex-col items-center gap-1 text-red-400 hover:text-red-300"><i data-lucide="trash-2" class="w-5 h-5"></i> Delete</button>
          </div>
        </div>
      `;
    }

    async function navigateQuickView(direction) {
      const currentFolderFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const currentIndex = currentFolderFiles.findIndex(f => f.id === state.quickViewFileId);
      if (currentIndex === -1) return;
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < currentFolderFiles.length) {
        state.quickViewFileId = currentFolderFiles[newIndex].id;
        render();
      }
    }

    function toggleSelectMode() { state.selectMode = !state.selectMode; state.selectedIds = []; closeMenu(); closeHamburgerMenu(); render(); }
    function toggleSelectAll() {
      const items = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      const allSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));
      state.selectedIds = allSelected ? [] : items.map(item => item.id);
      render();
    }

    function handleItemClick(e, id, isFolderItem, isBubbleItem = false) {
      if (state.selectMode) {
        state.selectedIds = state.selectedIds.includes(id) ? state.selectedIds.filter(i => i !== id) : [...state.selectedIds, id];
        render();
        return;
      }
      if (isFolderItem) navigateTo(id);
      else if (isBubbleItem) openTextEditorModal(id);
      else {
        const file = state.files.find(f => f.id === id);
        if (file && (file.fileType === 'link' || file.fileType === 'ios-app')) {
          window.open(file.dataUrl, '_blank');
        } else {
          openQuickView(id);
        }
      }
    }

    function openUploadModal() { state.showUploadModal = true; render(); }
    function closeUploadModal() { state.showUploadModal = false; render(); }
    async function openQuickView(id) { 
      state.quickViewFileId = id; 
      closeMenu(); 
      closeHamburgerMenu(); 
      const file = state.files.find(f => f.id === id);
      if (file && (isVideoFile(file) || isAudioFile(file))) {
        await getOrCreateBlobUrl(file);
      }
      render(); 
    }
    function closeQuickView() { state.quickViewFileId = null; render(); }
    function navigateTo(id) { state.currentFolderId = id; closeMenu(); closeHamburgerMenu(); render(); }
    function navigateBack() {
      if (state.currentFolderId === null) return;
      const currentFolder = state.folders.find(f => f.id === state.currentFolderId);
      if (currentFolder) {
        state.currentFolderId = currentFolder.parentId;
      } else {
        state.currentFolderId = null;
      }
      closeMenu();
      closeHamburgerMenu();
      render();
    }
    function toggleEditMode() {
      state.editMode = !state.editMode;
      closeMenu();
      closeHamburgerMenu();
      render();
    }
    function toggleMenu(e, id) {
      e.stopPropagation();
      state.activeMenuId = state.activeMenuId === id ? null : id;
      render();
    }
    function closeMenu() { if (state.activeMenuId) { state.activeMenuId = null; render(); } }

    function toggleHamburgerMenu(e) {
      e.stopPropagation();
      state.hamburgerMenuOpen = !state.hamburgerMenuOpen;
      render();
    }
    function closeHamburgerMenu() {
      if (state.hamburgerMenuOpen) {
        state.hamburgerMenuOpen = false;
        render();
      }
    }

    function forcePullCloudData() { syncWithGitHub(true); }

    function openTextEditorModal(bubbleId = null, referenceItemId = null) {
      closeMenu();
      closeHamburgerMenu();
      if (bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === bubbleId);
        if (bubble) {
          state.textEditorModal = {
            id: bubble.id,
            text: bubble.text || '',
            fontSize: bubble.fontSize || 'md',
            isBold: !!bubble.isBold,
            isItalic: !!bubble.isItalic,
            isUnderline: !!bubble.isUnderline,
            fontColor: bubble.fontColor || null,
            align: bubble.align || null,
            isNew: false
          };
        }
      } else {
        state.textEditorModal = {
          id: null,
          text: '',
          fontSize: 'md',
          isBold: false,
          isItalic: false,
          isUnderline: false,
          fontColor: null,
          align: null,
          isNew: true,
          referenceItemId: referenceItemId
        };
      }
      render();
      setTimeout(() => {
        const ta = document.getElementById('modal-text-input');
        if (ta) {
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
      }, 50);
    }

    function closeTextEditorModal() {
      state.textEditorModal = null;
      render();
    }

    function updateTextEditorContent(val) {
      if (state.textEditorModal) {
        state.textEditorModal.text = val;
      }
    }

    function applyTextEditorFormat(formatKey, value = null) {
      if (!state.textEditorModal) return;
      const ta = document.getElementById('modal-text-input');
      if (!ta) return;

      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const text = ta.value;
      const hasSelection = start !== end;

      if (formatKey === 'fontSize') {
        state.textEditorModal.fontSize = value;
        render();
        setTimeout(() => { const n = document.getElementById('modal-text-input'); if (n) { n.focus(); n.setSelectionRange(start, end); } }, 30);
        return;
      }
      if (formatKey === 'align') {
        state.textEditorModal.align = state.textEditorModal.align === value ? null : value;
        render();
        setTimeout(() => { const n = document.getElementById('modal-text-input'); if (n) { n.focus(); n.setSelectionRange(start, end); } }, 30);
        return;
      }
      if (formatKey === 'fontColor') {
        state.textEditorModal.fontColor = value;
        render();
        setTimeout(() => { const n = document.getElementById('modal-text-input'); if (n) { n.focus(); n.setSelectionRange(start, end); } }, 30);
        return;
      }

      if (hasSelection) {
        const selectedText = text.substring(start, end);
        let wrapped = selectedText;
        if (formatKey === 'isBold') wrapped = `**${selectedText}**`;
        else if (formatKey === 'isItalic') wrapped = `*${selectedText}*`;
        else if (formatKey === 'isUnderline') wrapped = `__${selectedText}__`;

        ta.value = text.substring(0, start) + wrapped + text.substring(end);
        state.textEditorModal.text = ta.value;
        ta.focus();
        ta.setSelectionRange(start + wrapped.length, start + wrapped.length);
      } else {
        if (formatKey === 'isBold') state.textEditorModal.isBold = !state.textEditorModal.isBold;
        if (formatKey === 'isItalic') state.textEditorModal.isItalic = !state.textEditorModal.isItalic;
        if (formatKey === 'isUnderline') state.textEditorModal.isUnderline = !state.textEditorModal.isUnderline;
        render();
        setTimeout(() => {
          const newTa = document.getElementById('modal-text-input');
          if (newTa) { newTa.focus(); newTa.setSelectionRange(start, end); }
        }, 30);
      }
    }

    async function saveTextEditorModal() {
      const ed = state.textEditorModal;
      if (!ed) return;
      const textVal = ed.text.trim();
      if (!textVal) {
        alert('Please enter some text for the bubble.');
        return;
      }

      const lines = textVal.split('\n').length + Math.floor(textVal.length / 22);
      const dynamicHeight = Math.max(80, lines * 22);

      if (ed.isNew) {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let posX = 20, posY = 20;
        if (ed.referenceItemId) {
          const refItem = allExisting.find(i => i.id === ed.referenceItemId);
          if (refItem && refItem.x !== undefined && refItem.y !== undefined) {
            posX = refItem.x + (refItem.width || 140) + 24;
            posY = refItem.y;
          }
        } else if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 140;
          posX = lastX + lastW + 24;
          posY = lastY;
          if (posX > 1000) { posX = 20; posY = lastY + 160; }
        }

        const bubble = {
          id: uid(),
          isBubble: true,
          text: textVal,
          parentId: state.currentFolderId,
          x: posX,
          y: posY,
          width: 140,
          height: dynamicHeight,
          fontSize: ed.fontSize,
          isBold: ed.isBold,
          isItalic: ed.isItalic,
          isUnderline: ed.isUnderline,
          fontColor: ed.fontColor,
          align: ed.align
        };
        state.textBubbles.push(bubble);
        await saveTextBubble(bubble);
      } else {
        const bubble = state.textBubbles.find(b => b.id === ed.id);
        if (bubble) {
          bubble.text = textVal;
          bubble.height = dynamicHeight;
          bubble.fontSize = ed.fontSize;
          bubble.isBold = ed.isBold;
          bubble.isItalic = ed.isItalic;
          bubble.isUnderline = ed.isUnderline;
          bubble.fontColor = ed.fontColor;
          bubble.align = ed.align;
          await saveTextBubble(bubble);
        }
      }

      state.textEditorModal = null;
      render();
    }

    async function bulkDelete() {
      if (!confirm(`Are you sure you want to delete ${state.selectedIds.length} items?`)) return;
      for (let id of state.selectedIds) {
        state.folders = state.folders.filter(f => f.id !== id);
        state.files = state.files.filter(f => f.id !== id);
        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('folders', id);
        await deleteFromDB('files', id);
        await deleteFromDB('textBubbles', id);
      }
      state.selectedIds = [];
      render();
    }

    async function bulkMove() {
      const targetFolders = state.folders.filter(f => !state.selectedIds.includes(f.id));
      const targetId = prompt("Enter destination folder ID or 'root':\n" + targetFolders.map(f => `- ${f.name} (${f.id})`).join('\n'), 'root');
      if (targetId) {
        const actualParent = targetId === 'root' ? null : targetId;
        for (let id of state.selectedIds) {
          let f = state.folders.find(item => item.id === id);
          let fi = state.files.find(item => item.id === id);
          let b = state.textBubbles.find(item => item.id === id);
          if (f) { f.parentId = actualParent; await saveFolder(f); }
          if (fi) { fi.parentId = actualParent; await saveFile(fi); }
          if (b) { b.parentId = actualParent; await saveTextBubble(b); }
        }
        state.selectedIds = [];
        render();
      }
    }

    async function bulkCopy() {
      for (let id of state.selectedIds) {
        let file = state.files.find(f => f.id === id);
        if (file) {
          const newFile = { ...file, id: uid(), name: file.name + ' (Copy)' };
          delete newFile.x; delete newFile.y; delete newFile.blobUrl;
          if (isVideoFile(newFile) || isAudioFile(newFile)) await getOrCreateBlobUrl(newFile);
          state.files.push(newFile);
          await saveFile(newFile);
        }
      }
      alert(`Successfully copied ${state.selectedIds.length} items to clipboard / internal storage!`);
      state.selectedIds = [];
      render();
    }

    async function bulkShare() {
      for (let id of state.selectedIds) {
        await shareFile(id, true);
      }
    }

    async function copySingleFileClipboard(id) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;

      try {
        if ((file.fileType === 'link' || file.fileType === 'ios-app') && navigator.clipboard) {
          await navigator.clipboard.writeText(file.dataUrl);
          alert('URL scheme/link copied to clipboard successfully!');
          closeMenu();
          render();
          return;
        }
        if (file.dataUrl && navigator.clipboard && window.ClipboardItem) {
          const res = await fetch(file.dataUrl);
          const blob = await res.blob();
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          alert('File copied to clipboard successfully!');
          closeMenu();
          render();
          return;
        }
        if (file.textContent && navigator.clipboard) {
          await navigator.clipboard.writeText(file.textContent);
          alert('Text content copied to clipboard successfully!');
          closeMenu();
          render();
          return;
        }
      } catch (e) {
        console.warn('Direct clipboard API restricted, falling back to data duplicate', e);
      }

      const newFile = { ...file, id: uid(), name: file.name + ' (Copy)' };
      delete newFile.x; delete newFile.y; delete newFile.blobUrl;
      if (isVideoFile(newFile) || isAudioFile(newFile)) {
        await getOrCreateBlobUrl(newFile);
      }
      state.files.push(newFile);
      await saveFile(newFile);
      alert('Copied file successfully inside Aiden Files!');
      closeMenu();
      render();
    }

    async function shareFile(id, isBulk = false) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      if (file.fileType === 'link' || file.fileType === 'ios-app') {
        if (navigator.share) await navigator.share({ title: file.name, text: file.name, url: file.dataUrl });
        else alert('Sharing is not supported on this device.');
        if (!isBulk) closeMenu();
        return;
      }
      if (navigator.canShare && file.dataUrl) {
        try {
          const res = await fetch(file.dataUrl);
          const blob = await res.blob();
          const nativeFile = new File([blob], file.name, { type: file.fileType || blob.type });
          if (navigator.canShare({ files: [nativeFile] })) {
            await navigator.share({ files: [nativeFile], title: file.name });
            if (!isBulk) closeMenu();
            return;
          }
        } catch (e) {}
      }
      if (navigator.share) await navigator.share({ title: file.name, text: file.name, url: file.dataUrl });
      else if (!isBulk) alert('Sharing is not supported on this device.');
      if (!isBulk) closeMenu();
    }

    function triggerFolderCover(id) { state.targetFolderCoverId = id; document.getElementById('folder-cover-input').click(); closeMenu(); }
    document.getElementById('folder-cover-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file && state.targetFolderCoverId) {
        const base64 = await fileToBase64(file);
        const folder = state.folders.find(f => f.id === state.targetFolderCoverId);
        if (folder) { folder.coverUrl = base64; await saveFolder(folder); render(); }
      }
    });

    function triggerChangeImage(id) { state.targetChangeImageId = id; document.getElementById('change-image-input').click(); closeMenu(); }
    document.getElementById('change-image-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file && state.targetChangeImageId) {
        const base64 = await fileToBase64(file);
        const item = state.files.find(f => f.id === state.targetChangeImageId);
        if (item) {
          if (item.fileType === 'ios-app' || item.fileType === 'link') {
            item.thumbnailData = base64;
          } else {
            item.dataUrl = base64;
            if (isVideoFile(item) || isAudioFile(item)) { item.blobUrl = ''; await getOrCreateBlobUrl(item); }
          }
          await saveFile(item);
          render();
        }
      }
    });

    async function renameItem(id, isFolderItem, isBubbleItem = false) {
      const item = isFolderItem ? state.folders.find(f => f.id === id) : isBubbleItem ? state.textBubbles.find(b => b.id === id) : state.files.find(f => f.id === id);
      if (item) {
        const newName = prompt('Rename item:', item.name);
        if (newName && newName.trim() !== '') {
          item.name = newName.trim();
          if (isFolderItem) await saveFolder(item); else if (isBubbleItem) await saveTextBubble(item); else await saveFile(item);
          closeMenu();
          render();
        }
      }
    }

    async function moveToFolder(id, isFolderItem, isBubbleItem = false) {
      const targetFolders = state.folders.filter(f => f.id !== id);
      const targetId = prompt("Enter destination folder ID or 'root':\n" + targetFolders.map(f => `- ${f.name} (${f.id})`).join('\n'), 'root');
      if (targetId) {
        const actualParent = targetId === 'root' ? null : targetId;
        const item = isFolderItem ? state.folders.find(f => f.id === id) : isBubbleItem ? state.textBubbles.find(b => b.id === id) : state.files.find(f => f.id === id);
        if (item) {
          item.parentId = actualParent; delete item.x; delete item.y;
          if (isFolderItem) await saveFolder(item);
          else if (isBubbleItem) await saveTextBubble(item);
          else await saveFile(item);
          closeMenu(); render();
        }
      }
    }

    function resizeByFinger(id, isFolderItem) {
      const el = document.getElementById(`item-${id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const handle = el.querySelector('.resize-handle');
        if (handle) {
          handle.classList.add('ring-4', 'ring-amber-400');
          setTimeout(() => handle.classList.remove('ring-4', 'ring-amber-400'), 1500);
        }
      }
      closeMenu();
    }

    async function snapToOriginalShape(id) {
      const item = state.folders.find(f => f.id === id) || state.files.find(f => f.id === id) || state.textBubbles.find(b => b.id === id);
      if (item) {
        item.width = isFolder(item) ? 96 : isBubble(item) ? 140 : 112;
        item.height = isFolder(item) ? 96 : isBubble(item) ? (Math.max(80, (item.text?.split('\n').length || 1) * 22)) : 144;
        if (isFolder(item)) await saveFolder(item);
        else if (isBubble(item)) await saveTextBubble(item);
        else await saveFile(item);
        closeMenu(); render();
      }
    }

    async function deleteItemConfirm(id, isFolderItem, isBubbleItem = false) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      if (isFolderItem) {
        state.folders = state.folders.filter(f => f.id !== id);
        await deleteFromDB('folders', id);
      } else if (isBubbleItem) {
        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('textBubbles', id);
      } else {
        state.files = state.files.filter(f => f.id !== id);
        await deleteFromDB('files', id);
      }
      closeMenu();
      render();
    }

    function openNewFolderModal() {
      const name = prompt('Folder Name:', 'New Folder');
      if (name && name.trim() !== '') {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let targetX = 20, targetY = 20;
        if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 96;
          targetX = lastX + lastW + 24;
          targetY = lastY;
          if (targetX > 1000) { targetX = 20; targetY = lastY + 160; }
        }

        const folder = { id: uid(), name: name.trim(), parentId: state.currentFolderId, x: targetX, y: targetY, width: 96, height: 96 };
        state.folders.push(folder);
        saveFolder(folder);
        render();
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function fileToText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsText(file);
      });
    }

    function getMimeType(file) {
      if (file.type && file.type !== '') return file.type;
      const ext = file.name.split('.').pop().toLowerCase();
      const mimeMap = {'mp3': 'audio/mpeg', 'm4a': 'audio/mp4', 'wav': 'audio/wav', 'aac': 'audio/aac', 'mp4': 'video/mp4', 'mov': 'video/quicktime', 'webm': 'video/webm', 'm4v': 'video/x-m4v', 'mkv': 'video/x-matroska', 'pdf': 'application/pdf', 'txt': 'text/plain', 'html': 'text/html', 'htm': 'text/html', 'json': 'application/json'};
      return mimeMap[ext] || 'application/octet-stream';
    }

    async function handleFileImport(files) {
      const fileList = Array.from(files);
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        let dataUrl = await fileToBase64(file);
        let textContent = null;
        let inferredType = getMimeType(file);
        let blobUrl = '';

        if (isVideoFile({ fileType: inferredType, name: file.name }) || isAudioFile({ fileType: inferredType, name: file.name })) {
          blobUrl = URL.createObjectURL(file);
        } else if (inferredType.startsWith('text/') || file.name.endsWith('.txt') || file.name.endsWith('.html') || file.name.endsWith('.json') || file.name.endsWith('.csv') || file.name.endsWith('.md')) {
          try { textContent = await fileToText(file); } catch (e) {}
        }

        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let targetX = 20;
        let targetY = 20;
        if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 112;
          targetX = lastX + lastW + 24;
          targetY = lastY;
          if (targetX > 1000) { targetX = 20; targetY = lastY + 160; }
        }

        const item = {
          id: uid(),
          name: file.name,
          fileType: inferredType,
          size: file.size,
          dataUrl: dataUrl,
          blobUrl: blobUrl,
          textContent: textContent,
          parentId: state.currentFolderId,
          x: targetX,
          y: targetY,
          width: 112,
          height: 144
        };

        state.files.push(item);
        await saveFile(item);
      }
      render();
    }

    document.getElementById('file-input').addEventListener('change', (e) => handleFileImport(e.target.files));
    document.getElementById('photo-input').addEventListener('change', (e) => handleFileImport(e.target.files));
    document.getElementById('link-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        state.linkModalThumbData = await fileToBase64(file);
        render();
      }
    });
    document.getElementById('app-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        state.appModalThumbData = await fileToBase64(file);
        render();
      }
    });

    function openLinkModal() {
      state.linkModal = true;
      state.linkModalThumbData = null;
      render();
      setTimeout(() => { const input = document.getElementById('link-url-input'); if (input) input.focus(); }, 50);
    }
    function closeLinkModal() { state.linkModal = false; state.linkModalThumbData = null; render(); }

    function openAppModal() {
      state.appModal = true;
      state.appModalThumbData = null;
      render();
      setTimeout(() => { const input = document.getElementById('app-scheme-input'); if (input) input.focus(); }, 50);
    }
    function closeAppModal() { state.appModal = false; state.appModalThumbData = null; render(); }

    async function saveLinkModal() {
      const urlInput = document.getElementById('link-url-input');
      const nameInput = document.getElementById('link-name-input');
      if (!urlInput) return;
      let url = urlInput.value.trim();
      if (!url) { alert('Please enter a valid URL.'); return; }
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      let name = nameInput ? nameInput.value.trim() : '';
      if (!name) { try { name = new URL(url).hostname; } catch (e) { name = url; } }

      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      let targetX = 20, targetY = 20;
      if (allExisting.length > 0) {
        const lastItem = allExisting[allExisting.length - 1];
        const lastX = lastItem.x !== undefined ? lastItem.x : 20;
        const lastY = lastItem.y !== undefined ? lastItem.y : 20;
        const lastW = lastItem.width || 112;
        targetX = lastX + lastW + 24; targetY = lastY;
        if (targetX > 1000) { targetX = 20; targetY = lastY + 160; }
      }

      const newItem = { id: uid(), name, fileType: 'link', size: 0, dataUrl: url, thumbnailData: state.linkModalThumbData || null, parentId: state.currentFolderId, x: targetX, y: targetY, width: 112, height: 144 };
      state.files.push(newItem);
      await saveFile(newItem);
      closeLinkModal();
      render();
    }

    async function saveAppModal() {
      const schemeInput = document.getElementById('app-scheme-input');
      const nameInput = document.getElementById('app-name-input');
      if (!schemeInput) return;
      let scheme = schemeInput.value.trim();
      if (!scheme) { alert('Please enter a valid URL scheme or App link.'); return; }
      let name = nameInput ? nameInput.value.trim() : '';
      if (!name) name = scheme.split('://')[0] || 'iOS App';

      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      let targetX = 20, targetY = 20;
      if (allExisting.length > 0) {
        const lastItem = allExisting[allExisting.length - 1];
        const lastX = lastItem.x !== undefined ? lastItem.x : 20;
        const lastY = lastItem.y !== undefined ? lastItem.y : 20;
        const lastW = lastItem.width || 112;
        targetX = lastX + lastW + 24; targetY = lastY;
        if (targetX > 1000) { targetX = 20; targetY = lastY + 160; }
      }

      const newItem = { id: uid(), name, fileType: 'ios-app', size: 0, dataUrl: scheme, thumbnailData: state.appModalThumbData || null, parentId: state.currentFolderId, x: targetX, y: targetY, width: 112, height: 144 };
      state.files.push(newItem);
      await saveFile(newItem);
      closeAppModal();
      render();
    }

    function attachDragAndResizeListeners() {
      const elements = document.querySelectorAll('[data-id]');
      elements.forEach(el => {
        let activeDrag = false, activeResize = false;
        let startX, startY, origX, origY, origW, origH;
        const resizeHandle = el.querySelector('.resize-handle');

        const onStart = (e) => {
          if (!state.editMode) return;
          if (e.target.closest('button') || e.target.closest('textarea')) return;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX; startY = touch.clientY;
          if (e.target === resizeHandle || resizeHandle?.contains(e.target)) {
            activeResize = true;
            origW = el.offsetWidth; origH = el.offsetHeight;
            e.stopPropagation();
          } else {
            activeDrag = true;
            origX = parseInt(el.style.left) || 0;
            origY = parseInt(el.style.top) || 0;
          }
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onEnd);
          window.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onEnd);
        };

        const onMove = (e) => {
          const touch = e.touches ? e.touches[0] : e;
          const dx = touch.clientX - startX;
          const dy = touch.clientY - startY;

          if (activeDrag) {
            let newX = Math.max(0, origX + dx);
            let newY = Math.max(0, origY + dy);
            newX = Math.round(newX / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
            newY = Math.round(newY / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
            el.style.left = `${newX}px`;
            el.style.top = `${newY}px`;
          } else if (activeResize) {
            let newW = Math.max(80, origW + dx);
            let newH = Math.max(80, origH + dy);
            newW = Math.round(newW / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
            newH = Math.round(newH / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
            el.style.width = `${newW}px`;
            el.style.height = `${newH}px`;
          }
        };

        const onEnd = async (e) => {
          if (activeDrag || activeResize) {
            const id = el.getAttribute('data-id');
            const finalX = parseInt(el.style.left) || 0;
            const finalY = parseInt(el.style.top) || 0;
            const finalW = parseInt(el.style.width) || el.offsetWidth;
            const finalH = parseInt(el.style.height) || el.offsetHeight;

            let item = state.folders.find(f => f.id === id) || state.files.find(f => f.id === id) || state.textBubbles.find(b => b.id === id);
            if (item) {
              item.x = finalX;
              item.y = finalY;
              item.width = finalW;
              item.height = finalH;
              if (isFolder(item)) await saveFolder(item);
              else if (isBubble(item)) await saveTextBubble(item);
              else await saveFile(item);
            }
          }
          activeDrag = false;
          activeResize = false;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
        };

        el.addEventListener('mousedown', onStart);
        el.addEventListener('touchstart', onStart, { passive: true });
      });
    }

    loadData();
  </script>
