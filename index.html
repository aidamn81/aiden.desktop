<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gothic Archive - Main Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0214;
            color: #f0e6f6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Top Navigation Bar */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 15px;
            background: linear-gradient(to bottom, rgba(11, 2, 20, 0.98), rgba(11, 2, 20, 0.9));
            z-index: 100;
        }

        .nav-bar a {
            color: #d8b4fe;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 6px 10px;
            background: rgba(46, 16, 101, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-bar a:hover {
            color: #ffffff;
            background: rgba(76, 29, 149, 0.6);
            border-color: rgba(236, 72, 153, 0.6);
            text-shadow: 0 0 10px #ec4899, 0 0 20px #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* Page Layout & Sections */
        .page-container {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 120px;
            padding-bottom: 80px;
            background-color: #0b0214;
            gap: 40px;
        }

        .archive-section {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            background: rgba(18, 3, 32, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(5px);
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #f472b6;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
            letter-spacing: 2px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            padding-bottom: 10px;
        }

        .section-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #f0e6f6;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .page-container {
                padding-top: 150px;
            }
            .nav-bar {
                gap: 6px;
                padding: 8px 10px;
            }
            .nav-bar a {
                font-size: 0.7rem;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="nav-bar">
        <a href="index.html">Home</a>
        <a href="main.html">Main Workspace</a>
        <a href="travel.html">Travel</a>
        <a href="accom.html">Accommodation</a>
        <a href="events.html">Events</a>
        <a href="celebrant-ceremonies.html">Celebrant Ceremonies</a>
        <a href="reviews.html">Reviews</a>
        <a href="merchandise.html">Merchandise</a>
    </nav>

    <!-- Main Content Container -->
    <div class="page-container">
        
        <section class="archive-section">
            <h2 class="section-title">The Gothic Archive</h2>
            <div class="section-content">
                <p>Welcome to your secure private workspace. All relics, inventory folders, data structures, and tools are successfully linked and operational.</p>
            </div>
        </section>

    </div>

</body>
</html>
