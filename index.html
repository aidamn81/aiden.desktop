<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Gothic Archive (Formation & Snap-to-Grid)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a060d;
      --bg-secondary: #130b18;
      --bg-tertiary: #1c1024;
      --accent-purple: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --border-gothic: rgba(139, 92, 246, 0.2);
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --grid-color: rgba(139, 92, 246, 0.07);
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .gothic-grid-bg {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(28, 16, 36, 0.4) 0%, rgba(10, 6, 13, 0.9) 100%),
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    .edit-grid-visible {
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(28, 16, 36, 0.4) 0%, rgba(10, 6, 13, 0.9) 100%),
        linear-gradient(to right, rgba(167, 139, 250, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(167, 139, 250, 0.15) 1px, transparent 1px) !important;
    }

    .glass-panel {
      background: rgba(19, 11, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-gothic);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .gothic-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .gothic-scrollbar::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    .gothic-scrollbar::-webkit-scrollbar-thumb {
      background: var(--border-gothic);
      border-radius: 3px;
    }
    .gothic-scrollbar::-webkit-scrollbar-thumb:hover {
      background: var(--accent-purple);
    }

    .item-card {
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .item-card:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 24px;
      height: 24px;
      cursor: nwse-resize;
      display: none;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 3px;
      color: var(--text-muted);
      z-index: 20;
    }
    .edit-mode .resize-handle {
      display: flex;
    }

    /* Infinite canvas viewport wrapper */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      touch-action: pan-x pan-y pinch-zoom;
    }

    #canvas-container {
      position: relative;
      width: 6000px;
      height: 6000px;
      transform-origin: 0 0;
    }
  </style>
</head>
<body class="w-screen h-screen relative gothic-grid-bg">

  <!-- TOP FORMATTING BAR -->
  <header class="absolute top-0 left-0 right-0 h-16 glass-panel z-50 flex items-center justify-between px-4 border-b border-purple-900/30">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-lg bg-purple-950 border border-purple-500/30 flex items-center justify-center text-purple-400 shadow-inner">
        <i class="fa-solid fa-book-skull text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-widest text-purple-200 uppercase" id="archive-title">The Gothic Archive</h1>
        <div class="text-xs text-purple-400/70 flex items-center space-x-2">
          <span id="breadcrumb-display">Main Desktop</span>
          <span id="zoom-indicator">100%</span>
        </div>
      </div>
    </div>

    <!-- FORMATTING BAR TOOLS / OPTIONS -->
    <div class="flex items-center space-x-2 overflow-x-auto gothic-scrollbar py-1">
      <button onclick="zoomIn()" class="p-2 rounded-lg bg-purple-950/60 border border-purple-500/30 hover:bg-purple-900/80 text-purple-300 transition text-xs flex items-center space-x-1" title="Zoom In">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button onclick="zoomOut()" class="p-2 rounded-lg bg-purple-950/60 border border-purple-500/30 hover:bg-purple-900/80 text-purple-300 transition text-xs flex items-center space-x-1" title="Zoom Out">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button onclick="resetZoom()" class="p-2 rounded-lg bg-purple-950/60 border border-purple-500/30 hover:bg-purple-900/80 text-purple-300 transition text-xs flex items-center space-x-1" title="Reset Zoom">
        <i class="fa-solid fa-expand"></i>

      <div class="h-5 w-px bg-purple-800/40 mx-1"></div>

      <button onclick="openNewFolderModal()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-folder-plus text-purple-400"></i>
        <span class="hidden sm:inline">New Folder</span>
      </button>
      <button onclick="document.getElementById('file-input').click()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-file-arrow-up text-purple-400"></i>
        <span class="hidden sm:inline">Upload File</span>

      <button onclick="openTextEditorModal()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-note-sticky text-purple-400"></i>
        <span class="hidden sm:inline">Text Bubble</span>
      </button>
      <button onclick="openLinkModal()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-link text-purple-400"></i>
        <span class="hidden sm:inline">Web Link</span>

      <button onclick="openWebVideoModal()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-video text-purple-400"></i>
        <span class="hidden sm:inline">Web Video</span>

      <button onclick="openAppModal()" class="px-3 py-1.5 rounded-lg bg-purple-900/40 border border-purple-500/30 hover:bg-purple-800/60 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">

      </button>

      <div class="h-5 w-px bg-purple-800/40 mx-1"></div>

      <button id="edit-mode-btn" onclick="toggleEditMode()" class="px-3 py-1.5 rounded-lg bg-purple-950 border border-purple-500/50 hover:bg-purple-900 text-purple-200 transition text-xs flex items-center space-x-1.5 shadow-sm">
        <i class="fa-solid fa-lock-open text-purple-400" id="edit-mode-icon"></i>
        <span id="edit-mode-text">Edit: ON</span>
      </button>

      <button onclick="saveArchiveState()" class="px-3 py-1.5 rounded-lg bg-purple-950 border border-purple-500/30 hover:bg-purple-900 text-purple-200 transition text-xs flex items-center space-x-1.5" title="Save State">
        <i class="fa-solid fa-floppy-disk text-purple-400"></i>

      </button>
      <button onclick="loadArchiveState()" class="px-3 py-1.5 rounded-lg bg-purple-950 border border-purple-500/30 hover:bg-purple-900 text-purple-200 transition text-xs flex items-center space-x-1.5" title="Load State">
        <i class="fa-solid fa-folder-open text-purple-400"></i>
        <span class="hidden md:inline">Load</span>
      </button>

      <div class="h-5 w-px bg-purple-800/40 mx-1"></div>

      <button onclick="goBack()" id="back-btn" class="px-3 py-1.5 rounded-lg bg-purple-950/40 border border-purple-500/20 hover:bg-purple-900/60 text-purple-300 transition text-xs flex items-center space-x-1 disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="hidden sm:inline">Back</span>
      </button>
    </div>
  </header>

  <!-- HIDDEN INPUTS -->
  <input type="file" id="file-input" class="hidden" multiple>
  <input type="file" id="photo-input" class="hidden" accept="image/*" multiple>

  <!-- INFINITE CANVAS VIEWPORT -->

    <div id="canvas-container">
      <!-- RENDERED ITEMS GO HERE -->

    <i class="fa-solid fa-circle-check text-purple-400"></i>
    <span id="toast-msg">Action completed</span>
  </div>

  <!-- MAIN SCRIPT -->
  <script>
    const CONFIG = {
      GRID_SIZE: 40
    };

    let state = {
      currentFolderId: 'root',
      folderPath: [],
      editMode: true,
      zoomLevel: 1,
      folders: [],
      files: [],
      textBubbles: [],
      activeUploads: [],
      linkModal: false,
      webVideoModal: false,
      appModal: false,
      linkModalThumbData: null,
      webVideoModalThumbData: null,
      appModalThumbData: null
    };

    let db = null;

    // IndexedDB Initialization
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('GothicArchiveDB', 2);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('folders')) database.createObjectStore('folders', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('files')) database.createObjectStore('files', { keyPath: 'id' });
          if (!database.objectStoreNames.contains('textBubbles')) database.createObjectStore('textBubbles', { keyPath: 'id' });
        };
      });
    }

    async function loadDataFromDB() {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const transaction = db.transaction(['folders', 'files', 'textBubbles'], 'readonly');
        let fLoad = [], fiLoad = [], tLoad = [];

        transaction.objectStore('folders').getAll().onsuccess = (e) => { fLoad = e.target.result; };
        transaction.objectStore('files').getAll().onsuccess = (e) => { fiLoad = e.target.result; };
        transaction.objectStore('textBubbles').getAll().onsuccess = (e) => { tLoad = e.target.result; };

        transaction.oncomplete = () => {
          resolve({ folders: fLoad, files: fiLoad, textBubbles: tLoad });
        };
      });
    }

    async function saveToDB(storeName, item) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], 'readwrite');
        const store = transaction.objectStore(storeName);
        store.put(item);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function deleteFromDB(storeName, id) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([storeName], 'readwrite');
        const store = transaction.objectStore(storeName);
        store.delete(id);
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
      });
    }

    async function saveFolder(folder) { await saveToDB('folders', folder); }
    async function saveFile(file) { await saveToDB('files', file); }
    async function saveTextBubble(bubble) { await saveToDB('textBubbles', bubble); }

    async function loadData() {
      try {
        const data = await loadDataFromDB();
        if (data.folders.length > 0 || data.files.length > 0 || data.textBubbles.length > 0) {
          state.folders = data.folders;
          state.files = data.files;
          state.textBubbles = data.textBubbles;
        } else {
          // Default initial items
          state.folders = [
            { id: 'root', name: 'Main Desktop', parentId: null, x: 0, y: 0, width: 96, height: 96 },
            { id: 'f1', name: 'Grimoire', parentId: 'root', x: 40, y: 40, width: 96, height: 96 }
          ];
          state.files = [
            { id: 'fi1', name: 'Welcome.txt', fileType: 'text/plain', textContent: 'Welcome to The Gothic Archive.\nYour sanctuary for dark romance, code, and creative freedom.', parentId: 'root', x: 160, y: 40, width: 112, height: 144 }
          ];
          state.textBubbles = [
            { id: 'tb1', name: 'Sanctuary Note', content: 'Remember to stay grounded and embrace the aesthetics.', parentId: 'root', x: 300, y: 40, width: 140, height: 80 }
          ];
          for (let f of state.folders) await saveFolder(f);
          for (let fi of state.files) await saveFile(fi);
          for (let tb of state.textBubbles) await saveTextBubble(tb);
        }
      } catch (err) {
        console.error('Error loading DB', err);
      }
      render();
    }

    function uid() {
      return 'id_' + Math.random().toString(36.substring(2, 9)) + Date.now().toString(36);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      msgEl.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Zoom Functions
    function zoomIn() {
      state.zoomLevel = Math.min(2.5, state.zoomLevel + 0.15);
      applyZoom();
    }
    function zoomOut() {
      state.zoomLevel = Math.max(0.4, state.zoomLevel - 0.15);
      applyZoom();
    }
    function resetZoom() {
      state.zoomLevel = 1;
      applyZoom();
    }
    function applyZoom() {
      const container = document.getElementById('canvas-container');
      container.style.transform = `scale(${state.zoomLevel})`;
      document.getElementById('zoom-indicator').textContent = Math.round(state.zoomLevel * 100) + '%';
    }

    // Toggle Edit Mode
    function toggleEditMode() {
      state.editMode = !state.editMode;
      const btnIcon = document.getElementById('edit-mode-icon');
      const btnText = document.getElementById('edit-mode-text');
      const body = document.body;

      if (state.editMode) {
        btnIcon.className = 'fa-solid fa-lock-open text-purple-400';
        btnText.textContent = 'Edit: ON';
        body.classList.add('edit-grid-visible');
        showToast('Edit Mode Enabled: Drag, Resize & Snap Active');
      } else {
        btnIcon.className = 'fa-solid fa-lock text-purple-400';
        btnText.textContent = 'Edit: OFF';
        body.classList.remove('edit-grid-visible');
        showToast('Edit Mode Locked');
      }
      render();
    }

    // Navigation & Breadcrumbs
    function openFolder(folderId) {
      const folder = state.folders.find(f => f.id === folderId);
      if (!folder) return;
      state.folderPath.push({ id: state.currentFolderId, name: document.getElementById('breadcrumb-display').textContent });
      state.currentFolderId = folderId;
      document.getElementById('breadcrumb-display').textContent = folder.name;
      document.getElementById('back-btn').disabled = false;
      render();
    }

    function goBack() {
      if (state.folderPath.length === 0) return;
      const prev = state.folderPath.pop();
      state.currentFolderId = prev.id;
      document.getElementById('breadcrumb-display').textContent = prev.name;
      if (state.folderPath.length === 0) {
        document.getElementById('back-btn').disabled = true;
      }
      render();
    }

    // File Helpers
    function isFolder(item) { return item.fileType === undefined && item.content === undefined; }
    function isBubble(item) { return item.content !== undefined; }
    function isImageFile(item) {
      return item.fileType && (item.fileType.startsWith('image/') || item.name.match(/\.(jpeg|jpg|gif|png|webp|svg)$/i));
    }
    function isVideoFile(item) {
      return item.fileType && (item.fileType.startsWith('video/') || item.name.match(/\.(mp4|webm|ogg|mov)$/i));
    }
    function isAudioFile(item) {
      return item.fileType && (item.fileType.startsWith('audio/') || item.name.match(/\.(mp3|wav|ogg|m4a)$/i));
    }

    const blobUrlCache = new Map();
    async function getOrCreateBlobUrl(fileItem) {
      if (!fileItem.rawBlob && fileItem.dataUrl && fileItem.dataUrl.startsWith('data:')) {
        try {
          const res = await fetch(fileItem.dataUrl);
          fileItem.rawBlob = await res.blob();
        } catch(e) {}
      }
      if (!fileItem.rawBlob) return fileItem.dataUrl;
      if (blobUrlCache.has(fileItem.id)) return blobUrlCache.get(fileItem.id);
      const url = URL.createObjectURL(fileItem.rawBlob);
      blobUrlCache.set(fileItem.id, url);
      return url;
    }

    // RENDER SYSTEM
    function render() {
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';

      const currentFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const currentFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const currentBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);

      // Render Folders
      currentFolders.forEach(folder => {
        const el = document.createElement('div');
        el.className = 'absolute item-card glass-panel rounded-2xl flex flex-col items-center justify-center p-3 cursor-pointer group';
        el.setAttribute('data-id', folder.id);
        el.style.left = (folder.x !== undefined ? folder.x : 20) + 'px';
        el.style.top = (folder.y !== undefined ? folder.y : 20) + 'px';
        el.style.width = (folder.width || 96) + 'px';
        el.style.height = (folder.height || 96) + 'px';

        el.innerHTML = `
          <div class="text-3xl text-purple-400 mb-1 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-folder"></i>
          </div>
          <span class="text-xs text-purple-200 text-center truncate w-full px-1">${folder.name}</span>
          <div class="resize-handle"><i class="fa-solid fa-caret-down text-[10px]"></i></div>
        `;

        el.addEventListener('dblclick', () => openFolder(folder.id));
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openContextMenu(e, folder.id, true, false);
        });
        container.appendChild(el);
      });

      // Render Files
      currentFiles.forEach(file => {
        const el = document.createElement('div');
        el.className = 'absolute item-card glass-panel rounded-2xl flex flex-col items-center justify-between p-3 cursor-pointer group overflow-hidden';
        el.setAttribute('data-id', file.id);
        el.style.left = (file.x !== undefined ? file.x : 20) + 'px';
        el.style.top = (file.y !== undefined ? file.y : 20) + 'px';
        el.style.width = (file.width || 112) + 'px';
        el.style.height = (file.height || 144) + 'px';

        let iconHtml = '<i class="fa-solid fa-file text-2xl text-purple-400"></i>';
        if (isImageFile(file) && file.dataUrl) {
          iconHtml = `<div class="w-full h-20 rounded-lg overflow-hidden bg-black/40 flex items-center justify-center"><img src="${file.dataUrl}" class="w-full h-full object-cover"></div>`;
        } else if (file.fileType === 'link') {
          if (file.thumbnailData) {
            iconHtml = `<div class="w-full h-20 rounded-lg overflow-hidden bg-black/40 flex items-center justify-center"><img src="${file.thumbnailData}" class="w-full h-full object-cover"></div>`;
          } else {
            iconHtml = '<div class="w-10 h-10 rounded-full bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-300"><i class="fa-solid fa-link text-lg"></i></div>';
          }
        } else if (file.fileType === 'web-video') {
          if (file.thumbnailData) {
            iconHtml = `<div class="w-full h-20 rounded-lg overflow-hidden bg-black/40 flex items-center justify-center"><img src="${file.thumbnailData}" class="w-full h-full object-cover"></div>`;
          } else {
            iconHtml = '<div class="w-10 h-10 rounded-full bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-300"><i class="fa-solid fa-video text-lg"></i></div>';
          }
        } else if (file.fileType === 'ios-app') {
          if (file.thumbnailData) {
            iconHtml = `<div class="w-12 h-12 rounded-xl overflow-hidden bg-black/40 flex items-center justify-center shadow-md"><img src="${file.thumbnailData}" class="w-full h-full object-cover"></div>`;
          } else {
            iconHtml = '<div class="w-12 h-12 rounded-xl bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-300"><i class="fa-solid fa-mobile-screen text-lg"></i></div>';
          }
        } else if (isVideoFile(file)) {
          iconHtml = '<div class="w-10 h-10 rounded-full bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-300"><i class="fa-solid fa-film text-lg"></i></div>';
        } else if (isAudioFile(file)) {
          iconHtml = '<div class="w-10 h-10 rounded-full bg-purple-950 border border-purple-500/40 flex items-center justify-center text-purple-300"><i class="fa-solid fa-music text-lg"></i></div>';
        }

        el.innerHTML = `
          ${iconHtml}
          <span class="text-xs text-purple-200 text-center truncate w-full px-1 mt-1">${file.name}</span>
          <div class="resize-handle"><i class="fa-solid fa-caret-down text-[10px]"></i></div>
        `;

        el.addEventListener('dblclick', () => openFileViewer(file));
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openContextMenu(e, file.id, false, false);
        });
        container.appendChild(el);
      });

      // Render Text Bubbles
      currentBubbles.forEach(bubble => {
        const el = document.createElement('div');
        el.className = 'absolute item-card glass-panel rounded-2xl flex flex-col p-3 cursor-pointer group overflow-hidden border border-purple-500/30';
        el.setAttribute('data-id', bubble.id);
        el.style.left = (bubble.x !== undefined ? bubble.x : 20) + 'px';
        el.style.top = (bubble.y !== undefined ? bubble.y : 20) + 'px';
        el.style.width = (bubble.width || 140) + 'px';
        el.style.height = (bubble.height || 80) + 'px';

        el.innerHTML = `
          <div class="flex items-center justify-between border-b border-purple-900/40 pb-1 mb-1">
            <span class="font-bold text-xs text-purple-300 truncate">${bubble.name || 'Note'}</span>
            <i class="fa-solid fa-note-sticky text-[10px] text-purple-400"></i>
          </div>
          <div class="text-[11px] text-purple-200/80 overflow-hidden flex-1">${bubble.content || ''}</div>
          <div class="resize-handle"><i class="fa-solid fa-caret-down text-[10px]"></i></div>
        `;

        el.addEventListener('dblclick', () => openTextEditorModal(bubble.id));
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          openContextMenu(e, bubble.id, false, true);
        });
        container.appendChild(el);
      });

      attachDragAndResizeListeners();
    }

    // CONTEXT MENU
    function openContextMenu(e, id, isFolderItem, isBubbleItem) {
      const menu = document.getElementById('context-menu');
      const itemsContainer = document.getElementById('context-menu-items');
      menu.style.left = e.clientX + 'px';
      menu.style.top = e.clientY + 'px';
      menu.classList.remove('hidden');

      let html = `
        <button onclick="resizeByFinger('${id}', ${isFolderItem})" class="px-4 py-2 hover:bg-purple-900/60 text-left flex items-center space-x-2">
          <i class="fa-solid fa-expand text-purple-400 w-4"></i><span>Resize by finger</span>
        </button>
        <button onclick="snapToOriginalShape('${id}')" class="px-4 py-2 hover:bg-purple-900/60 text-left flex items-center space-x-2">
          <i class="fa-solid fa-compress text-purple-400 w-4"></i><span>Snap to original shape</span>
        </button>
        <button onclick="renameItem('${id}', ${isFolderItem}, ${isBubbleItem})" class="px-4 py-2 hover:bg-purple-900/60 text-left flex items-center space-x-2">
          <i class="fa-solid fa-pen text-purple-400 w-4"></i><span>Rename</span>
        </button>
        <button onclick="moveToFolder('${id}', ${isFolderItem}, ${isBubbleItem})" class="px-4 py-2 hover:bg-purple-900/60 text-left flex items-center space-x-2">
          <i class="fa-solid fa-folder-tree text-purple-400 w-4"></i><span>Move to folder</span>
        </button>
        <button onclick="deleteItemConfirm('${id}', ${isFolderItem}, ${isBubbleItem})" class="px-4 py-2 hover:bg-red-950/60 text-left flex items-center space-x-2 text-red-300">
          <i class="fa-solid fa-trash text-red-400 w-4"></i><span>Delete with confirmation</span>
        </button>
      `;

      if (!isFolderItem && !isBubbleItem) {
        html += `
          <button onclick="changeImage('${id}')" class="px-4 py-2 hover:bg-purple-900/60 text-left flex items-center space-x-2">
            <i class="fa-solid fa-image text-purple-400 w-4"></i><span>Change the image</span>
          </button>
        `;
      }

      itemsContainer.innerHTML = html;
    }

    function closeMenu() {
      document.getElementById('context-menu').classList.add('hidden');
    }
    window.addEventListener('click', closeMenu);

    // Context Menu Actions
    async function changeImage(id) {
      closeMenu();
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const f = e.target.files[0];
        if (f) {
          file.dataUrl = await fileToBase64(f);
          file.rawBlob = f;
          await saveFile(file);
          render();
          showToast('Image updated');
        }
      };
      input.click();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function renameItem(id, isFolderItem, isBubbleItem = false) {
      closeMenu();
      if (isBubbleItem) {
        openTextEditorModal(id);
        return;
      }
      let item = isFolderItem ? state.folders.find(f => f.id === id) : state.files.find(f => f.id === id);
      if (!item) return;
      const newName = prompt('Enter new name:', item.name);
      if (newName !== null && newName.trim() !== '') {
        item.name = newName.trim();
        if (isFolderItem) await saveFolder(item);
        else await saveFile(item);
        render();
      }
    }

    async function moveToFolder(id, isFolderItem, isBubbleItem = false) {
      closeMenu();
      let item = isFolderItem ? state.folders.find(f => f.id === id) : (isBubbleItem ? state.textBubbles.find(b => b.id === id) : state.files.find(f => f.id === id));
      if (!item) return;

      let msg = "Select destination folder:\n- Main Desktop (root)\n";
      const allFolders = state.folders.filter(f => f.id !== 'root' && f.id !== id);
      allFolders.forEach(f => {
        msg += `- ${f.name} (ID: ${f.id})\n`;
      });
      const input = prompt(msg + "\nEnter the Folder ID or type 'root' for Main Desktop:", "root");
      if (input === null) return;
      const actualParent = (input.trim() === '' || input.trim().toLowerCase() === 'root') ? null : input.trim();
      item.parentId = actualParent;

      if (isFolderItem) await saveFolder(item);
      else if (isBubbleItem) await saveTextBubble(item);
      else await saveFile(item);
      render();
    }

    function resizeByFinger(id, isFolderItem) {
      closeMenu();
      const item = isFolderItem ? state.folders.find(f => f.id === id) : state.files.find(f => f.id === id);
      if (!item) return;
      const w = prompt('Enter width in pixels (e.g. 120, 180, 240):', item.width || (isFolderItem ? 96 : 112));
      const h = prompt('Enter height in pixels (e.g. 120, 180, 240):', item.height || (isFolderItem ? 96 : 144));
      if (w !== null && h !== null) {
        item.width = parseInt(w) || (isFolderItem ? 96 : 112);
        item.height = parseInt(h) || (isFolderItem ? 96 : 144);
        if (isFolderItem) saveFolder(item);
        else saveFile(item);
        render();
      }
    }

    async function snapToOriginalShape(id) {
      closeMenu();
      let item = state.folders.find(f => f.id === id) || state.files.find(f => f.id === id) || state.textBubbles.find(b => b.id === id);
      if (!item) return;
      if (isFolder(item)) {
        item.width = 96; item.height = 96;
        await saveFolder(item);
      } else if (isBubble(item)) {
        item.width = 140; item.height = 80;
        await saveTextBubble(item);
      } else {
        item.width = 112; item.height = 144;
        await saveFile(item);
      }
      render();
    }

    async function deleteItemConfirm(id, isFolderItem, isBubbleItem = false) {
      closeMenu();
      let item = isFolderItem ? state.folders.find(f => f.id === id) : (isBubbleItem ? state.textBubbles.find(b => b.id === id) : state.files.find(f => f.id === id));
      if (!item) return;
      if (!confirm(`Are you sure you want to delete "${item.name || 'this item'}"?`)) return;

      state.folders = state.folders.filter(f => f.id !== id);
      state.files = state.files.filter(f => f.id !== id);
      state.textBubbles = state.textBubbles.filter(b => b.id !== id);

      await deleteFromDB('folders', id);
      await deleteFromDB('files', id);
      await deleteFromDB('textBubbles', id);
      render();
      showToast('Item deleted');
    }

    function openNewFolderModal() {
      const name = prompt('Enter new folder name:', 'New Folder');
      if (name && name.trim()) {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];
        let posX = 20, posY = 20;
        if (allExisting.length > 0) {
          const last = allExisting[allExisting.length - 1];
          posX = (last.x !== undefined ? last.x : 20) + (last.width || 96) + 24;
          posY = last.y !== undefined ? last.y : 20;
          if (posX > 1000) { posX = 20; posY += 160; }
        }
        const newFolder = {
          id: uid(),
          name: name.trim(),
          parentId: state.currentFolderId,
          x: posX,
          y: posY,
          width: 96,
          height: 96
        };
        state.folders.push(newFolder);
        saveFolder(newFolder);
        render();
      }
    }

    // Text Bubble Modal & Editing
    let activeBubbleId = null;
    function openTextEditorModal(bubbleId = null) {
      activeBubbleId = bubbleId;
      const modal = document.getElementById('text-editor-modal');
      const titleInput = document.getElementById('text-bubble-title');
      const contentInput = document.getElementById('text-bubble-content');
      const titleModal = document.getElementById('text-modal-title');

      if (bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === bubbleId);
        if (bubble) {
          titleModal.textContent = 'Edit Text Bubble';
          titleInput.value = bubble.name || '';
          contentInput.value = bubble.content || '';
        }
      } else {
        titleModal.textContent = 'Gothic Text Bubble';
        titleInput.value = '';
        contentInput.value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeTextEditorModal() {
      document.getElementById('text-editor-modal').classList.add('hidden');
      activeBubbleId = null;
    }

    async function saveTextBubbleModal() {
      const title = document.getElementById('text-bubble-title').value.trim() || 'Note';
      const content = document.getElementById('text-bubble-content').value;

      if (activeBubbleId) {
        const bubble = state.textBubbles.find(b => b.id === activeBubbleId);
        if (bubble) {
          bubble.name = title;
          bubble.content = content;
          await saveTextBubble(bubble);
        }
      } else {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];
        let posX = 20, posY = 20;
        if (allExisting.length > 0) {
          const last = allExisting[allExisting.length - 1];
          posX = (last.x !== undefined ? last.x : 20) + (last.width || 140) + 24;
          posY = last.y !== undefined ? last.y : 20;
        }
        const newBubble = {
          id: uid(),
          name: title,
          content: content,
          parentId: state.currentFolderId,
          x: posX,
          y: posY,
          width: 140,
          height: 80
        };
        state.textBubbles.push(newBubble);
        await saveTextBubble(newBubble);
      }
      closeTextEditorModal();
      render();
      showToast('Text bubble saved');
    }

    // Link, Video & App Modals
    function openLinkModal() { state.linkModal = true; state.linkModalThumbData = null; document.getElementById('link-modal').classList.remove('hidden'); }
    function closeLinkModal() { state.linkModal = false; state.linkModalThumbData = null; document.getElementById('link-modal').classList.add('hidden'); }
    async function saveLinkModal() {
      const urlInput = document.getElementById('link-url-input');
      const nameInput = document.getElementById('link-name-input');
      if (!urlInput || !urlInput.value.trim()) { alert('Please enter a valid URL.'); return; }
      let url = urlInput.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      let name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : url;

      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      let posX = 20, posY = 20;
      if (allExisting.length > 0) {
        const last = allExisting[allExisting.length - 1];
        posX = (last.x !== undefined ? last.x : 20) + (last.width || 112) + 24;
        posY = last.y !== undefined ? last.y : 20;
      }

      const newFile = {
        id: uid(),
        name: name,
        fileType: 'link',
        dataUrl: url,
        thumbnailData: state.linkModalThumbData,
        parentId: state.currentFolderId,
        x: posX,
        y: posY,
        width: 112,
        height: 144
      };
      state.files.push(newFile);
      await saveFile(newFile);
      closeLinkModal();
      render();
      showToast('Web link added');
    }

    function openWebVideoModal() { state.webVideoModal = true; state.webVideoModalThumbData = null; document.getElementById('web-video-modal').classList.remove('hidden'); }
    function closeWebVideoModal() { state.webVideoModal = false; state.webVideoModalThumbData = null; document.getElementById('web-video-modal').classList.add('hidden'); }
    async function saveWebVideoModal() {
      const urlInput = document.getElementById('web-video-url-input');
      const nameInput = document.getElementById('web-video-name-input');
      if (!urlInput || !urlInput.value.trim()) { alert('Please enter a video URL or embed code.'); return; }
      let url = urlInput.value.trim();
      let name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : 'Web Video';

      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      let posX = 20, posY = 20;
      if (allExisting.length > 0) {
        const last = allExisting[allExisting.length - 1];
        posX = (last.x !== undefined ? last.x : 20) + (last.width || 112) + 24;
        posY = last.y !== undefined ? last.y : 20;
      }

      const newFile = {
        id: uid(),
        name: name,
        fileType: 'web-video',
        dataUrl: url,
        thumbnailData: state.webVideoModalThumbData,
        parentId: state.currentFolderId,
        x: posX,
        y: posY,
        width: 112,
        height: 144
      };
      state.files.push(newFile);
      await saveFile(newFile);
      closeWebVideoModal();
      render();
      showToast('Web video added');
    }

    function openAppModal() { state.appModal = true; state.appModalThumbData = null; document.getElementById('app-modal').classList.remove('hidden'); }
    function closeAppModal() { state.appModal = false; state.appModalThumbData = null; document.getElementById('app-modal').classList.add('hidden'); }
    async function saveAppModal() {
      const schemeInput = document.getElementById('app-scheme-input');
      const nameInput = document.getElementById('app-name-input');
      if (!schemeInput || !schemeInput.value.trim()) { alert('Please enter an app scheme or deep link URL.'); return; }
      let scheme = schemeInput.value.trim();
      let name = nameInput && nameInput.value.trim() ? nameInput.value.trim() : 'iOS App';

      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      let posX = 20, posY = 20;
      if (allExisting.length > 0) {
        const last = allExisting[allExisting.length - 1];
        posX = (last.x !== undefined ? last.x : 20) + (last.width || 112) + 24;
        posY = last.y !== undefined ? last.y : 20;
      }

      const newFile = {
        id: uid(),
        name: name,
        fileType: 'ios-app',
        dataUrl: scheme,
        thumbnailData: state.appModalThumbData,
        parentId: state.currentFolderId,
        x: posX,
        y: posY,
        width: 112,
        height: 144
      };
      state.files.push(newFile);
      await saveFile(newFile);
      closeAppModal();
      render();
      showToast('iOS app shortcut added');
    }

    document.getElementById('link-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) state.linkModalThumbData = await fileToBase64(file);
    });
    document.getElementById('web-video-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) state.webVideoModalThumbData = await fileToBase64(file);
    });
    document.getElementById('app-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) state.appModalThumbData = await fileToBase64(file);
    });

    // File Viewer
    async function openFileViewer(file) {
      const modal = document.getElementById('file-viewer-modal');
      document.getElementById('viewer-title').textContent = file.name;
      const contentContainer = document.getElementById('viewer-content');
      const downloadBtn = document.getElementById('viewer-download');

      const blobUrl = await getOrCreateBlobUrl(file);
      downloadBtn.href = blobUrl;
      downloadBtn.download = file.name;

      let html = '';
      if (file.fileType === 'link') {
        html = `<div class="text-center space-y-4">
          <p class="text-purple-200">Open external link:</p>
          <a href="${file.dataUrl}" target="_blank" class="px-6 py-3 rounded-xl bg-purple-700 hover:bg-purple-600 text-white font-semibold inline-block shadow-lg">${file.dataUrl}</a>
        </div>`;
      } else if (file.fileType === 'web-video') {
        html = `<div class="w-full h-full flex items-center justify-center">
          <iframe src="${file.dataUrl}" class="w-full h-[500px] rounded-xl border border-purple-500/30" allowfullscreen></iframe>
        </div>`;
      } else if (file.fileType === 'ios-app') {
        html = `<div class="text-center space-y-4">
          <p class="text-purple-200">Launch iOS App / Shortcut:</p>
          <a href="${file.dataUrl}" class="px-6 py-3 rounded-xl bg-purple-700 hover:bg-purple-600 text-white font-semibold inline-block shadow-lg">Open ${file.name}</a>
        </div>`;
      } else if (isImageFile(file)) {
        html = `<img src="${blobUrl}" class="max-w-full max-h-full object-contain rounded-lg">`;
      } else if (isVideoFile(file)) {
        html = `<video src="${blobUrl}" controls class="max-w-full max-h-full rounded-lg"></video>`;
      } else if (isAudioFile(file)) {
        html = `<audio src="${blobUrl}" controls class="w-96"></audio>`;
      } else if (file.textContent !== undefined) {
        html = `<pre class="w-full h-full text-xs text-purple-200 font-mono whitespace-pre-wrap p-4 bg-purple-950/40 rounded-xl border border-purple-900/50">${file.textContent}</pre>`;
      } else {
        html = `<div class="text-center space-y-4">
          <p class="text-purple-300">Preview not available for this file type.</p>
          <a href="${blobUrl}" download="${file.name}" class="px-6 py-3 rounded-xl bg-purple-700 text-white font-semibold inline-block">Download File</a>
        </div>`;
      }

      contentContainer.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function closeFileViewer() {
      document.getElementById('file-viewer-modal').classList.add('hidden');
      document.getElementById('viewer-content').innerHTML = '';
    }

    // Save & Load State File Export/Import
    function saveArchiveState() {
      const data = {
        folders: state.folders,
        files: state.files.map(f => ({ ...f, rawBlob: undefined })),
        textBubbles: state.textBubbles
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gothic-archive-backup.json';
      a.click();
      showToast('Archive backup saved');
    }

    function loadArchiveState() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.folders && data.files && data.textBubbles) {
            state.folders = data.folders;
            state.files = data.files;
            state.textBubbles = data.textBubbles;
            
            // Clear & repopulate DB
            if (!db) await initDB();
            const tx = db.transaction(['folders', 'files', 'textBubbles'], 'readwrite');
            tx.objectStore('folders').clear();
            tx.objectStore('files').clear();
            tx.objectStore('textBubbles').clear();

            for (let f of state.folders) await saveFolder(f);
            for (let fi of state.files) await saveFile(fi);
            for (let tb of state.textBubbles) await saveTextBubble(tb);

            state.currentFolderId = 'root';
            state.folderPath = [];
            document.getElementById('breadcrumb-display').textContent = 'Main Desktop';
            document.getElementById('back-btn').disabled = true;

            render();
            showToast('Archive loaded successfully');
          }
        } catch (err) {
          alert('Invalid backup file.');
        }
      };
      input.click();
    }

    // File Upload Handler
    async function handleFilesUpload(fileList) {
      if (!fileList || fileList.length === 0) return;
      let allExisting = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];

      for (let i = 0; i < fileList.length; i++) {
        const f = fileList[i];
        try {
          const base64 = await fileToBase64(f);
          let textContent = '';
          if (f.type.startsWith('text/') || f.name.match(/\.(txt|html|json|csv|md)$/i)) {
            try { textContent = await f.text(); } catch (err) {}
          }

          let posX = 20, posY = 20;
          if (allExisting.length > 0) {
            const last = allExisting[allExisting.length - 1];
            posX = (last.x !== undefined ? last.x : 20) + (last.width || 112) + 24;
            posY = last.y !== undefined ? last.y : 20;
            if (posX > 1000) { posX = 20; posY += 160; }
          }

          const newFile = {
            id: uid(),
            name: f.name,
            fileType: f.type || 'application/octet-stream',
            dataUrl: base64,
            rawBlob: f,
            textContent: textContent,
            parentId: state.currentFolderId,
            x: posX,
            y: posY,
            width: 112,
            height: 144
          };

          state.files.push(newFile);
          await saveFile(newFile);
          allExisting.push(newFile);
        } catch (err) {
          console.error('Upload error', err);
        }
      }
      render();
      showToast('Files uploaded');
    }

    document.getElementById('file-input').addEventListener('change', (e) => handleFilesUpload(e.target.files));

    // Drag, Resize & Snap-to-Grid implementation
    function attachDragAndResizeListeners() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      const itemsElems = container.querySelectorAll('[data-id]');
      itemsElems.forEach(elem => {
        const id = elem.getAttribute('data-id');
        let item = state.folders.find(f => f.id === id) || state.files.find(f => f.id === id) || state.textBubbles.find(b => b.id === id);
        if (!item) return;

        const resizeHandle = elem.querySelector('.resize-handle');

        let isDragging = false;
        let isResizing = false;
        let startX = 0, startY = 0;
        let initialX = item.x || 20;
        let initialY = item.y || 20;
        let initialW = item.width || (isFolder(item) ? 96 : isBubble(item) ? 140 : 112);
        let initialH = item.height || (isFolder(item) ? 96 : isBubble(item) ? 80 : 144);

        if (resizeHandle) {
          resizeHandle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (!state.editMode) return;
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            initialW = item.width || (isFolder(item) ? 96 : isBubble(item) ? 140 : 112);
            initialH = item.height || (isFolder(item) ? 96 : isBubble(item) ? 80 : 144);
            resizeHandle.setPointerCapture(e.pointerId);
          });

          resizeHandle.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            e.stopPropagation();
            const dx = (e.clientX - startX) / state.zoomLevel;
            const dy = (e.clientY - startY) / state.zoomLevel;
            const newW = Math.max(80, initialW + dx);
            const newH = Math.max(60, initialH + dy);
            item.width = newW;
            item.height = newH;
            elem.style.width = newW + 'px';
            elem.style.height = newH + 'px';
          });

          resizeHandle.addEventListener('pointerup', async (e) => {
            if (!isResizing) return;
            isResizing = false;
            resizeHandle.releasePointerCapture(e.pointerId);
            if (isFolder(item)) await saveFolder(item);
            else if (isBubble(item)) await saveTextBubble(item);
            else await saveFile(item);
          });
        }

        elem.addEventListener('pointerdown', (e) => {
          if (!state.editMode) return;
          if (e.target.closest('.resize-handle') || e.target.closest('button')) return;
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          initialX = item.x !== undefined ? item.x : 20;
          initialY = item.y !== undefined ? item.y : 20;
          elem.setPointerCapture(e.pointerId);
          elem.style.zIndex = 100;
        });

        elem.addEventListener('pointermove', (e) => {
          if (!isDragging || !state.editMode) return;
          e.stopPropagation();
          const dx = (e.clientX - startX) / state.zoomLevel;
          const dy = (e.clientY - startY) / state.zoomLevel;
          let nx = Math.max(0, initialX + dx);
          let ny = Math.max(0, initialY + dy);
          
          // Soft Snap-to-Grid Calculation
          nx = Math.round(nx / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
          ny = Math.round(ny / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;

          item.x = nx;
          item.y = ny;
          elem.style.left = nx + 'px';
          elem.style.top = ny + 'px';
        });

        elem.addEventListener('pointerup', async (e) => {
          if (!isDragging) return;
          isDragging = false;
          elem.style.zIndex = '';
          elem.releasePointerCapture(e.pointerId);
          if (isFolder(item)) await saveFolder(item);
          else if (isBubble(item)) await saveTextBubble(item);
          else await saveFile(item);
        });
      });
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
