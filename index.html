              <div class="h-5 w-px bg-zinc-800"></div>
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800 items-center">
                <span class="text-[10px] text-zinc-400 font-bold px-1">Text:</span>
                <label class="cursor-pointer relative" title="Text colour">
                  <input type="color" value="${ed.fontColor || '#ffffff'}" oninput="applyTextEditorFormat('fontColor', this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" />
                  <span class="p-1 rounded-md text-zinc-300 hover:bg-zinc-800 flex items-center"><i data-lucide="palette" class="w-4 h-4" style="color:${ed.fontColor || '#ffffff'}"></i></span>
                </label>
                ${colorSwatches.slice(0, 4).map(c => `
                  <button type="button" onclick="applyTextEditorFormat('fontColor', '${c}')" class="w-4 h-4 rounded-full border ${ed.fontColor === c ? 'ring-2 ring-amber-400 border-amber-400' : 'border-zinc-600'}" style="background:${c}" title="${c}"></button>
                `).join('')}
                <button type="button" onclick="applyTextEditorFormat('fontColor', null)" class="p-1 rounded-md text-zinc-400 hover:bg-zinc-800" title="Reset text colour"><i data-lucide="eraser" class="w-3.5 h-3.5"></i></button>
              </div>
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800 items-center">
                <span class="text-[10px] text-zinc-400 font-bold px-1">Bg:</span>
                <label class="cursor-pointer relative" title="Background colour">
                  <input type="color" value="${ed.bgColour || '#18181b'}" oninput="applyTextEditorFormat('bgColour', this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" />
                  <span class="p-1 rounded-md text-zinc-300 hover:bg-zinc-800 flex items-center"><i data-lucide="paint-bucket" class="w-4 h-4" style="color:${ed.bgColour || '#18181b'}"></i></span>
                </label>
                ${bgSwatches.slice(0, 4).map(c => `
                  <button type="button" onclick="applyTextEditorFormat('bgColour', '${c}')" class="w-4 h-4 rounded-full border ${ed.bgColour === c ? 'ring-2 ring-amber-400 border-amber-400' : 'border-zinc-600'}" style="background:${c}" title="${c}"></button>
                `).join('')}
                <button type="button" onclick="applyTextEditorFormat('bgColour', null)" class="p-1 rounded-md text-zinc-400 hover:bg-zinc-800" title="Reset background colour"><i data-lucide="eraser" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>

            <div class="relative w-full min-h-[140px] bg-zinc-950 border border-zinc-800 rounded-2xl p-3 flex flex-col justify-between" style="${ed.bgColour ? `background-color:${ed.bgColour};` : ''}">
              <div id="modal-text-input" contenteditable="true" oninput="handleTextEditorInput(this)" data-placeholder="Type your note or thoughts here..." class="w-full min-h-[100px] max-h-[300px] overflow-y-auto leading-relaxed select-text text-white" style="${editorPreviewStyle(ed)}"></div>
            </div>

            <div class="flex items-center gap-2 mt-1">
              <button type="button" onclick="closeTextEditorModal()" class="w-1/2 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button type="button" onclick="saveTextEditorModal()" class="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs shadow-lg shadow-amber-500/20">Save Text Bubble</button>
            </div>
          </div>
        </div>
      `;
    }

    function editorPreviewStyle(ed) {
      let style = '';
      if (ed.fontFamily) style += `font-family:${ed.fontFamily};`;
      if (ed.fontSize === 'lg') style += 'font-size:16px;';
      else if (ed.fontSize === 'sm') style += 'font-size:10px;';
      else style += 'font-size:12px;';
      if (ed.isBold) style += 'font-weight:bold;';
      if (ed.isItalic) style += 'font-style:italic;';
      if (ed.isUnderline) style += 'text-decoration:underline;';
      if (ed.fontColor) style += `color:${ed.fontColor};`;
      if (ed.align) style += `text-align:${ed.align};`;
      return style;
    }

    function openTextEditorModal(bubbleId = null, attachedFileId = null) {
      let ed = {
        bubbleId,
        attachedFileId,
        isNew: !bubbleId,
        text: '',
        fontFamily: 'system-ui, -apple-system, sans-serif',
        fontSize: 'md',
        isBold: false,
        isItalic: false,
        isUnderline: false,
        fontColor: null,
        bgColour: null,
        align: 'left',
        history: [],
        historyIndex: -1
      };

      if (bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === bubbleId);
        if (bubble) {
          ed.text = bubble.text || '';
          ed.fontFamily = bubble.fontFamily || ed.fontFamily;
          ed.fontSize = bubble.fontSize || ed.fontSize;
          ed.isBold = !!bubble.isBold;
          ed.isItalic = !!bubble.isItalic;
          ed.isUnderline = !!bubble.isUnderline;
          ed.fontColor = bubble.fontColor || null;
          ed.bgColour = bubble.bgColour || null;
          ed.align = bubble.align || 'left';
        }
      }

      ed.history.push(getTextEditorSnapshot(ed));
      ed.historyIndex = 0;

      state.textEditorModal = ed;
      render();

      setTimeout(() => {
        const inp = document.getElementById('modal-text-input');
        if (inp) {
          inp.innerText = ed.text;
          inp.focus();
        }
      }, 50);
    }

    function getTextEditorSnapshot(ed) {
      return {
        text: ed.text,
        fontSize: ed.fontSize,
        fontFamily: ed.fontFamily,
        isBold: ed.isBold,
        isItalic: ed.isItalic,
        isUnderline: ed.isUnderline,
        fontColor: ed.fontColor,
        bgColour: ed.bgColour,
        align: ed.align
      };
    }

    function pushTextEditorHistory() {
      const ed = state.textEditorModal;
      if (!ed) return;
      if (ed.historyIndex < ed.history.length - 1) {
        ed.history = ed.history.slice(0, ed.historyIndex + 1);
      }
      ed.history.push(getTextEditorSnapshot(ed));
      ed.historyIndex = ed.history.length - 1;
    }

    function handleTextEditorInput(elem) {
      if (!state.textEditorModal) return;
      state.textEditorModal.text = elem.innerText;
    }

    function applyTextEditorFormat(key, value = undefined) {
      const ed = state.textEditorModal;
      if (!ed) return;

      if (typeof ed[key] === 'boolean') {
        ed[key] = !ed[key];
      } else {
        ed[key] = value;
      }
      pushTextEditorHistory();
      render();

      setTimeout(() => {
        const inp = document.getElementById('modal-text-input');
        if (inp) {
          inp.innerText = ed.text;
        }
      }, 30);
    }

    function textEditorUndo() {
      const ed = state.textEditorModal;
      if (!ed || ed.historyIndex <= 0) return;
      ed.historyIndex--;
      const snap = ed.history[ed.historyIndex];
      Object.assign(ed, snap);
      render();

      setTimeout(() => {
        const inp = document.getElementById('modal-text-input');
        if (inp) inp.innerText = ed.text;
      }, 30);
    }

    function textEditorRedo() {
      const ed = state.textEditorModal;
      if (!ed || ed.historyIndex >= ed.history.length - 1) return;
      ed.historyIndex++;
      const snap = ed.history[ed.historyIndex];
      Object.assign(ed, snap);
      render();

      setTimeout(() => {
        const inp = document.getElementById('modal-text-input');
        if (inp) inp.innerText = ed.text;
      }, 30);
    }

    function closeTextEditorModal() {
      state.textEditorModal = null;
      render();
    }

    async function saveTextEditorModal() {
      const ed = state.textEditorModal;
      if (!ed) return;

      const inp = document.getElementById('modal-text-input');
      if (inp) ed.text = inp.innerText.trim();

      if (ed.bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === ed.bubbleId);
        if (bubble) {
          bubble.text = ed.text;
          bubble.fontFamily = ed.fontFamily;
          bubble.fontSize = ed.fontSize;
          bubble.isBold = ed.isBold;
          bubble.isItalic = ed.isItalic;
          bubble.isUnderline = ed.isUnderline;
          bubble.fontColor = ed.fontColor;
          bubble.bgColour = ed.bgColour;
          bubble.align = ed.align;
          await saveTextBubble(bubble);
        }
      } else {
        const newBubble = {
          id: uid(),
          parentId: state.currentFolderId,
          attachedFileId: ed.attachedFileId || null,
          isBubble: true,
          text: ed.text,
          fontFamily: ed.fontFamily,
          fontSize: ed.fontSize,
          isBold: ed.isBold,
          isItalic: ed.isItalic,
          isUnderline: ed.isUnderline,
          fontColor: ed.fontColor,
          bgColour: ed.bgColour,
          align: ed.align,
          width: 140,
          height: 80,
          x: 20,
          y: 20
        };
        state.textBubbles.push(newBubble);
        await saveTextBubble(newBubble);
      }

      closeTextEditorModal();
    }

    function renderQuickViewModal() {
      const file = state.files.find(f => f.id === state.quickViewFileId);
      if (!file) return '';

      const type = file.fileType || '';
      const isImg = type.startsWith('image/');
      const isVid = isVideoFile(file);
      const isAud = isAudioFile(file);
      const isWebVideo = type === 'web-video';

      let contentHtml = '';
      if (isImg) {
        contentHtml = `<img src="${file.dataUrl}" class="max-w-full max-h-[70vh] object-contain rounded-2xl shadow-2xl cursor-pointer" onclick="openBrowserImageView('${file.dataUrl}')" />`;
      } else if (isVid && !isWebVideo) {
        const src = file.blobUrl || file.dataUrl;
        contentHtml = `<video src="${src}" controls autoplay playsinline webkit-playsinline class="max-w-full max-h-[70vh] rounded-2xl shadow-2xl bg-black"></video>`;
      } else if (isWebVideo) {
        contentHtml = `
          <div class="flex flex-col items-center gap-4 text-center">
            <button onclick="playPopupVideo('${file.videoUrl}')" class="px-6 py-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-2xl flex items-center gap-2 shadow-xl shadow-amber-500/20 text-sm">
              <i data-lucide="play" class="w-5 h-5 fill-black"></i> Launch Video Player / Embed
            </button>
            <span class="text-xs text-zinc-400 break-all">${file.videoUrl}</span>
          </div>
        `;
      } else if (isAud) {
        const src = file.blobUrl || file.dataUrl;
        contentHtml = `
          <div class="p-6 bg-zinc-950 border border-zinc-800 rounded-2xl flex flex-col items-center gap-4 w-full max-w-sm">
            <i data-lucide="music" class="w-16 h-16 text-amber-400 animate-pulse"></i>
            <span class="text-sm font-bold text-white text-center">${file.name}</span>
            <audio src="${src}" controls autoplay class="w-full"></audio>
          </div>
        `;
      } else {
        contentHtml = `
          <div class="p-6 bg-zinc-950 border border-zinc-800 rounded-2xl flex flex-col items-center gap-3 text-center max-w-xs">
            <i data-lucide="file-text" class="w-12 h-12 text-amber-400"></i>
            <span class="text-xs font-bold text-white">${file.name}</span>
            <span class="text-[10px] text-zinc-500">Preview not directly streamable. You can open or share it below.</span>
          </div>
        `;
      }

      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4" onclick="closeQuickView()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 max-w-2xl w-full flex flex-col items-center gap-4 relative shadow-2xl" onclick="event.stopPropagation()">
            <div class="w-full flex items-center justify-between border-b border-zinc-800 pb-3">
              <span class="text-xs font-bold text-zinc-300 truncate max-w-[80%]">${file.name}</span>
              <button onclick="closeQuickView()" class="p-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-full text-zinc-300"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="w-full flex items-center justify-center min-h-[200px] py-2">
              ${contentHtml}
            </div>
            <div class="w-full flex items-center justify-end gap-2 border-t border-zinc-800 pt-3">
              <button onclick="shareFile('${file.id}')" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-xs font-bold text-zinc-200 flex items-center gap-2"><i data-lucide="share" class="w-4 h-4"></i> Share</button>
              <button onclick="closeQuickView()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs">Done</button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleEditMode() {
      state.editMode = !state.editMode;
      render();
    }

    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selectedIds = [];
      render();
    }

    function toggleSelectAll() {
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];

      const allSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));
      if (allSelected) {
        state.selectedIds = [];
      } else {
        state.selectedIds = items.map(item => item.id);
      }
      render();
    }

    function navigateTo(folderId) {
      state.currentFolderId = folderId;
      state.selectedIds = [];
      state.activeMenuId = null;
      render();
    }

    function navigateBack() {
      if (state.currentFolderId === null) return;
      const cur = state.folders.find(f => f.id === state.currentFolderId);
      if (cur) {
        navigateTo(cur.parentId);
      } else {
        navigateTo(null);
      }
    }

    function toggleMenu(e, id) {
      e.stopPropagation();
      state.activeMenuId = state.activeMenuId === id ? null : id;
      render();
    }

    function closeMenu() {
      if (state.activeMenuId !== null) {
        state.activeMenuId = null;
        render();
      }
    }

    async function handleItemClick(e, id, isFolderItem, isBubbleItem = false) {
      if (e.target.closest('button')) return;

      if (state.selectMode) {
        if (state.selectedIds.includes(id)) {
          state.selectedIds = state.selectedIds.filter(i => i !== id);
        } else {
          state.selectedIds.push(id);
        }
        render();
        return;
      }

      if (isFolderItem) {
        navigateTo(id);
      } else if (isBubbleItem) {
        const bubble = state.textBubbles.find(b => b.id === id);
        if (bubble && !bubble.isChecklist) {
          openTextEditorModal(id);
        }
      } else {
        const file = state.files.find(f => f.id === id);
        if (!file) return;

        const type = file.fileType || '';
        if (type.startsWith('image/')) {
          openBrowserImageView(file.dataUrl);
        } else if (file.fileType === 'link' && file.url) {
          window.open(file.url, '_blank');
        } else if (file.fileType === 'web-video' && file.videoUrl) {
          playPopupVideo(file.videoUrl);
        } else if (isVideoFile(file)) {
          const videoSrc = await getOrCreateBlobUrl(file);
          playPopupVideo(videoSrc);
        } else {
          playPopupVideo(file.videoUrl || file.url || file.dataUrl);
        }
      }
    }

    function playPopupVideo(url) {
      state.popupVideoUrl = url;
      render();
    }
    function closePopupVideo() {
      state.popupVideoUrl = null;
      render();
    }

    function openQuickView(id) {
      state.quickViewFileId = id;
      state.activeMenuId = null;
      render();
    }
    function closeQuickView() {
      state.quickViewFileId = null;
      render();
    }

    function openUploadModal() { state.showUploadModal = true; render(); }
    function closeUploadModal() { state.showUploadModal = false; render(); }

    function openLinkModal() { state.linkModal = true; state.linkModalThumbData = null; render(); }
    function closeLinkModal() { state.linkModal = false; state.linkModalThumbData = null; render(); }

    function openWebVideoModal() { state.webVideoModal = true; state.webVideoModalThumbData = null; render(); }
    function closeWebVideoModal() { state.webVideoModal = false; state.webVideoModalThumbData = null; render(); }

    function openNewFolderModal() {
      const name = prompt('Enter new folder name:');
      if (name && name.trim()) {
        const newFolder = {
          id: uid(),
          name: name.trim(),
          parentId: state.currentFolderId,
          width: 96,
          height: 96,
          x: 20,
          y: 20
        };
        state.folders.push(newFolder);
        saveFolder(newFolder);
        render();
      }
    }

    function renameItem(id, isFolderItem, isBubbleItem = false) {
      state.activeMenuId = null;
      if (isBubbleItem) {
        const bubble = state.textBubbles.find(b => b.id === id);
        if (!bubble) return;
        const newName = prompt('Rename Text Bubble:', bubble.text ? bubble.text.substring(0, 20) : 'Text Bubble');
        if (newName !== null && newName.trim()) {
          bubble.text = newName.trim();
          saveTextBubble(bubble);
          render();
        }
      } else if (isFolderItem) {
        const folder = state.folders.find(f => f.id === id);
        if (!folder) return;
        const newName = prompt('Rename folder:', folder.name);
        if (newName !== null && newName.trim()) {
          folder.name = newName.trim();
          saveFolder(folder);
          render();
        }
      } else {
        const file = state.files.find(f => f.id === id);
        if (!file) return;
        const newName = prompt('Rename file:', file.name);
        if (newName !== null && newName.trim()) {
          file.name = newName.trim();
          saveFile(file);
          render();
        }
      }
    }

    async function deleteItemConfirm(id, isFolderItem, isBubbleItem = false) {
      state.activeMenuId = null;
      if (!confirm('Are you sure you want to delete this item?')) return;

      if (isBubbleItem) {
        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('textBubbles', id);
      } else if (isFolderItem) {
        state.folders = state.folders.filter(f => f.id !== id);
        await deleteFromDB('folders', id);
      } else {
        state.files = state.files.filter(f => f.id !== id);
        await deleteFromDB('files', id);
      }
      render();
    }

    function triggerFolderCover(folderId) {
      state.targetFolderCoverId = folderId;
      state.activeMenuId = null;
      document.getElementById('folder-cover-input').click();
    }

    function triggerChangeImage(fileId) {
      state.targetChangeImageId = fileId;
      state.activeMenuId = null;
      document.getElementById('change-image-input').click();
    }

    function snapToOriginalShape(id) {
      state.activeMenuId = null;
      const folder = state.folders.find(f => f.id === id);
      if (folder) {
        folder.width = 96;
        folder.height = 96;
        saveFolder(folder);
        render();
        return;
      }
      const bubble = state.textBubbles.find(b => b.id === id);
      if (bubble) {
        bubble.width = 140;
        bubble.height = 80;
        saveTextBubble(bubble);
        render();
        return;
      }
      const file = state.files.find(f => f.id === id);
      if (file) {
        file.width = 112;
        file.height = 144;
        saveFile(file);
        render();
      }
    }

    function resizeByFinger(id, isFolderItem) {
      state.activeMenuId = null;
      alert('Edit Mode activated. Drag the yellow handle on the bottom right corner of the item to resize.');
      state.editMode = true;
      render();
    }

    function moveToFolder(id, isFolderItem, isBubbleItem = false) {
      state.activeMenuId = null;
      const availableFolders = state.folders.filter(f => f.id !== id);
      let promptText = 'Enter target folder name (or leave empty for Home):\nAvailable: ' + availableFolders.map(f => f.name).join(', ');
      const targetName = prompt(promptText);

      if (targetName === null) return;

      let targetFolderId = null;
      if (targetName.trim() !== '') {
        const found = availableFolders.find(f => f.name.toLowerCase() === targetName.trim().toLowerCase());
        if (!found) {
          alert('Folder not found.');
          return;
        }
        targetFolderId = found.id;
      }

      if (isBubbleItem) {
        const bubble = state.textBubbles.find(b => b.id === id);
        if (bubble) {
          bubble.parentId = targetFolderId;
          saveTextBubble(bubble);
        }
      } else if (isFolderItem) {
        const folder = state.folders.find(f => f.id === id);
        if (folder) {
          folder.parentId = targetFolderId;
          saveFolder(folder);
        }
      } else {
        const file = state.files.find(f => f.id === id);
        if (file) {
          file.parentId = targetFolderId;
          saveFile(file);
        }
      }
      render();
    }

    async function copySingleFileClipboard(id) {
      state.activeMenuId = null;
      const file = state.files.find(f => f.id === id);
      if (!file) return;

      try {
        if (navigator.clipboard && window.ClipboardItem && file.dataUrl && file.fileType.startsWith('image/')) {
          const res = await fetch(file.dataUrl);
          const blob = await res.blob();
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          alert('Image copied to clipboard!');
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(file.url || file.videoUrl || file.name);
          alert('Copied to clipboard!');
        } else {
          alert('Clipboard not available.');
        }
      } catch (err) {
        alert('Could not copy to clipboard: ' + err.message);
      }
    }

    async function shareFile(id) {
      state.activeMenuId = null;
      const file = state.files.find(f => f.id === id);
      if (!file) return;

      try {
        if (navigator.share) {
          if (file.rawBlob) {
            const f = new File([file.rawBlob], file.name, { type: file.fileType });
            await navigator.share({ files: [f], title: file.name });
          } else {
            await navigator.share({ title: file.name, url: file.url || file.videoUrl || window.location.href });
          }
        } else {
          alert('Sharing is not supported on this device/browser.');
        }
      } catch (e) {
        if (e.name !== 'AbortError') alert('Share error: ' + e.message);
      }
    }

    function bulkCopy() {
      alert(`${state.selectedIds.length} items ready to copy.`);
    }

    function bulkMove() {
      const availableFolders = state.folders.filter(f => !state.selectedIds.includes(f.id));
      let promptText = 'Enter target folder name (or leave empty for Home):\nAvailable: ' + availableFolders.map(f => f.name).join(', ');
      const targetName = prompt(promptText);

      if (targetName === null) return;

      let targetFolderId = null;
      if (targetName.trim() !== '') {
        const found = availableFolders.find(f => f.name.toLowerCase() === targetName.trim().toLowerCase());
        if (!found) {
          alert('Folder not found.');
          return;
        }
        targetFolderId = found.id;
      }

      state.selectedIds.forEach(id => {
        const folder = state.folders.find(f => f.id === id);
        if (folder) {
          folder.parentId = targetFolderId;
          saveFolder(folder);
        }
        const file = state.files.find(f => f.id === id);
        if (file) {
          file.parentId = targetFolderId;
          saveFile(file);
        }
        const bubble = state.textBubbles.find(b => b.id === id);
        if (bubble) {
          bubble.parentId = targetFolderId;
          saveTextBubble(bubble);
        }
      });

      state.selectedIds = [];
      state.selectMode = false;
      render();
    }

    function bulkShare() {
      alert(`Sharing ${state.selectedIds.length} items.`);
    }

    async function bulkDelete() {
      if (!confirm(`Are you sure you want to delete ${state.selectedIds.length} items?`)) return;

      for (let id of state.selectedIds) {
        state.folders = state.folders.filter(f => f.id !== id);
        await deleteFromDB('folders', id);

        state.files = state.files.filter(f => f.id !== id);
        await deleteFromDB('files', id);

        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('textBubbles', id);
      }

      state.selectedIds = [];
      state.selectMode = false;
      render();
    }

    function forcePullCloudData() {
      if (confirm('Are you sure you want to pull data from GitHub Cloud? This will refresh your current view.')) {
        syncWithGitHub(true);
      }
    }

    function attachDragAndResizeListeners() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      let isDragging = false;
      let isResizing = false;
      let currentElem = null;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      let initialWidth = 0, initialHeight = 0;
      let draggedItemsData = [];

      container.onmousedown = onPointerDown;
      container.ontouchstart = onPointerDown;

      function onPointerDown(e) {
        if (!state.editMode) return;

        const target = e.target;
        const resizeHandle = target.closest('.resize-handle');
        const itemElem = target.closest('[id^="item-"]');

        if (!itemElem) return;

        const pointer = e.touches ? e.touches[0] : e;
        startX = pointer.clientX;
        startY = pointer.clientY;
        currentElem = itemElem;

        const rect = itemElem.getBoundingClientRect();
        const clickedId = itemElem.getAttribute('data-id');

        if (resizeHandle) {
          isResizing = true;
          initialWidth = rect.width;
          initialHeight = rect.height;
          e.preventDefault();
        } else if (!target.closest('button')) {
          isDragging = true;
          initialLeft = itemElem.offsetLeft;
          initialTop = itemElem.offsetTop;

          draggedItemsData = [];
          const itemsToMove = (state.selectedIds.length > 0 && state.selectedIds.includes(clickedId)) 
            ? state.selectedIds 
            : [clickedId];

          itemsToMove.forEach(id => {
            const el = document.getElementById(`item-${id}`);
            if (el) {
              draggedItemsData.push({
                id: id,
                elem: el,
                left: el.offsetLeft,
                top: el.offsetTop
              });
            }
          });

          e.preventDefault();
        }

        document.onmousemove = onPointerMove;
        document.ontouchmove = onPointerMove;
        document.onmouseup = onPointerUp;
        document.ontouchend = onPointerUp;
      }

      function onPointerMove(e) {
        if (!isDragging && !isResizing) return;
        const pointer = e.touches ? e.touches[0] : e;
        const dx = pointer.clientX - startX;
        const dy = pointer.clientY - startY;

        if (isDragging) {
          draggedItemsData.forEach(item => {
            let newX = Math.max(0, item.left + dx);
            let newY = Math.max(0, item.top + dy);

            newX = Math.round(newX / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
            newY = Math.round(newY / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;

            item.elem.style.left = `${newX}px`;
            item.elem.style.top = `${newY}px`;
          });
        } else if (isResizing) {
          let newW = Math.max(64, initialWidth + dx);
          let newH = Math.max(64, initialHeight + dy);

          currentElem.style.width = `${newW}px`;
          currentElem.style.height = `${newH}px`;
        }
      }

      async function onPointerUp() {
        if (isDragging) {
          for (let item of draggedItemsData) {
            const finalX = parseInt(item.elem.style.left, 10);
            const finalY = parseInt(item.elem.style.top, 10);

            const folder = state.folders.find(f => f.id === item.id);
            if (folder) {
              folder.x = finalX; folder.y = finalY;
              await saveFolder(folder);
            }

            const file = state.files.find(f => f.id === item.id);
            if (file) {
              file.x = finalX; file.y = finalY;
              await saveFile(file);
            }

            const bubble = state.textBubbles.find(b => b.id === item.id);
            if (bubble) {
              bubble.x = finalX; bubble.y = finalY;
              await saveTextBubble(bubble);
            }
          }
        } else if (isResizing && currentElem) {
          const id = currentElem.getAttribute('data-id');
          const finalW = parseInt(currentElem.style.width, 10);
          const finalH = parseInt(currentElem.style.height, 10);

          const folder = state.folders.find(f => f.id === id);
          if (folder) {
            folder.width = finalW; folder.height = finalH;
            await saveFolder(folder);
          }

          const file = state.files.find(f => f.id === id);
          if (file) {
            file.width = finalW; file.height = finalH;
            await saveFile(file);
          }

          const bubble = state.textBubbles.find(b => b.id === id);
          if (bubble) {
            bubble.width = finalW; bubble.height = finalH;
            await saveTextBubble(bubble);
          }
        }

        isDragging = false;
        isResizing = false;
        currentElem = null;
        draggedItemsData = [];
        document.onmousemove = null;
        document.ontouchmove = null;
        document.onmouseup = null;
        document.ontouchend = null;
      }
    }

    document.getElementById('file-input').addEventListener('change', handleFileUpload);
    document.getElementById('photo-input').addEventListener('change', handleFileUpload);

    async function handleFileUpload(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (let f of files) {
        const uploadObj = { id: uid(), name: f.name, progress: 0 };
        state.activeUploads.push(uploadObj);
        render();

        try {
          const reader = new FileReader();
          reader.onprogress = (evt) => {
            if (evt.lengthComputable) {
              uploadObj.progress = Math.round((evt.loaded / evt.total) * 100);
              render();
            }
          };

          const dataUrl = await new Promise((res, rej) => {
            reader.onload = () => res(reader.result);
            reader.onerror = rej;
            reader.readAsDataURL(f);
          });

          const newFile = {
            id: uploadObj.id,
            parentId: state.currentFolderId,
            name: f.name,
            fileType: f.type || 'application/octet-stream',
            dataUrl: dataUrl,
            rawBlob: f,
            width: 112,
            height: 144,
            x: 20,
            y: 20
          };

          if (isVideoFile(newFile) || isAudioFile(newFile)) {
            await getOrCreateBlobUrl(newFile);
          }

          state.files.push(newFile);
          await saveFile(newFile);
        } catch (err) {
          alert('Upload failed for file ' + f.name);
        } finally {
          state.activeUploads = state.activeUploads.filter(u => u.id !== uploadObj.id);
          render();
        }
      }
      e.target.value = '';
    }

    document.getElementById('change-image-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !state.targetChangeImageId) return;

      const reader = new FileReader();
      reader.onload = async () => {
        const targetFile = state.files.find(f => f.id === state.targetChangeImageId);
        if (targetFile) {
          targetFile.thumbnailData = reader.result;
          await saveFile(targetFile);
          render();
        }
        state.targetChangeImageId = null;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('folder-cover-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !state.targetFolderCoverId) return;

      const reader = new FileReader();
      reader.onload = async () => {
        const folder = state.folders.find(f => f.id === state.targetFolderCoverId);
        if (folder) {
          folder.coverUrl = reader.result;
          await saveFolder(folder);
          render();
        }
        state.targetFolderCoverId = null;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('link-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.linkModalThumbData = reader.result;
        render();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('web-video-thumbnail-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.webVideoModalThumbData = reader.result;
        render();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    loadData();
  </script>
