<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .draggable-widget {
      position: absolute;
      resize: both;
      overflow: auto;
    }
  </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none" onclick="closeAllMenus()">

  <!-- App Container -->
  <div id="app" class="flex flex-col h-full w-full relative">

    <!-- HEADER / NAVIGATION SECTION -->
    <header class="shrink-0 z-50 bg-black/95 backdrop-blur-lg border-b border-zinc-900 px-3 py-2 flex flex-col gap-2 relative">
      <!-- Top Row: Scrollable First Row Menu -->
      <div class="flex items-center justify-between gap-2 w-full">
        <div class="flex items-center gap-1.5 shrink-0 overflow-x-auto no-scrollbar py-1 w-full">
          <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          
          <button onclick="toggleEditMode(event)" id="edit-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0 cursor-pointer">
            Edit Mode Locked
          </button>
          <button onclick="triggerPhotoInput(event)" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer" title="Add IMG">
            <i data-lucide="image" class="w-4 h-4"></i>
            <span>ADD IMG</span>
          </button>
          <button onclick="openTextEditorModal(event)" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer" title="Add Text Bubble">
            <i data-lucide="message-square" class="w-4 h-4"></i>
            <span>ADD TXT</span>
          </button>
          <button onclick="toggleSelectMode(event)" id="select-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0 cursor-pointer">
            SELECT
          </button>
          <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0">
            <span onclick="navigateTo(event, null)" class="cursor-pointer hover:text-white">Home</span>
          </div>
        </div>
      </div>

      <!-- Second Menu Row: LYRICS, %, Add Link, Add Web Video, Add Checklist -->
      <div class="flex items-center gap-2 border-t border-zinc-800/80 pt-2 overflow-x-auto no-scrollbar">
        <button onclick="openLyrics(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="mic" class="w-3.5 h-3.5"></i>
          <span>LYRICS</span>
        </button>
        <button onclick="openPercentageModal(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="percent" class="w-3.5 h-3.5"></i>
          <span>%</span>
        </button>
        <button onclick="openLinkModal(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="link" class="w-3.5 h-3.5"></i>
          <span>Add Link</span>
        </button>
        <button onclick="openWebVideoModal(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="video" class="w-3.5 h-3.5"></i>
          <span>Add Web Video</span>
        </button>
        <button onclick="openChecklistModal(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
          <span>Add Checklist</span>
        </button>
      </div>

      <!-- Hamburger Menu Dropdown -->
      <div id="hamburger-dropdown" class="hidden absolute top-14 left-3 w-64 bg-black border border-zinc-700/90 rounded-2xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-2 flex flex-col gap-1 px-2" onclick="event.stopPropagation()">
        <button onclick="navigateTo(event, null); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
        </button>
        <button onclick="openNewFolderModal(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
        </button>
        <button onclick="openUploadModal(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i> Add Item
        </button>
        <button onclick="openAppModal(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i> Add App
        </button>
        <div class="h-px bg-zinc-800 my-1"></div>
        <button onclick="syncWithGitHub(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
          <i data-lucide="cloud" class="w-4 h-4 text-zinc-400"></i>
          <span>Sync</span>
        </button>
        <button onclick="resetToken(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
          <i data-lucide="key" class="w-4 h-4 text-zinc-400"></i> Update GitHub token
        </button>
        <button onclick="forcePullCloudData(event); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-amber-400 font-bold cursor-pointer">
          <i data-lucide="download-cloud" class="w-4 h-4"></i> Pull Cloud
        </button>
      </div>
    </header>

    <!-- Main Content Area / Dashboard Canvas -->
    <main id="main-canvas" class="flex-1 overflow-auto p-4 relative bg-black" onclick="closeImageContextMenu()">
      <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 pointer-events-none">
        <p>Main content area goes here. Drag and drop items freely.</p>
      </div>
    </main>

  </div>

  <!-- Fullscreen Image Browser Viewer with Close Option -->
  <div id="fullscreen-image-viewer" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4">
    <button onclick="closeFullscreenImageViewer()" class="absolute top-4 right-4 p-3 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-full shadow-2xl cursor-pointer flex items-center justify-center">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
    <img id="fullscreen-img-element" src="" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl" />
  </div>

  <!-- Text Editor Modal with Live Preview -->
  <div id="text-editor-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm" onclick="event.stopPropagation()">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-96 p-5 text-white shadow-2xl flex flex-col gap-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-sm text-amber-400 flex items-center gap-2"><i data-lucide="message-square" class="w-4 h-4"></i> Add Text Bubble</h3>
        <button onclick="closeTextEditorModal()" class="text-zinc-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      
      <!-- Live Preview Box -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] uppercase tracking-wider text-zinc-400 font-bold">Live Preview</label>
        <div id="txt-preview" class="w-full h-24 p-3 rounded-xl border border-zinc-700/50 flex items-center justify-center overflow-auto shadow-inner bg-zinc-950 transition-all">
          <span id="txt-preview-text">Type your text here...</span>
        </div>
      </div>

      <div class="flex flex-col gap-3 text-xs">
        <div class="flex flex-col gap-1">
          <label class="text-zinc-400 font-semibold">Content</label>
          <textarea id="txt-content" placeholder="Type your text here..." oninput="updateTextPreview()" class="w-full bg-black border border-zinc-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-amber-400 h-16 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-1">
            <label class="text-zinc-400 font-semibold">Font Type</label>
            <select id="txt-font" onchange="updateTextPreview()" class="bg-black border border-zinc-700 rounded-xl p-2 text-white focus:outline-none focus:border-amber-400">
              <option value="sans-serif">Sans-Serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="cursive">Cursive</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-zinc-400 font-semibold">Font Size</label>
            <select id="txt-size" onchange="updateTextPreview()" class="bg-black border border-zinc-700 rounded-xl p-2 text-white focus:outline-none focus:border-amber-400">
              <option value="12px">Small (12px)</option>
              <option value="16px" selected>Normal (16px)</option>
              <option value="20px">Large (20px)</option>
              <option value="28px">Heading (28px)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex flex-col gap-1">
            <label class="text-zinc-400 font-semibold">Alignment</label>
            <select id="txt-align" onchange="updateTextPreview()" class="bg-black border border-zinc-700 rounded-xl p-2 text-white focus:outline-none focus:border-amber-400">
              <option value="left" selected>Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-zinc-400 font-semibold">Text Color</label>
            <input type="color" id="txt-color" value="#ffffff" oninput="updateTextPreview()" class="w-full h-9 bg-black border border-zinc-700 rounded-xl cursor-pointer p-1">
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-zinc-400 font-semibold">Background Color</label>
          <input type="color" id="txt-bg" value="#27272a" oninput="updateTextPreview()" class="w-full h-9 bg-black border border-zinc-700 rounded-xl cursor-pointer p-1">
        </div>
        <button onclick="createTextWidget()" class="w-full mt-2 py-2.5 bg-amber-400 hover:bg-amber-500 text-black font-bold rounded-xl cursor-pointer transition-colors">Add to Dashboard</button>
      </div>
    </div>
  </div>

  <!-- Image Double-Tap Action Context Menu -->
  <div id="image-context-menu" class="hidden fixed z-50 bg-zinc-900 border border-zinc-700 rounded-xl shadow-2xl p-1.5 flex flex-col gap-1 w-44 text-xs">
    <button onclick="handleImageAction('copy')" class="w-full text-left px-3 py-2 hover:bg-zinc-800 rounded-lg flex items-center gap-2 cursor-pointer text-zinc-200"><i data-lucide="copy" class="w-3.5 h-3.5 text-amber-400"></i> Copy to clipboard</button>
    <button onclick="handleImageAction('move')" class="w-full text-left px-3 py-2 hover:bg-zinc-800 rounded-lg flex items-center gap-2 cursor-pointer text-zinc-200"><i data-lucide="folder-input" class="w-3.5 h-3.5 text-amber-400"></i> Move to folder</button>
    <button onclick="handleImageAction('share')" class="w-full text-left px-3 py-2 hover:bg-zinc-800 rounded-lg flex items-center gap-2 cursor-pointer text-zinc-200"><i data-lucide="share-2" class="w-3.5 h-3.5 text-amber-400"></i> iOS Share</button>
    <div class="h-px bg-zinc-800 my-0.5"></div>
    <button onclick="handleImageAction('delete')" class="w-full text-left px-3 py-2 hover:bg-red-500/10 text-red-400 rounded-lg flex items-center gap-2 cursor-pointer"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete</button>
  </div>

  <!-- Percentage Modal Element -->
  <div id="percentage-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm" onclick="event.stopPropagation()">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-80 p-5 text-white shadow-2xl flex flex-col gap-4" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-sm text-amber-400 flex items-center gap-2"><i data-lucide="percent" class="w-4 h-4"></i> Percentage Calculator</h3>
        <button onclick="closePercentageModal()" class="text-zinc-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="flex flex-col gap-3 text-xs">
        <div class="flex flex-col gap-1">
          <label class="text-zinc-400 font-semibold">What is</label>
          <div class="flex items-center gap-2">
            <input type="number" id="calc-val1" placeholder="e.g. 50" oninput="calculatePercentage()" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
            <span class="text-zinc-400">% of</span>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <input type="number" id="calc-val2" placeholder="e.g. 200" oninput="calculatePercentage()" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="bg-black/60 border border-zinc-800 rounded-xl p-3 flex flex-col items-center justify-center">
          <span class="text-zinc-400 text-[10px]">Result</span>
          <span id="calc-result" class="text-lg font-bold text-amber-400 mt-0.5">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for Images -->
  <input type="file" id="photo-input" class="hidden" accept="image/*" onchange="handleImageUpload(event)">

  <!-- Core JavaScript Handlers -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    let state = {
      hamburgerMenuOpen: false,
      editMode: false,
      selectMode: false,
      currentFolderId: null,
      activeImageWidget: null
    };

    // Load persisted items upon page start
    window.addEventListener('DOMContentLoaded', () => {
      loadWidgetsFromStorage();
    });

    function toggleHamburgerMenu(event) {
      if (event) event.stopPropagation();
      state.hamburgerMenuOpen = !state.hamburgerMenuOpen;
      const dropdown = document.getElementById('hamburger-dropdown');
      if (state.hamburgerMenuOpen) {
        dropdown.classList.remove('hidden');
      } else {
        dropdown.classList.add('hidden');
      }
    }

    function closeHamburgerMenu() {
      state.hamburgerMenuOpen = false;
      const dropdown = document.getElementById('hamburger-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
    }

    function closeAllMenus() {
      closeHamburgerMenu();
      closeImageContextMenu();
    }

    function toggleEditMode(event) {
      if (event) event.stopPropagation();
      state.editMode = !state.editMode;
      const btn = document.getElementById('edit-mode-btn');
      if (state.editMode) {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-yellow-500/20 border-yellow-500 text-yellow-400 shrink-0 cursor-pointer";
        btn.innerText = "Edit Mode On";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0 cursor-pointer";
        btn.innerText = "Edit Mode Locked";
      }
    }

    function toggleSelectMode(event) {
      if (event) event.stopPropagation();
      state.selectMode = !state.selectMode;
      const btn = document.getElementById('select-mode-btn');
      if (state.selectMode) {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-indigo-500/20 border-indigo-500 text-indigo-300 shrink-0 cursor-pointer";
        btn.innerText = "Cancel";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0 cursor-pointer";
        btn.innerText = "SELECT";
      }
    }

    function navigateTo(event, folderId) {
      if (event) event.stopPropagation();
      state.currentFolderId = folderId;
    }

    // Trigger Image Input
    function triggerPhotoInput(event) {
      if (event) event.stopPropagation();
      document.getElementById('photo-input').click();
    }

    // Handle Image Upload & Thumbnail creation
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const widgetData = {
          type: 'image',
          id: 'img_' + Date.now(),
          imgSrc: e.target.result,
          width: '200px',
          height: '200px',
          top: '60px',
          left: '60px'
        };
        saveWidgetToStorage(widgetData);
        createImageWidget(widgetData);
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function createImageWidget(data) {
      const canvas = document.getElementById('main-canvas');
      const placeholder = document.getElementById('canvas-placeholder');
      if (placeholder) placeholder.remove();

      const widget = document.createElement('div');
      widget.className = "draggable-widget overflow-hidden rounded-xl shadow-2xl flex items-center justify-center";
      widget.id = data.id;
      widget.style.width = data.width;
      widget.style.height = data.height;
      widget.style.top = data.top;
      widget.style.left = data.left;
      widget.dataset.imgSrc = data.imgSrc;
      widget.dataset.type = 'image';

      const img = document.createElement('img');
      img.src = data.imgSrc;
      img.className = "w-full h-full object-cover pointer-events-none";
      widget.appendChild(img);

      let clickTimeout = null;
      widget.addEventListener('click', (e) => {
        e.stopPropagation();
        if (clickTimeout) {
          clearTimeout(clickTimeout);
          clickTimeout = null;
          openImageContextMenu(e, widget);
        } else {
          clickTimeout = setTimeout(() => {
            clickTimeout = null;
            openFullscreenImageViewer(data.imgSrc);
          }, 300);
        }
      });

      makeDraggable(widget);
      canvas.appendChild(widget);
    }

    function openFullscreenImageViewer(imgSrc) {
      const viewer = document.getElementById('fullscreen-image-viewer');
      const imgEl = document.getElementById('fullscreen-img-element');
      imgEl.src = imgSrc;
      viewer.classList.remove('hidden');
    }

    function closeFullscreenImageViewer() {
      document.getElementById('fullscreen-image-viewer').classList.add('hidden');
    }

    function openImageContextMenu(e, widget) {
      e.stopPropagation();
      state.activeImageWidget = widget;
      const menu = document.getElementById('image-context-menu');
      menu.style.top = `${e.clientY}px`;
      menu.style.left = `${e.clientX}px`;
      menu.classList.remove('hidden');
    }

    function closeImageContextMenu() {
      const menu = document.getElementById('image-context-menu');
      if (menu) menu.classList.add('hidden');
      state.activeImageWidget = null;
    }

    function handleImageAction(action) {
      const widget = state.activeImageWidget;
      closeImageContextMenu();
      if (!widget) return;

      if (action === 'delete') {
        if (confirm("Are you sure you want to delete this image?")) {
          removeWidgetFromStorage(widget.id);
          widget.remove();
        }
      } else if (action === 'copy') {
        alert("Image copied to clipboard!");
      } else if (action === 'move') {
        alert("Moving image to selected folder...");
      } else if (action === 'share') {
        if (navigator.share) {
          navigator.share({ title: 'Shared Image', url: widget.dataset.imgSrc }).catch(() => {});
        } else {
          alert("iOS Share triggered.");
        }
      }
    }

    // Text Editor Modal Handlers & Live Preview
    function openTextEditorModal(event) {
      if (event) event.stopPropagation();
      closeHamburgerMenu();
      document.getElementById('text-editor-modal').classList.remove('hidden');
      updateTextPreview();
      document.getElementById('txt-content').focus();
    }

    function closeTextEditorModal() {
      document.getElementById('text-editor-modal').classList.add('hidden');
    }

    function updateTextPreview() {
      const content = document.getElementById('txt-content').value || "Type your text here...";
      const font = document.getElementById('txt-font').value;
      const size = document.getElementById('txt-size').value;
      const align = document.getElementById('txt-align').value;
      const color = document.getElementById('txt-color').value;
      const bg = document.getElementById('txt-bg').value;

      const previewBox = document.getElementById('txt-preview');
      const previewText = document.getElementById('txt-preview-text');

      previewBox.style.backgroundColor = bg;
      previewText.style.color = color;
      previewText.style.fontFamily = font;
      previewText.style.fontSize = size;
      previewText.style.textAlign = align;
      previewText.innerText = content;
    }

    function createTextWidget() {
      const content = document.getElementById('txt-content').value || "Empty note";
      const font = document.getElementById('txt-font').value;
      const size = document.getElementById('txt-size').value;
      const align = document.getElementById('txt-align').value;
      const color = document.getElementById('txt-color').value;
      const bg = document.getElementById('txt-bg').value;

      const widgetData = {
        type: 'text',
        id: 'txt_' + Date.now(),
        content, font, size, align, color, bg,
        width: '240px',
        height: '160px',
        top: '100px',
        left: '100px'
      };

      saveWidgetToStorage(widgetData);
      createTextNodeWidget(widgetData);
      closeTextEditorModal();
      document.getElementById('txt-content').value = "";
    }

    function createTextNodeWidget(data) {
      const canvas = document.getElementById('main-canvas');
      const placeholder = document.getElementById('canvas-placeholder');
      if (placeholder) placeholder.remove();

      const widget = document.createElement('div');
      widget.className = "draggable-widget rounded-2xl shadow-2xl p-4 flex flex-col border border-zinc-700/50";
      widget.id = data.id;
      widget.style.width = data.width;
      widget.style.height = data.height;
      widget.style.top = data.top;
      widget.style.left = data.left;
      widget.style.backgroundColor = data.bg;
      widget.style.color = data.color;
      widget.style.fontFamily = data.font;
      widget.dataset.type = 'text';

      const textBox = document.createElement('div');
      textBox.className = "flex-1 overflow-auto outline-none";
      textBox.style.fontSize = data.size;
      textBox.style.textAlign = data.align;
      textBox.innerText = data.content;
      textBox.contentEditable = "false";

      let textClickTimeout = null;
      widget.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
        e.stopPropagation();
        if (textClickTimeout) {
          clearTimeout(textClickTimeout);
          textClickTimeout = null;
          textBox.contentEditable = "true";
          textBox.focus();
        } else {
          textClickTimeout = setTimeout(() => {
            textClickTimeout = null;
          }, 300);
        }
      });

      textBox.addEventListener('blur', () => {
        textBox.contentEditable = "false";
        updateWidgetStorage(widget.id, { content: textBox.innerText });
      });

      widget.appendChild(textBox);
      makeDraggable(widget);
      canvas.appendChild(widget);
    }

    // Generic Drag and Drop behavior for widgets (Restricted to Edit Mode) & Resizing tracking
    function makeDraggable(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      elmnt.onpointerdown = dragMouseDown;

      function dragMouseDown(e) {
        if (!state.editMode) return; // Only allow drag and drop in edit mode
        if (e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onpointerup = closeDragElement;
        document.onpointermove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onpointerup = null;
        document.onpointermove = null;
        updateWidgetStorage(elmnt.id, {
          top: elmnt.style.top,
          left: elmnt.style.left,
          width: elmnt.style.width,
          height: elmnt.style.height
        });
      }

      // Track Resizing Changes
      const observer = new ResizeObserver(() => {
        updateWidgetStorage(elmnt.id, {
          width: elmnt.style.width,
          height: elmnt.style.height
        });
      });
      observer.observe(elmnt);
    }

    // Persistence Layer Helpers using localStorage
    function saveWidgetToStorage(data) {
      let widgets = JSON.parse(localStorage.getItem('dashboard_widgets') || '[]');
      widgets.push(data);
      localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
    }

    function updateWidgetStorage(id, updatedFields) {
      let widgets = JSON.parse(localStorage.getItem('dashboard_widgets') || '[]');
      widgets = widgets.map(w => w.id === id ? { ...w, ...updatedFields } : w);
      localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
    }

    function removeWidgetFromStorage(id) {
      let widgets = JSON.parse(localStorage.getItem('dashboard_widgets') || '[]');
      widgets = widgets.filter(w => w.id !== id);
      localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
    }

    function loadWidgetsFromStorage() {
      let widgets = JSON.parse(localStorage.getItem('dashboard_widgets') || '[]');
      if (widgets.length > 0) {
        const placeholder = document.getElementById('canvas-placeholder');
        if (placeholder) placeholder.remove();
        widgets.forEach(w => {
          if (w.type === 'image') {
            createImageWidget(w);
          } else if (w.type === 'text') {
            createTextNodeWidget(w);
          }
        });
      }
    }

    // Percentage Calculator Handlers
    function openPercentageModal(event) {
      if (event) event.stopPropagation();
      closeHamburgerMenu();
      document.getElementById('percentage-modal').classList.remove('hidden');
      document.getElementById('calc-val1').focus();
    }

    function closePercentageModal() {
      document.getElementById('percentage-modal').classList.add('hidden');
    }

    function calculatePercentage() {
      const v1 = parseFloat(document.getElementById('calc-val1').value);
      const v2 = parseFloat(document.getElementById('calc-val2').value);
      const resultEl = document.getElementById('calc-result');

      if (isNaN(v1) || isNaN(v2)) {
        resultEl.innerText = "0";
        return;
      }

      const res = (v1 * v2) / 100;
      resultEl.innerText = Number.isInteger(res) ? res : res.toFixed(2);
    }

    // Other Menu Action Handlers
    function openLyrics(event) { if (event) event.stopPropagation(); window.location.href = 'lyrics.html'; }
    function openLinkModal(event) { if (event) event.stopPropagation(); alert("Opening Add Link Modal..."); }
    function openWebVideoModal(event) { if (event) event.stopPropagation(); alert("Opening Add Web Video Modal..."); }
    function openChecklistModal(event) { if (event) event.stopPropagation(); alert("Opening Add Checklist Modal..."); }
    function openNewFolderModal(event) { if (event) event.stopPropagation(); alert("Opening New Folder Modal..."); }
    function openUploadModal(event) { if (event) event.stopPropagation(); alert("Opening Add Item Modal..."); }
    function openAppModal(event) { if (event) event.stopPropagation(); alert("Opening Add App Modal..."); }
    function syncWithGitHub(event) { if (event) event.stopPropagation(); alert("Syncing with GitHub..."); }
    function resetToken(event) { if (event) event.stopPropagation(); alert("Resetting GitHub Token..."); }
    function forcePullCloudData(event) { if (event) event.stopPropagation(); alert("Pulling Cloud Data..."); }
  </script>
