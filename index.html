<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden select-none" onclick="closeAllMenus()">

  <!-- App Container -->
  <div id="app" class="flex flex-col h-full w-full relative">

    <!-- HEADER / NAVIGATION SECTION -->
    <header class="shrink-0 z-50 bg-black/95 backdrop-blur-lg border-b border-zinc-900 px-3 py-2 flex flex-col gap-2 relative">
      <!-- Top Row: Scrollable First Row Menu -->
      <div class="flex items-center justify-between gap-2 w-full">
        <div class="flex items-center gap-1.5 shrink-0 overflow-x-auto no-scrollbar py-1 w-full">
          <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          
          <button onclick="toggleEditMode()" id="edit-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0">
            Edit Mode Locked
          </button>
          <button onclick="document.getElementById('photo-input').click()" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0" title="Add IMG">
            <i data-lucide="image" class="w-4 h-4"></i>
            <span>ADD IMG</span>
          </button>
          <button onclick="openTextEditorModal()" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0" title="Add Text Bubble">
            <i data-lucide="message-square" class="w-4 h-4"></i>
            <span>ADD TXT</span>
          </button>
          <button onclick="toggleSelectMode()" id="select-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0">
            SELECT
          </button>
          <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0">
            <span onclick="navigateTo(null)" class="cursor-pointer hover:text-white">Home</span>
          </div>
        </div>
      </div>

      <!-- Second Menu Row: LYRICS, %, Add Link, Add Web Video, Add Checklist -->
      <div class="flex items-center gap-2 border-t border-zinc-800/80 pt-2 overflow-x-auto no-scrollbar">
        <button onclick="window.location.href='lyrics.html'" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="mic" class="w-3.5 h-3.5"></i>
          <span>LYRICS</span>
        </button>
        <button onclick="openPercentageModal(event)" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="percent" class="w-3.5 h-3.5"></i>
          <span>%</span>
        </button>
        <button onclick="openLinkModal()" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="link" class="w-3.5 h-3.5"></i>
          <span>Add Link</span>
        </button>
        <button onclick="openWebVideoModal()" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="video" class="w-3.5 h-3.5"></i>
          <span>Add Web Video</span>
        </button>
        <button onclick="openChecklistModal()" class="px-3 py-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shrink-0 cursor-pointer">
          <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
          <span>Add Checklist</span>
        </button>
      </div>

      <!-- Hamburger Menu Dropdown -->
      <div id="hamburger-dropdown" class="hidden absolute top-14 left-3 w-64 bg-black border border-zinc-700/90 rounded-2xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-2 flex flex-col gap-1 px-2">
        <button onclick="navigateTo(null); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
        </button>
        <button onclick="openNewFolderModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
        </button>
        <button onclick="openUploadModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i> Add Item
        </button>
        <button onclick="openAppModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
          <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i> Add App
        </button>
        <div class="h-px bg-zinc-800 my-1"></div>
        <button onclick="syncWithGitHub(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
          <i data-lucide="cloud" class="w-4 h-4 text-zinc-400"></i>
          <span>Sync</span>
        </button>
        <button onclick="resetToken(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
          <i data-lucide="key" class="w-4 h-4 text-zinc-400"></i> Update GitHub token
        </button>
        <button onclick="forcePullCloudData(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-amber-400 font-bold cursor-pointer">
          <i data-lucide="download-cloud" class="w-4 h-4"></i> Pull Cloud
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center text-zinc-500">
      <p>Main content area goes here.</p>
    </main>

  </div>

  <!-- Percentage Modal Element -->
  <div id="percentage-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm" onclick="event.stopPropagation()">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-80 p-5 text-white shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-sm text-amber-400 flex items-center gap-2"><i data-lucide="percent" class="w-4 h-4"></i> Percentage Calculator</h3>
        <button onclick="closePercentageModal()" class="text-zinc-400 hover:text-white cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="flex flex-col gap-3 text-xs">
        <div class="flex flex-col gap-1">
          <label class="text-zinc-400 font-semibold">What is</label>
          <div class="flex items-center gap-2">
            <input type="number" id="calc-val1" placeholder="e.g. 50" oninput="calculatePercentage()" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
            <span class="text-zinc-400">% of</span>
          </div>
        </div>
        <div class="flex flex-col gap-1">
          <input type="number" id="calc-val2" placeholder="e.g. 200" oninput="calculatePercentage()" class="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="bg-black/60 border border-zinc-800 rounded-xl p-3 flex flex-col items-center justify-center">
          <span class="text-zinc-400 text-[10px]">Result</span>
          <span id="calc-result" class="text-lg font-bold text-amber-400 mt-0.5">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for Images -->
  <input type="file" id="photo-input" class="hidden" accept="image/*">

  <!-- Core JavaScript Handlers -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // App State
    let state = {
      hamburgerMenuOpen: false,
      editMode: false,
      selectMode: false,
      currentFolderId: null,
      isSyncing: false,
      items: []
    };

    function toggleHamburgerMenu(event) {
      event.stopPropagation();
      state.hamburgerMenuOpen = !state.hamburgerMenuOpen;
      const dropdown = document.getElementById('hamburger-dropdown');
      if (state.hamburgerMenuOpen) {
        dropdown.classList.remove('hidden');
      } else {
        dropdown.classList.add('hidden');
      }
    }

    function closeHamburgerMenu() {
      state.hamburgerMenuOpen = false;
      const dropdown = document.getElementById('hamburger-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
    }

    function closeAllMenus() {
      closeHamburgerMenu();
    }

    function toggleEditMode() {
      state.editMode = !state.editMode;
      const btn = document.getElementById('edit-mode-btn');
      if (state.editMode) {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-yellow-500/20 border-yellow-500 text-yellow-400 shrink-0";
        btn.innerText = "Edit Mode On";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0";
        btn.innerText = "Edit Mode Locked";
      }
    }

    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      const btn = document.getElementById('select-mode-btn');
      if (state.selectMode) {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-indigo-500/20 border-indigo-500 text-indigo-300 shrink-0";
        btn.innerText = "Cancel";
      } else {
        btn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0";
        btn.innerText = "SELECT";
      }
    }

    function navigateTo(folderId) {
      state.currentFolderId = folderId;
      console.log("Navigated to folder:", folderId);
    }

    // Percentage Calculator Handlers
    function openPercentageModal(event) {
      if (event) event.stopPropagation();
      closeHamburgerMenu();
      document.getElementById('percentage-modal').classList.remove('hidden');
      document.getElementById('calc-val1').focus();
    }

    function closePercentageModal() {
      document.getElementById('percentage-modal').classList.add('hidden');
    }

    function calculatePercentage() {
      const v1 = parseFloat(document.getElementById('calc-val1').value);
      const v2 = parseFloat(document.getElementById('calc-val2').value);
      const resultEl = document.getElementById('calc-result');

      if (isNaN(v1) || isNaN(v2)) {
        resultEl.innerText = "0";
        return;
      }

      const res = (v1 * v2) / 100;
      resultEl.innerText = Number.isInteger(res) ? res : res.toFixed(2);
    }

    // Modal & Menu Action Handlers
    function openTextEditorModal() { alert("Opening Text Editor Modal..."); }
    function openNewFolderModal() { alert("Opening New Folder Modal..."); }
    function openUploadModal() { alert("Opening Add Item Modal..."); }
    function openLinkModal() { alert("Opening Add Link Modal..."); }
    function openWebVideoModal() { alert("Opening Add Web Video Modal..."); }
    function openAppModal() { alert("Opening Add App Modal..."); }
    function openChecklistModal() { alert("Opening Add Checklist Modal..."); }
    function syncWithGitHub() { alert("Syncing with GitHub..."); }
    function resetToken() { alert("Resetting GitHub Token..."); }
    function forcePullCloudData() { alert("Pulling Cloud Data..."); }
  </script>
</body>
</html>
