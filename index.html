<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gothic Archive (Formation & Snap-to-Grid)</title>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: #141418;
            --panel-border: #2a2a35;
            --accent-color: #8b0000;
            --accent-hover: #a30000;
            --text-primary: #e0e0e6;
            --text-secondary: #9393a1;
            --grid-color: rgba(139, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Infinite Scroll Canvas Workspace */
        #workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            cursor: grab;
            transform-origin: 0 0;
        }

        #workspace:active {
            cursor: grabbing;
        }

        /* Subtle Guide Grid (Visible only in Edit Mode) */
        body.edit-mode #workspace {
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* UI Toolbar / Formatting Bar */
        #toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button, label.btn-label {
            background: #1f1f28;
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover, label.btn-label:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        button.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        input[type="file"], input[type="text"] {
            display: none;
        }

        /* Relics and Folders Container / Elements */
        .relic, .folder {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        body.edit-mode .relic, body.edit-mode .folder {
            cursor: move;
            border-color: #4a4a5e;
        }

        body.edit-mode .relic:hover, body.edit-mode .folder:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.4);
        }

        /* Relic Content Styling */
        .relic {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 150px;
            min-height: 150px;
        }

        .relic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            pointer-events: none;
        }

        .relic .link-thumbnail-name {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            word-break: break-all;
            padding: 2px 4px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        /* Folders Styling */
        .folder {
            padding: 15px;
            min-width: 220px;
            min-height: 160px;
        }

        .folder-header {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-content {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        /* Context Menus / Modals */
        .context-menu {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 2000;
            min-width: 160px;
            overflow: hidden;
        }

        .context-menu button {
            background: transparent;
            border: none;
            border-radius: 0;
            text-align: left;
            padding: 10px 15px;
            width: 100%;
        }

        .context-menu button:hover {
            background: var(--accent-color);
        }

        /* Confirmation Dialog Overlay */
        #confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .confirm-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .confirm-box p {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        /* Zoom and Navigation Info */
        #zoom-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 1000;
        }
    </style>
</head>
<body class="edit-mode">

    <!-- UI Toolbar -->
    <div id="toolbar">
        <button id="mode-btn" class="active">Edit Mode: ON</button>
        <button id="recenter-btn">Recentrate</button>
        <button id="add-folder-btn">Add Folder</button>
        <button id="add-link-btn">Add Link</button>
        <label class="btn-label" for="image-upload-input">Upload Image</label>
        <input type="file" id="image-upload-input" accept="image/*">
        <button id="save-btn">Save</button>
        <label class="btn-label" for="load-file-input">Load</label>
        <input type="file" id="load-file-input" accept=".json">
    </div>

    <!-- Infinite Scroll Workspace -->
    <div id="workspace"></div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu">
        <button id="ctx-resize-finger">Resize by finger</button>
        <button id="ctx-resize-original">Resize to Original</button>
        <label id="ctx-change-image-label" style="display:none;" for="ctx-change-image-input">
            <button as="span">Change the image</button>
        </label>
        <input type="file" id="ctx-change-image-input" accept="image/*" style="display:none;">
        <button id="ctx-rename">Rename</button>
        <button id="ctx-move-folder">Move to folder</button>
        <button id="ctx-delete">Delete</button>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal">
        <div class="confirm-box">
            <p>Are you sure you want to delete this item?</p>
            <div class="confirm-actions">
                <button id="confirm-yes" style="background: var(--accent-color);">Yes</button>
                <button id="confirm-no">No</button>
            </div>
        </div>
    </div>

    <div id="zoom-indicator">Zoom: 100%</div>

    <script>
        const workspace = document.getElementById('workspace');
        const modeBtn = document.getElementById('mode-btn');
        const recenterBtn = document.getElementById('recenter-btn');
        const addFolderBtn = document.getElementById('add-folder-btn');
        const addLinkBtn = document.getElementById('add-link-btn');
        const imageUploadInput = document.getElementById('image-upload-input');
        const saveBtn = document.getElementById('save-btn');
        const loadFileInput = document.getElementById('load-file-input');
        const zoomIndicator = document.getElementById('zoom-indicator');
        
        const contextMenu = document.getElementById('context-menu');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmYes = document.getElementById('confirm-yes');
        const confirmNo = document.getElementById('confirm-no');

        // Context Menu Options Elements
        const ctxResizeFinger = document.getElementById('ctx-resize-finger');
        const ctxResizeOriginal = document.getElementById('ctx-resize-original');
        const ctxChangeImageContainer = document.getElementById('ctx-change-image-label');
        const ctxChangeImageInput = document.getElementById('ctx-change-image-input');
        const ctxRename = document.getElementById('ctx-rename');
        const ctxMoveFolder = document.getElementById('ctx-move-folder');
        const ctxDelete = document.getElementById('ctx-delete');

        let isEditMode = true;
        let scale = 1;
        let panX = 2000;
        let panY = 2000;
        let isPanning = false;
        let startX = 0;
        let startY = 0;

        let activeElement = null;
        let deleteTarget = null;
        let items = []; // Stores relational items/folders data

        // Initial centering of workspace
        function updateTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomIndicator.textContent = `Zoom: ${Math.round(scale * 100)}%`;
        }

        function recenterCanvas() {
            panX = window.innerWidth / 2 - 2500 * scale;
            panY = window.innerHeight / 2 - 2500 * scale;
            updateTransform();
        }

        // Initialize view
        recenterCanvas();

        // Mode Toggling
        modeBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);
            modeBtn.classList.toggle('active', isEditMode);
            modeBtn.textContent = `Edit Mode: ${isEditMode ? 'ON' : 'OFF'}`;
            if (!isEditMode) hideContextMenu();
        });

        recenterBtn.addEventListener('click', recenterCanvas);

        // Canvas Panning and Zooming (Infinite Scroll / Zoom Mechanism)
        window.addEventListener('mousedown', (e) => {
            if (e.target === document.body || e.target === workspace) {
                if (e.button === 0) {
                    isPanning = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                    hideContextMenu();
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            let oldScale = scale;
            if (e.deltaY < 0) {
                scale += zoomIntensity;
            } else {
                scale -= zoomIntensity;
            }
            scale = Math.min(Math.max(0.2, scale), 3);

            // Zoom relative to mouse position
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            panX = mouseX - (mouseX - panX) * (scale / oldScale);
            panY = mouseY - (mouseY - panY) * (scale / oldScale);

            updateTransform();
        }, { passive: false });

        // Dragging Relics/Folders with Soft Snap-to-Grid
        let draggedItem = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function attachDragListeners(element) {
            element.addEventListener('mousedown', (e) => {
                if (!isEditMode) return;
                if (e.button !== 0) return; // Only left click
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('.folder-content')) return;
                
                draggedItem = element;
                const rect = element.getBoundingClientRect();
                dragOffsetX = (e.clientX - rect.left) / scale;
                dragOffsetY = (e.clientY - rect.top) / scale;
                
                element.style.zIndex = 1000;
                hideContextMenu();
                e.stopPropagation();
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (!draggedItem || !isEditMode) return;
            
            let rawX = (e.clientX - workspace.getBoundingClientRect().left) / scale - dragOffsetX;
            let rawY = (e.clientY - workspace.getBoundingClientRect().top) / scale - dragOffsetY;

            // Soft Snap to Grid (40px grid size)
            const gridSize = 40;
            let snapX = Math.round(rawX / gridSize) * gridSize;
            let snapY = Math.round(rawY / gridSize) * gridSize;

            // Soft snap threshold check (snap if very close)
            if (Math.abs(rawX - snapX) < 12) rawX = snapX;
            if (Math.abs(rawY - snapY) < 12) rawY = snapY;

            draggedItem.style.left = `${rawX}px`;
            draggedItem.style.top = `${rawY}px`;
        });

        window.addEventListener('mouseup', () => {
            if (draggedItem) {
                draggedItem.style.zIndex = 1;
                draggedItem = null;
            }
        });

        // Context Menu & Long Press / Right Click Handlers
        function showContextMenu(e, target) {
            if (!isEditMode) return;
            e.preventDefault();
            activeElement = target;
            
            contextMenu.style.display = 'flex';
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.style.top = `${e.clientY}px`;

            // Adjust change image visibility
            if (target.classList.contains('relic') && target.querySelector('img')) {
                ctxChangeImageContainer.style.display = 'block';
            } else {
                ctxChangeImageContainer.style.display = 'none';
            }
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            activeElement = null;
        }

        window.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                hideContextMenu();
            }
        });

        // Context Menu Action Listeners
        ctxResizeFinger.addEventListener('click', () => {
            if (!activeElement) return;
            // Quick interactive scale toggle / simulation for finger resizing
            let currentWidth = activeElement.offsetWidth;
            activeElement.style.width = `${currentWidth + 40}px`;
            hideContextMenu();
        });

        ctxResizeOriginal.addEventListener('click', () => {
            if (!activeElement) return;
            activeElement.style.width = '';
            activeElement.style.height = '';
            hideContextMenu();
        });

        ctxChangeImageInput.addEventListener('change', (e) => {
            if (!activeElement || !e.target.files[0]) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = activeElement.querySelector('img');
                if (img) img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            hideContextMenu();
        });

        ctxRename.addEventListener('click', () => {
            if (!activeElement) return;
            const newName = prompt('Enter new name:', 'Archive Relic');
            if (newName) {
                if (activeElement.classList.contains('folder')) {
                    activeElement.querySelector('.folder-title-text').textContent = newName;
                } else if (activeElement.classList.contains('relic')) {
                    const nameTag = activeElement.querySelector('.link-thumbnail-name');
                    if (nameTag) nameTag.textContent = newName;
                }
            }
            hideContextMenu();
        });

        ctxMoveFolder.addEventListener('click', () => {
            if (!activeElement) return;
            alert('Move to folder feature: Item ready for reorganization.');
            hideContextMenu();
        });

        ctxDelete.addEventListener('click', () => {
            if (!activeElement) return;
            deleteTarget = activeElement;
            confirmModal.style.display = 'flex';
            hideContextMenu();
        });

        // Confirmation Modal Logic
        confirmYes.addEventListener('click', () => {
            if (deleteTarget) {
                deleteTarget.remove();
                deleteTarget = null;
            }
            confirmModal.style.display = 'none';
        });

        confirmNo.addEventListener('click', () => {
            deleteTarget = null;
            confirmModal.style.display = 'none';
        });

        // Folder Creation
        addFolderBtn.addEventListener('click', () => {
            createFolder('Gothic Archive Folder', 2200, 2200);
        });

        function createFolder(title, x, y) {
            const folder = document.createElement('div');
            folder.className = 'folder';
            folder.style.left = `${x}px`;
            folder.style.top = `${y}px`;

            folder.innerHTML = `
                <div class="folder-header">
                    <span class="folder-title-text">${title}</span>
                    <span style="font-size: 12px; color: var(--text-secondary);">📁</span>
                </div>
                <div class="folder-content"></div>
            `;

            folder.addEventListener('contextmenu', (e) => showContextMenu(e, folder));
            attachDragListeners(folder);
            workspace.appendChild(folder);
        }

        // Add Link / Relic Thumbnail Handling
        addLinkBtn.addEventListener('click', () => {
            const url = prompt('Enter target URL or link name:');
            if (!url) return;
            createLinkRelic(url, 2250, 2250);
        });

        function createLinkRelic(linkName, x, y) {
            const relic = document.createElement('div');
            relic.className = 'relic';
            relic.style.left = `${x}px`;
            relic.style.top = `${y}px`;
            relic.style.width = '180px';

            relic.innerHTML = `
                <div style="width: 100%; height: 110px; background: #1f1f28; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 24px;">🔗</div>
                <div class="link-thumbnail-name">${linkName}</div>
            `;

            relic.addEventListener('contextmenu', (e) => showContextMenu(e, relic));
            attachDragListeners(relic);
            workspace.appendChild(relic);
        }

        // Image Upload Relic Handling
        imageUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                createImageRelic(event.target.result, 2300, 2300);
            };
            reader.readAsDataURL(file);
            imageUploadInput.value = '';
        });

        function createImageRelic(src, x, y) {
            const relic = document.createElement('div');
            relic.className = 'relic';
            relic.style.left = `${x}px`;
            relic.style.top = `${y}px`;
            relic.style.width = '200px';

            relic.innerHTML = `
                <img src="${src}" alt="Archive Image">
            `;

            relic.addEventListener('contextmenu', (e) => showContextMenu(e, relic));
            attachDragListeners(relic);
            workspace.appendChild(relic);
        }

        // Save & Load Functionality
        saveBtn.addEventListener('click', () => {
            const state = {
                panX,
                panY,
                scale,
                elements: []
            };

            workspace.querySelectorAll('.relic, .folder').forEach(el => {
                const isFolder = el.classList.contains('folder');
                state.elements.push({
                    type: isFolder ? 'folder' : 'relic',
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width,
                    height: el.style.height,
                    title: isFolder ? el.querySelector('.folder-title-text').textContent : null,
                    name: !isFolder && el.querySelector('.link-thumbnail-name') ? el.querySelector('.link-thumbnail-name').textContent : null,
                    imgSrc: !isFolder && el.querySelector('img') ? el.querySelector('img').src : null
                });
            });

            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gothic-archive-state.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        loadFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const state = JSON.parse(event.target.result);
                    workspace.innerHTML = '';
                    panX = state.panX || 2000;
                    panY = state.panY || 2000;
                    scale = state.scale || 1;
                    updateTransform();

                    state.elements.forEach(elData => {
                        if (elData.type === 'folder') {
                            createFolder(elData.title, parseFloat(elData.left), parseFloat(elData.top));
                        } else if (elData.imgSrc) {
                            createImageRelic(elData.imgSrc, parseFloat(elData.left), parseFloat(elData.top));
                        } else if (elData.name) {
                            createLinkRelic(elData.name, parseFloat(elData.left), parseFloat(elData.top));
                        }
                    });
                } catch (err) {
                    alert('Failed to load save file.');
                }
            };
            reader.readAsText(file);
            loadFileInput.value = '';
        });

        // Populate initial sample items if empty
        createFolder('Crypt of Relics', 2150, 2150);
        createLinkRelic('Gothic Portal', 2450, 2180);
    </script>
</body>
</html>
