<!DOCTYPE html>
<html lang="en" class="bg-black text-white select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aiden Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .edit-grid-bg {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .touch-none { touch-action: none; }

    .folder-cube {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .folder-cube:active { transform: scale(0.95); }

    .resize-handle {
      width: 28px;
      height: 28px;
      bottom: -4px;
      right: -4px;
      border-top-left-radius: 12px;
      touch-action: none;
      display: none;
    }

    body.edit-mode .resize-handle {
      display: flex;
    }
  </style>
</head>
<body class="bg-black min-h-screen text-zinc-100 selection:bg-zinc-800 overflow-hidden">
  <div id="app" class="h-screen w-screen bg-black text-white flex flex-col overflow-hidden"></div>

  <!-- Hidden Inputs -->
  <input id="file-input" type="file" multiple class="hidden" />
  <input id="photo-input" type="file" accept="image/*,video/*,audio/*" multiple class="hidden" />
  <input id="change-image-input" type="file" accept="image/*" class="hidden" />
  <input id="folder-cover-input" type="file" accept="image/*" class="hidden" />

  <script>
    // --- CONFIG & STATE ---
    const CONFIG = {
      ghRepo: 'aidamn81/aidenfiles',
      ghPath: 'aiden_meta.json',
      GRID_SIZE: 24
    };

    let state = {
      editMode: false,
      selectMode: false,
      selectedIds: [],
      currentFolderId: null,
      folders: [],
      files: [],
      textBubbles: [],
      ghToken: localStorage.getItem('af_gh_token') || '',
      isSyncing: false,
      activeMenuId: null,
      targetChangeImageId: null,
      targetFolderCoverId: null,
      quickViewFileId: null,
      showUploadModal: false,
      textEditorModal: null // { id, text, fontSize, isBold, isItalic, isUnderline, isNew, referenceItemId }
    };

    const uid = () => Math.random().toString(36).substring(2, 9);
    const isFolder = item => !('fileType' in item) && !('isBubble' in item);
    const isBubble = item => item.isBubble === true;

    // --- MEDIA PLAYBACK HELPER ---
    async function getOrCreateBlobUrl(file) {
      if (file.blobUrl) return file.blobUrl;
      if (!file.dataUrl) return '';
      try {
        const res = await fetch(file.dataUrl);
        const blob = await res.blob();
        file.blobUrl = URL.createObjectURL(blob);
        return file.blobUrl;
      } catch (e) {
        return file.dataUrl;
      }
    }

    // --- INDEXEDDB ---
    const DB_NAME = 'aiden_files_db';
    const DB_VERSION = 4;

    function openDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('textBubbles')) db.createObjectStore('textBubbles', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function loadData() {
      const db = await openDB();
      if (db) {
        state.folders = await new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const req = tx.objectStore('folders').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.files = await new Promise(res => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.textBubbles = await new Promise(res => {
          const tx = db.transaction('textBubbles', 'readonly');
          const req = tx.objectStore('textBubbles').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }

      for (let file of state.files) {
        if (file.dataUrl && (file.fileType?.startsWith('video/') || file.fileType?.startsWith('audio/'))) {
          await getOrCreateBlobUrl(file);
        }
      }

      if (state.folders.length === 0) {
        const root = { id: 'root', name: 'Aiden Files', parentId: null, width: 96, height: 96 };
        state.folders = [root];
        saveFolder(root);
      }
      render();
    }

    async function saveFolder(folder) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
      }
    }

    async function saveFile(file) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('files', 'readwrite');
        const fileToSave = { ...file };
        delete fileToSave.blobUrl;
        tx.objectStore('files').put(fileToSave);
      }
    }

    async function saveTextBubble(bubble) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('textBubbles', 'readwrite');
        tx.objectStore('textBubbles').put(bubble);
      }
    }

    async function deleteFromDB(storeName, id) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
      }
    }

    // --- TOKEN & GITHUB SYNC (WITH CHUNKING TO PREVENT 500 ERRORS) ---
    function resetToken() {
      const token = prompt('Enter your GitHub Personal Access Token:', state.ghToken);
      if (token !== null) {
        state.ghToken = token.trim();
        localStorage.setItem('af_gh_token', state.ghToken);
        alert('New token saved successfully!');
        syncWithGitHub();
      }
    }

    async function syncWithGitHub(forcePull = false) {
      if (!state.ghToken) {
        resetToken();
        if (!state.ghToken) return;
      }

      state.isSyncing = true;
      render();

      try {
        let cleanToken = state.ghToken.replace(/^(token|Bearer)\s+/i, '').trim();
        const authHeader = `token ${cleanToken}`;
        const headers = {
          'Authorization': authHeader,
          'Accept': 'application/vnd.github.v3+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };

        const metaUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/aiden_meta.json`;
        
        if (forcePull) {
          const getRes = await fetch(metaUrl, { headers });
          if (getRes.ok) {
            const getJson = await getRes.json();
            const manifest = JSON.parse(decodeURIComponent(escape(atob(getJson.content))));
            
            let allFolders = [];
            let allFiles = [];
            let allBubbles = [];

            for (let chunkFileName of manifest.chunks) {
              const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;
              const chunkRes = await fetch(chunkUrl, { headers });
              if (chunkRes.ok) {
                const chunkJson = await chunkRes.json();
                const chunkData = JSON.parse(decodeURIComponent(escape(atob(chunkJson.content))));
                if (chunkData.folders) allFolders.push(...chunkData.folders);
                if (chunkData.files) allFiles.push(...chunkData.files);
                if (chunkData.textBubbles) allBubbles.push(...chunkData.textBubbles);
              }
            }

            state.folders = allFolders.length > 0 ? allFolders : state.folders;
            state.files = allFiles.length > 0 ? allFiles : state.files;
            state.textBubbles = allBubbles.length > 0 ? allBubbles : state.textBubbles;

            for (let file of state.files) {
              if (file.dataUrl && (file.fileType?.startsWith('video/') || file.fileType?.startsWith('audio/'))) {
                await getOrCreateBlobUrl(file);
              }
            }

            for (let f of state.folders) await saveFolder(f);
            for (let fi of state.files) await saveFile(fi);
            for (let b of state.textBubbles) await saveTextBubble(b);
            alert('Synced chunks down from Cloud successfully!');
            state.isSyncing = false;
            render();
            return;
          }
        }

        const sanitizedFiles = state.files.map(file => {
          const copy = { ...file };
          delete copy.blobUrl;
          return copy;
        });

        const CHUNK_SIZE = 15;
        const fileChunks = [];
        for (let i = 0; i < sanitizedFiles.length; i += CHUNK_SIZE) {
          fileChunks.push(sanitizedFiles.slice(i, i + CHUNK_SIZE));
        }
        if (fileChunks.length === 0) fileChunks.push([]);

        const chunkFileNames = [];

        for (let index = 0; index < fileChunks.length; index++) {
          const chunkFileName = `chunk_${index}.json`;
          chunkFileNames.push(chunkFileName);
          const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;

          let chunkSha = null;
          const existingChunkRes = await fetch(chunkUrl, { headers });
          if (existingChunkRes.ok) {
            const existingData = await existingChunkRes.json();
            chunkSha = existingData.sha;
          }

          const chunkPayloadData = {
            folders: index === 0 ? state.folders : [],
            files: fileChunks[index],
            textBubbles: index === 0 ? state.textBubbles : []
          };

          const chunkPutPayload = {
            message: `Sync Aiden Files Chunk ${index}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(chunkPayloadData)))),
            ...(chunkSha && { sha: chunkSha })
          };

          let putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          if (putRes.status === 500) {
            await new Promise(r => setTimeout(r, 1500));
            putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          }
          if (!putRes.ok) {
            throw new Error(`Failed to upload chunk ${index} (status ${putRes.status})`);
          }
        }

        let metaSha = null;
        const existingMetaRes = await fetch(metaUrl, { headers });
        if (existingMetaRes.ok) {
          const metaJson = await existingMetaRes.json();
          metaSha = metaJson.sha;
        }

        const metaManifest = { chunks: chunkFileNames, updatedAt: new Date().toISOString() };
        const metaPutPayload = {
          message: 'Update Aiden Files Manifest',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(metaManifest)))),
          ...(metaSha && { sha: metaSha })
        };

        const metaPutRes = await fetch(metaUrl, { method: 'PUT', headers, body: JSON.stringify(metaPutPayload) });
        if (!metaPutRes.ok) {
          throw new Error('Failed to update manifest file on GitHub.');
        }

        alert('Chunked Sync Successful! Cloud backup updated safely without server errors.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    // --- RENDER & UI ---
    function render() {
      const app = document.getElementById('app');
      const currentFolder = state.folders.find(f => f.id === state.currentFolderId);
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];
      const allChildrenSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));

      if (state.editMode) {
        document.body.classList.add('edit-mode');
      } else {
        document.body.classList.remove('edit-mode');
      }

      app.innerHTML = `
        <header class="shrink-0 z-35 bg-black/95 backdrop-blur-lg border-b border-zinc-900 px-3 py-2 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar whitespace-nowrap">
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="navigateTo(null)" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 shadow-md shrink-0">
              <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
            </button>
            <button onclick="openNewFolderModal()" class="px-3.5 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-bold rounded-xl text-xs flex items-center gap-1.5 border border-zinc-700/60 shadow-sm cursor-pointer shrink-0">
              <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
            </button>
            <button onclick="openUploadModal()" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/20 cursor-pointer shrink-0">
              <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i> Add Item
            </button>
            <button onclick="syncWithGitHub()" class="px-2.5 py-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-xl text-xs font-bold text-zinc-300 flex items-center gap-1.5 shadow-sm shrink-0">
              <i data-lucide="${state.isSyncing ? 'refresh-cw' : 'cloud'}" class="w-3.5 h-3.5 ${state.isSyncing ? 'animate-spin text-amber-400' : 'text-zinc-400'}"></i>
              <span>${state.isSyncing ? 'Syncing...' : 'Sync'}</span>
            </button>
            <button onclick="resetToken()" title="Update GitHub token" class="p-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-xl text-zinc-400 hover:text-zinc-200 shrink-0">
              <i data-lucide="key" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="forcePullCloudData()" title="Force Pull from Cloud" class="px-2.5 py-2 bg-zinc-900 border border-zinc-800 hover:border-zinc-700 rounded-xl text-xs font-bold text-amber-400 flex items-center gap-1.5 shadow-sm shrink-0">
              <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i>
              <span>Pull Cloud</span>
            </button>
            <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0 border-l border-zinc-800">
              <span onclick="navigateTo(null)" class="cursor-pointer hover:text-white">Home</span>
              ${currentFolder ? `<span class="text-zinc-600">/</span><span class="text-white font-semibold truncate">${currentFolder.name}</span>` : ''}
            </div>
            ${state.selectMode ? `
              <button onclick="toggleSelectAll()" class="px-2.5 py-2 bg-indigo-950 border border-indigo-700 rounded-xl text-xs font-bold text-indigo-300 flex items-center gap-1 shadow-sm shrink-0">
                <i data-lucide="${allChildrenSelected ? 'check-square' : 'square'}" class="w-3.5 h-3.5"></i>
                ${allChildrenSelected ? 'Deselect All' : 'Select All'}
              </button>
            ` : ''}
            <button onclick="toggleSelectMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.selectMode ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
              ${state.selectMode ? 'Cancel' : 'Select'}
            </button>
            <button onclick="toggleEditMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.editMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
              ${state.editMode ? 'Edit Mode On' : 'Edit Mode Locked'}
            </button>
          </div>
        </header>

        <main onclick="closeMenu()" class="flex-1 relative w-full h-full overflow-auto ${state.editMode ? 'edit-grid-bg' : ''}">
          ${items.length === 0 ? `
            <div class="flex flex-col items-center justify-center h-full text-center p-6 text-zinc-500 text-sm gap-3">
              <span>Folder is empty</span>
              <button onclick="forcePullCloudData()" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-xl text-xs text-amber-400 font-bold flex items-center gap-2">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Restore / Sync from Cloud Backup
              </button>
            </div>
          ` : `
            <div class="relative min-w-[1200px] min-h-[1200px] p-4">
              ${items.map((item, index) => renderItem(item, index)).join('')}
            </div>
          `}
        </main>

        ${state.selectMode && state.selectedIds.length > 0 ? `
          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900/95 border border-zinc-700 backdrop-blur-xl px-6 py-3.5 rounded-2xl shadow-2xl z-40 flex items-center gap-5">
            <span class="text-xs font-bold text-zinc-300">${state.selectedIds.length} Selected</span>
            <div class="h-4 w-px bg-zinc-800"></div>
            <button onclick="bulkCopy()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="copy" class="w-4 h-4"></i> Copy to Clipboard</button>
            <button onclick="bulkMove()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="folder-output" class="w-4 h-4"></i> Move</button>
            <button onclick="bulkShare()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="share" class="w-4 h-4"></i> iOS Share</button>
            <button onclick="bulkDelete()" class="flex items-center gap-1.5 text-xs text-red-400 hover:text-red-300 font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
          </div>
        ` : ''}

        ${state.showUploadModal ? renderUploadModal() : ''}
        ${state.quickViewFileId ? renderQuickViewModal() : ''}
        ${state.textEditorModal ? renderTextEditorModal() : ''}
      `;

      if (window.lucide) window.lucide.createIcons();
      attachDragAndResizeListeners();
    }

    function getFileIcon(type, name) {
      if (type.startsWith('video/') || name.endsWith('.mp4') || name.endsWith('.mov') || name.endsWith('.webm')) return 'video';
      if (type.startsWith('audio/')) return 'music';
      if (type === 'application/pdf' || name.endsWith('.pdf')) return 'file-text';
      if (type.startsWith('text/') || name.endsWith('.txt')) return 'file-text';
      return 'file';
    }

    function renderItem(item, index) {
      const col = index % 4;
      const row = Math.floor(index / 4);
      const posX = item.x !== undefined ? item.x : (20 + col * 140);
      const posY = item.y !== undefined ? item.y : (20 + row * 160);
      const itemWidth = item.width || (isFolder(item) ? 96 : isBubble(item) ? 140 : 112);
      const itemHeight = item.height || (isFolder(item) ? 96 : isBubble(item) ? 80 : 144);
      const folder = isFolder(item);
      const bubble = isBubble(item);
      const isMenuOpen = state.activeMenuId === item.id;
      const isSelected = state.selectedIds.includes(item.id);

      if (bubble) {
        const fontSizeClass = item.fontSize === 'lg' ? 'text-base' : item.fontSize === 'sm' ? 'text-[10px]' : 'text-[11px]';
        const fontWeightStyle = item.isBold ? 'font-bold' : 'font-medium';
        const fontStyleStyle = item.isItalic ? 'italic' : '';
        const fontUnderlineStyle = item.isUnderline ? 'underline' : '';

        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; min-height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false, true)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : (state.editMode ? 'border-yellow-500/60' : 'border-zinc-700')} rounded-2xl p-3 shadow-lg relative flex flex-col justify-between overflow-hidden">
              <div class="w-full h-full whitespace-pre-wrap break-words leading-tight select-none pointer-events-none ${fontSizeClass} ${fontWeightStyle} ${fontStyleStyle} ${fontUnderlineStyle}">${item.text || 'Empty bubble'}</div>
              ${state.selectMode ? `<div class="absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>` : ''}
              <button type="button" onclick="toggleMenu(event, '${item.id}')" class="absolute top-1.5 right-1.5 p-1.5 bg-black/70 hover:bg-black rounded-full text-zinc-200 z-45 cursor-pointer shadow-md"><i data-lucide="more-vertical" class="w-3.5 h-3.5 pointer-events-none"></i></button>
            </div>
            <div class="resize-handle absolute bottom-0 right-0 bg-yellow-500 rounded-tl-xl cursor-se-resize flex items-center justify-center z-20 shadow-md"><i data-lucide="arrow-down-right" class="w-3 h-3 text-black stroke-[3]"></i></div>
            ${isMenuOpen ? renderContextMenu(item, false, true) : ''}
          </div>
        `;
      } else if (folder) {
        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', true)">
            <div class="folder-cube w-full h-full shrink-0 bg-gradient-to-b from-zinc-800 to-zinc-950 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : 'border-zinc-700/60'} flex flex-col items-center justify-center relative overflow-hidden group">
              ${item.coverUrl ? `<img src="${item.coverUrl}" class="w-full h-full object-cover rounded-[20px] pointer-events-none" />` : `<i data-lucide="folder" class="w-10 h-10 text-amber-400 fill-amber-400/20 stroke-[1.5] pointer-events-none"></i>`}
              ${state.selectMode ? `<div class="absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>` : ''}
              <button type="button" onclick="toggleMenu(event, '${item.id}')" class="absolute top-1.5 right-1.5 p-2 bg-black/70 hover:bg-black rounded-full text-zinc-200 z-45 cursor-pointer shadow-md"><i data-lucide="more-vertical" class="w-4 h-4 pointer-events-none"></i></button>
            </div>
            <span class="text-[11px] font-medium text-zinc-300 w-full truncate text-center mt-1.5 pointer-events-none">${item.name}</span>
            <div class="resize-handle absolute bottom-0 right-0 bg-yellow-500 rounded-tl-xl cursor-se-resize flex items-center justify-center z-20 shadow-md"><i data-lucide="arrow-down-right" class="w-3 h-3 text-black stroke-[3]"></i></div>
            ${isMenuOpen ? renderContextMenu(item, true) : ''}
          </div>
        `;
      } else {
        const type = item.fileType || '';
        const isImage = type.startsWith('image/');
        const isVideo = type.startsWith('video/') || item.name.endsWith('.mp4') || item.name.endsWith('.mov') || item.name.endsWith('.webm');
        const imgSrc = item.dataUrl || item.thumbnailData;
        const icon = getFileIcon(type, item.name);

        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false)">

                  <div class="flex flex-col items-center gap-1 text-zinc-400">

                    ${type.startsWith('text/') || item.name.endsWith('.txt') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">TXT</span>' : ''}

            ${isMenuOpen ? renderContextMenu(item, false) : ''}
          </div>
        `;
      }

    function renderUploadModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeUploadModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">

            <div class="flex flex-col gap-2.5 mt-2">
              <button onclick="document.getElementById('file-input').click(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="file" class="w-4 h-4 text-amber-400"></i> Files App</button>
              <button onclick="document.getElementById('photo-input').click(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="image" class="w-4 h-4 text-amber-400"></i> Photos, Audio & Videos</button>
              <button onclick="openTextEditorModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="message-square" class="w-4 h-4 text-amber-400"></i> Text Bubble</button>
              <button onclick="openNewFolderModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800/60 hover:bg-zinc-800 text-zinc-300 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2 border border-zinc-700/50"><i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder</button>
            </div>
            <button onclick="closeUploadModal()" class="text-xs text-zinc-500 hover:text-zinc-300 mt-2 font-medium">Cancel</button>
          </div>
        </div>
      `;
    }

    function renderTextEditorModal() {
      const ed = state.textEditorModal;
      if (!ed) return '';
      const fontSizeClass = ed.fontSize === 'lg' ? 'text-base' : ed.fontSize === 'sm' ? 'text-xs' : 'text-sm';
      const fontWeightClass = ed.isBold ? 'font-bold' : 'font-normal';
      const fontStyleClass = ed.isItalic ? 'italic' : '';
      const fontUnderlineClass = ed.isUnderline ? 'underline' : '';

      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeTextEditorModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 w-full max-w-md flex flex-col gap-4 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
              <h3 class="text-sm font-bold text-white">${ed.isNew ? 'New Text Bubble' : 'Edit Text Bubble'}</h3>
              <button onclick="closeTextEditorModal()" class="p-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-full text-zinc-300"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <!-- Formatting Toolbar -->
            <div class="flex items-center gap-2 bg-zinc-950 p-2 rounded-xl border border-zinc-800 flex-wrap">
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
                <button type="button" onclick="setTextEditorFontSize('sm')" class="px-2.5 py-1 rounded-md text-xs font-semibold ${ed.fontSize === 'sm' ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}">Small</button>
                <button type="button" onclick="setTextEditorFontSize('md')" class="px-2.5 py-1 rounded-md text-xs font-semibold ${ed.fontSize === 'md' ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}">Normal</button>
                <button type="button" onclick="setTextEditorFontSize('lg')" class="px-2.5 py-1 rounded-md text-xs font-semibold ${ed.fontSize === 'lg' ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}">Large</button>
              </div>
              <div class="h-5 w-px bg-zinc-800"></div>
              <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
                <button type="button" onclick="toggleTextEditorFormat('isBold')" class="p-1.5 rounded-md ${ed.isBold ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Bold"><i data-lucide="bold" class="w-4 h-4"></i></button>
                <button type="button" onclick="toggleTextEditorFormat('isItalic')" class="p-1.5 rounded-md ${ed.isItalic ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Italic"><i data-lucide="italic" class="w-4 h-4"></i></button>
                <button type="button" onclick="toggleTextEditorFormat('isUnderline')" class="p-1.5 rounded-md ${ed.isUnderline ? 'bg-amber-500 text-black' : 'text-zinc-300 hover:bg-zinc-800'}" title="Underline"><i data-lucide="underline" class="w-4 h-4"></i></button>
              </div>
            </div>

            <!-- Textarea -->
            <textarea id="modal-text-input" oninput="updateTextEditorContent(this.value)" placeholder="Type your text note here..." class="w-full h-36 bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-white resize-none outline-none focus:border-amber-500 ${fontSizeClass} ${fontWeightClass} ${fontStyleClass} ${fontUnderlineClass}">${ed.text || ''}</textarea>

            <div class="flex items-center justify-end gap-3 pt-2">
              <button onclick="closeTextEditorModal()" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button onclick="saveTextEditorModal()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs shadow-lg shadow-amber-500/20">Save Bubble</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuickViewContent(file) {
      const type = file.fileType || '';
      const mediaUrl = file.blobUrl || file.dataUrl;
      const isVideo = type.startsWith('video/') || file.name.endsWith('.mp4') || file.name.endsWith('.mov') || file.name.endsWith('.webm');
      
      if (type.startsWith('image/')) return `<img src="${file.dataUrl}" class="max-w-[90vw] max-h-[75vh] w-auto h-auto object-contain rounded-2xl shadow-2xl" />`;
      if (isVideo) return `<video controls playsinline autoplay class="max-w-[90vw] max-h-[75vh] w-auto h-auto object-contain rounded-2xl shadow-2xl bg-black" src="${mediaUrl}"></video>`;
      if (type.startsWith('audio/')) {
        return `
          <div class="flex flex-col items-center gap-6 p-8 bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full shadow-2xl text-center">
            <div class="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center text-amber-400"><i data-lucide="music" class="w-10 h-10"></i></div>
            <span class="text-sm font-semibold text-zinc-200 max-w-full truncate">${file.name}</span>
            <audio controls playsinline autoplay class="w-full" src="${mediaUrl}"></audio>
          </div>
        `;
      }
      if (type === 'application/pdf' || file.name.endsWith('.pdf')) return `<iframe src="${file.dataUrl}" class="w-[90vw] h-[75vh] rounded-2xl border border-zinc-800 bg-white"></iframe>`;
      if (type.startsWith('text/') || file.name.endsWith('.txt')) return `<div class="w-[90vw] h-[75vh] max-w-2xl bg-zinc-900 border border-zinc-800 rounded-2xl p-4 overflow-auto text-xs font-mono text-zinc-300 whitespace-pre-wrap select-text">${file.textContent || ''}</div>`;
      return `<div class="flex flex-col items-center gap-3 text-zinc-500"><i data-lucide="file-text" class="w-16 h-16"></i><span class="text-xs text-zinc-400">${file.name}</span></div>`;
    }

    function renderQuickViewModal() {
      const file = state.files.find(f => f.id === state.quickViewFileId);
      if (!file) return '';
      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex flex-col justify-between p-4" onclick="closeQuickView()">
          <div class="flex items-center justify-between text-zinc-300 pt-2 px-4 shrink-0" onclick="event.stopPropagation()">
            <span class="text-sm font-semibold truncate max-w-[200px]">${file.name}</span>
            <button onclick="closeQuickView()" class="p-2 bg-zinc-900 border border-zinc-800 rounded-full hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="flex-1 flex items-center justify-center overflow-hidden my-2 px-2" onclick="event.stopPropagation()">${renderQuickViewContent(file)}</div>
          <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-3 flex items-center justify-center gap-8 text-xs font-semibold text-zinc-200 shrink-0" onclick="event.stopPropagation()">
            <button onclick="copySingleFileClipboard('${file.id}')" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="copy" class="w-5 h-5"></i> Copy</button>
            <button onclick="moveToFolder('${file.id}', false); closeQuickView();" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="folder-output" class="w-5 h-5"></i> Move</button>
            <button onclick="shareFile('${file.id}')" class="flex flex-col items-center gap-1 hover:text-amber-400"><i data-lucide="share" class="w-5 h-5"></i> Share</button>
            <button onclick="deleteItemConfirm('${file.id}', false); closeQuickView();" class="flex flex-col items-center gap-1 text-red-400 hover:text-red-300"><i data-lucide="trash-2" class="w-5 h-5"></i> Delete</button>
          </div>
        </div>
      `;
    }

    function toggleSelectMode() { state.selectMode = !state.selectMode; state.selectedIds = []; closeMenu(); render(); }
    function toggleSelectAll() {
      const items = [
        ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
        ...state.files.filter(f => f.parentId === state.currentFolderId),
        ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
      ];
      const allSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));
      state.selectedIds = allSelected ? [] : items.map(item => item.id);
      render();
    }

    function handleItemClick(e, id, isFolderItem, isBubbleItem = false) {
      if (state.selectMode) {
        state.selectedIds = state.selectedIds.includes(id) ? state.selectedIds.filter(i => i !== id) : [...state.selectedIds, id];
        render();
        return;
      }
      if (isFolderItem) navigateTo(id); 
      else if (isBubbleItem) openTextEditorModal(id);
      else openQuickView(id);
    }

    function openUploadModal() { state.showUploadModal = true; render(); }
    function closeUploadModal() { state.showUploadModal = false; render(); }
    function openQuickView(id) { state.quickViewFileId = id; closeMenu(); render(); }
    function closeQuickView() { state.quickViewFileId = null; render(); }
    function navigateTo(id) { state.currentFolderId = id; closeMenu(); render(); }
    function toggleEditMode() { 
      state.editMode = !state.editMode; 
      closeMenu(); 
      render(); 
    }
    function toggleMenu(e, id) {
      e.stopPropagation();
      state.activeMenuId = state.activeMenuId === id ? null : id;
      render();
    }
    function closeMenu() { if (state.activeMenuId) { state.activeMenuId = null; render(); } }
    function forcePullCloudData() { syncWithGitHub(true); }

    // --- TEXT EDITOR MODAL LOGIC ---
    function openTextEditorModal(bubbleId = null, referenceItemId = null) {
      closeMenu();
      if (bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === bubbleId);
        if (bubble) {
          state.textEditorModal = {
            id: bubble.id,
            text: bubble.text || '',
            fontSize: bubble.fontSize || 'md',
            isBold: !!bubble.isBold,
            isItalic: !!bubble.isItalic,
            isUnderline: !!bubble.isUnderline,
            isNew: false
          };
        }
      } else {
        state.textEditorModal = {
          id: null,
          text: '',
          fontSize: 'md',
          isBold: false,
          isItalic: false,
          isUnderline: false,
          isNew: true,
          referenceItemId: referenceItemId
        };
      }
      render();
      setTimeout(() => {
        const ta = document.getElementById('modal-text-input');
        if (ta) {
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
      }, 50);
    }

    function closeTextEditorModal() {
      state.textEditorModal = null;
      render();
    }

    function updateTextEditorContent(val) {
      if (state.textEditorModal) {
        state.textEditorModal.text = val;
      }
    }

    function setTextEditorFontSize(size) {
      if (state.textEditorModal) {
        state.textEditorModal.fontSize = size;
        render();
        setTimeout(() => {
          const ta = document.getElementById('modal-text-input');
          if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }, 30);
      }
    }

    function toggleTextEditorFormat(formatKey) {
      if (state.textEditorModal) {
        state.textEditorModal[formatKey] = !state.textEditorModal[formatKey];
        render();
        setTimeout(() => {
          const ta = document.getElementById('modal-text-input');
          if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }, 30);
      }
    }

    async function saveTextEditorModal() {
      const ed = state.textEditorModal;
      if (!ed) return;
      const textVal = ed.text.trim();
      if (!textVal) {
        alert('Please enter some text for the bubble.');
        return;
      }

      const lines = textVal.split('\n').length + Math.floor(textVal.length / 22);
      const dynamicHeight = Math.max(80, lines * 22);

      if (ed.isNew) {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let posX = 20, posY = 20;
        if (ed.referenceItemId) {
          const refItem = allExisting.find(i => i.id === ed.referenceItemId);
          if (refItem && refItem.x !== undefined && refItem.y !== undefined) {
            posX = refItem.x + (refItem.width || 140) + 24;
            posY = refItem.y;
          }
        } else if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 140;
          
          posX = lastX + lastW + 24;
          posY = lastY;
          if (posX > 1000) {
            posX = 20;
            posY = lastY + 160;
          }
        }

        const bubble = {
          id: uid(),
          isBubble: true,
          text: textVal,
          parentId: state.currentFolderId,
          x: posX,
          y: posY,
          width: 140,
          height: dynamicHeight,
          fontSize: ed.fontSize,
          isBold: ed.isBold,
          isItalic: ed.isItalic,
          isUnderline: ed.isUnderline
        };
        state.textBubbles.push(bubble);
        await saveTextBubble(bubble);
      } else {
        const bubble = state.textBubbles.find(b => b.id === ed.id);
        if (bubble) {
          bubble.text = textVal;
          bubble.height = dynamicHeight;
          bubble.fontSize = ed.fontSize;
          bubble.isBold = ed.isBold;
          bubble.isItalic = ed.isItalic;
          bubble.isUnderline = ed.isUnderline;
          await saveTextBubble(bubble);
        }
      }

      state.textEditorModal = null;
      render();
    }

    async function bulkDelete() {
      if (!confirm(`Are you sure you want to delete ${state.selectedIds.length} items?`)) return;
      for (let id of state.selectedIds) {
        state.folders = state.folders.filter(f => f.id !== id);
        state.files = state.files.filter(f => f.id !== id);
        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('folders', id);
        await deleteFromDB('files', id);
        await deleteFromDB('textBubbles', id);
      }
      state.selectedIds = [];
      render();
    }

    async function bulkMove() {
      const targetFolders = state.folders.filter(f => !state.selectedIds.includes(f.id));
      const targetId = prompt("Enter destination folder ID or 'root':\n" + targetFolders.map(f => `- ${f.name} (${f.id})`).join('\n'), 'root');
      if (targetId) {
        const actualParent = targetId === 'root' ? null : targetId;
        for (let id of state.selectedIds) {
          let f = state.folders.find(item => item.id === id);
          let fi = state.files.find(item => item.id === id);
          let b = state.textBubbles.find(item => item.id === id);
          if (f) { f.parentId = actualParent; await saveFolder(f); }
          if (fi) { fi.parentId = actualParent; await saveFile(fi); }
          if (b) { b.parentId = actualParent; await saveTextBubble(b); }
        }
        state.selectedIds = [];
        render();
      }
    }

    async function bulkCopy() {
      for (let id of state.selectedIds) {
        let file = state.files.find(f => f.id === id);
        if (file) {
          const newFile = { ...file, id: uid(), name: file.name + ' (Copy)' };
          delete newFile.x; delete newFile.y; delete newFile.blobUrl;
          if (newFile.fileType?.startsWith('video/') || newFile.fileType?.startsWith('audio/') || newFile.name.endsWith('.mp4') || newFile.name.endsWith('.mov') || newFile.name.endsWith('.webm')) await getOrCreateBlobUrl(newFile);
          state.files.push(newFile);
          await saveFile(newFile);
        }
      }
      alert(`Successfully copied ${state.selectedIds.length} items to clipboard / internal storage!`);
      state.selectedIds = [];
      render();
    }

    async function bulkShare() {
      for (let id of state.selectedIds) {
        await shareFile(id, true);
      }
    }

    async function copySingleFileClipboard(id) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      
      try {
        if (file.dataUrl && navigator.clipboard && window.ClipboardItem) {
          const res = await fetch(file.dataUrl);
          const blob = await res.blob();
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          alert('File copied to clipboard successfully!');
          closeMenu();
          render();
          return;
        }
        if (file.textContent && navigator.clipboard) {
          await navigator.clipboard.writeText(file.textContent);
          alert('Text content copied to clipboard successfully!');
          closeMenu();
          render();
          return;
        }
      } catch (e) {
        console.warn('Direct clipboard API restricted, falling back to data duplicate', e);
      }

      const newFile = { ...file, id: uid(), name: file.name + ' (Copy)' };
      delete newFile.x; delete newFile.y; delete newFile.blobUrl;
      if (newFile.fileType?.startsWith('video/') || newFile.fileType?.startsWith('audio/') || newFile.name.endsWith('.mp4') || newFile.name.endsWith('.mov') || newFile.name.endsWith('.webm')) {
        await getOrCreateBlobUrl(newFile);
      }
      state.files.push(newFile);
      await saveFile(newFile);
      alert('Copied file successfully inside Aiden Files!');
      closeMenu();
      render();
    }

    async function shareFile(id, isBulk = false) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      if (navigator.canShare && file.dataUrl) {
        try {
          const res = await fetch(file.dataUrl);
          const blob = await res.blob();
          const nativeFile = new File([blob], file.name, { type: file.fileType || blob.type });
          if (navigator.canShare({ files: [nativeFile] })) {
            await navigator.share({ files: [nativeFile], title: file.name });
            if (!isBulk) closeMenu();
            return;
          }
        } catch (e) {}
      }
      if (navigator.share) await navigator.share({ title: file.name, text: file.name, url: file.dataUrl });
      else if (!isBulk) alert('Sharing is not supported on this device.');
      if (!isBulk) closeMenu();
    }

    function triggerFolderCover(id) { state.targetFolderCoverId = id; document.getElementById('folder-cover-input').click(); closeMenu(); }
    document.getElementById('folder-cover-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file && state.targetFolderCoverId) {
        const base64 = await fileToBase64(file);
        const folder = state.folders.find(f => f.id === state.targetFolderCoverId);
        if (folder) { folder.coverUrl = base64; await saveFolder(folder); render(); }
      }
    });

    function triggerChangeImage(id) { state.targetChangeImageId = id; document.getElementById('change-image-input').click(); closeMenu(); }
    document.getElementById('change-image-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file && state.targetChangeImageId) {
        const base64 = await fileToBase64(file);
        const item = state.files.find(f => f.id === state.targetChangeImageId);
        if (item) {
          item.dataUrl = base64;
          if (item.fileType?.startsWith('video/') || item.fileType?.startsWith('audio/') || item.name.endsWith('.mp4') || item.name.endsWith('.mov') || item.name.endsWith('.webm')) { item.blobUrl = ''; await getOrCreateBlobUrl(item); }
          await saveFile(item);
          render();
        }
      }
    });

    async function renameItem(id, isFolderItem) {
      const item = isFolderItem ? state.folders.find(f => f.id === id) : state.files.find(f => f.id === id);
      if (item) {
        const newName = prompt('Rename item:', item.name);
        if (newName && newName.trim() !== '') {
          item.name = newName.trim();
          if (isFolderItem) await saveFolder(item); else await saveFile(item);
          closeMenu();
          render();
        }
      }
    }

    async function moveToFolder(id, isFolderItem, isBubbleItem = false) {
      const targetFolders = state.folders.filter(f => f.id !== id);
      const targetId = prompt("Enter destination folder ID or 'root':\n" + targetFolders.map(f => `- ${f.name} (${f.id})`).join('\n'), 'root');
      if (targetId) {
        const actualParent = targetId === 'root' ? null : targetId;
        const item = isFolderItem ? state.folders.find(f => f.id === id) : isBubbleItem ? state.textBubbles.find(b => b.id === id) : state.files.find(f => f.id === id);
        if (item) {
          item.parentId = actualParent; delete item.x; delete item.y;
          if (isFolderItem) await saveFolder(item); 
          else if (isBubbleItem) await saveTextBubble(item);
          else await saveFile(item);
          closeMenu(); render();
        }
      }
    }

    function resizeByFinger(id, isFolderItem) {
      const el = document.getElementById(`item-${id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const handle = el.querySelector('.resize-handle');
        if (handle) {
          handle.classList.add('ring-4', 'ring-amber-400');
          setTimeout(() => handle.classList.remove('ring-4', 'ring-amber-400'), 1500);
        }
      }
      closeMenu();
    }

    async function snapToOriginalShape(id) {
      const item = state.folders.find(f => f.id === id) || state.files.find(f => f.id === id) || state.textBubbles.find(b => b.id === id);
      if (item) {
        item.width = isFolder(item) ? 96 : isBubble(item) ? 140 : 112;
        item.height = isFolder(item) ? 96 : isBubble(item) ? (Math.max(80, (item.text?.split('\n').length || 1) * 22)) : 144;
        if (isFolder(item)) await saveFolder(item); 
        else if (isBubble(item)) await saveTextBubble(item);
        else await saveFile(item);
        closeMenu(); render();
      }
    }

    async function deleteItemConfirm(id, isFolderItem, isBubbleItem = false) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      if (isFolderItem) {
        state.folders = state.folders.filter(f => f.id !== id);
        await deleteFromDB('folders', id);
      } else if (isBubbleItem) {
        state.textBubbles = state.textBubbles.filter(b => b.id !== id);
        await deleteFromDB('textBubbles', id);
      } else {
        state.files = state.files.filter(f => f.id !== id);
        await deleteFromDB('files', id);
      }
      closeMenu();
      render();
    }

    function openNewFolderModal() {
      const name = prompt('Folder Name:', 'New Folder');
      if (name && name.trim() !== '') {
        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let targetX = 20, targetY = 20;
        if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 96;
          
          targetX = lastX + lastW + 24;
          targetY = lastY;
          if (targetX > 1000) {
            targetX = 20;
            targetY = lastY + 160;
          }
        }

        const folder = { id: uid(), name: name.trim(), parentId: state.currentFolderId, x: targetX, y: targetY, width: 96, height: 96 };
        state.folders.push(folder);
        saveFolder(folder);
        render();
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function fileToText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsText(file);
      });
    }

    function getMimeType(file) {
      if (file.type && file.type !== '') return file.type;
      const ext = file.name.split('.').pop().toLowerCase();
      const mimeMap = {'mp3': 'audio/mpeg', 'm4a': 'audio/mp4', 'mp4': 'video/mp4', 'mov': 'video/quicktime', 'webm': 'video/webm', 'pdf': 'application/pdf', 'txt': 'text/plain'};
      return mimeMap[ext] || 'application/octet-stream';
    }

    async function handleFileImport(files) {
      const fileList = Array.from(files);
      for (let i = 0; i < fileList.length; i++) {
        const file = fileList[i];
        let dataUrl = await fileToBase64(file);
        let textContent = null;
        let inferredType = getMimeType(file);
        let blobUrl = '';

        if (inferredType.startsWith('video/') || inferredType.startsWith('audio/') || file.name.endsWith('.mp4') || file.name.endsWith('.mov') || file.name.endsWith('.webm')) {
          blobUrl = URL.createObjectURL(file);
        } else if (inferredType.startsWith('text/') || file.name.endsWith('.txt')) {
          try { textContent = await fileToText(file); } catch (e) {}
        }

        let allExisting = [
          ...state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root'),
          ...state.files.filter(f => f.parentId === state.currentFolderId),
          ...state.textBubbles.filter(b => b.parentId === state.currentFolderId)
        ];

        let targetX = 20;
        let targetY = 20;
        if (allExisting.length > 0) {
          const lastItem = allExisting[allExisting.length - 1];
          const lastX = lastItem.x !== undefined ? lastItem.x : 20;
          const lastY = lastItem.y !== undefined ? lastItem.y : 20;
          const lastW = lastItem.width || 112;
          
          targetX = lastX + lastW + 24;
          targetY = lastY;
          if (targetX > 1000) {
            targetX = 20;
            targetY = lastY + 160;
          }
        }

        const item = {
          id: uid(),
          name: file.name,
          fileType: inferredType,
          size: file.size,
          dataUrl: dataUrl,
          blobUrl: blobUrl,
          textContent: textContent,
          parentId: state.currentFolderId,
          x: targetX,
          y: targetY,
          width: 112,
          height: 144
        };

        state.files.push(item);
        await saveFile(item);
      }
      render();
    }

    document.getElementById('file-input').addEventListener('change', (e) => handleFileImport(e.target.files));
    document.getElementById('photo-input').addEventListener('change', (e) => handleFileImport(e.target.files));

    function attachDragAndResizeListeners() {
      const elements = document.querySelectorAll('[data-id]');
      elements.forEach(el => {
        let activeDrag = false, activeResize = false;
        let startX, startY, origX, origY, origW, origH;
        const resizeHandle = el.querySelector('.resize-handle');

        const onStart = (e) => {
          if (!state.editMode) return;
          if (e.target.closest('button') || e.target.closest('textarea')) return;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX; startY = touch.clientY;
          
          if (e.target === resizeHandle || resizeHandle?.contains(e.target)) {
            activeResize = true;
            origW = el.offsetWidth;
            origH = el.offsetHeight;
            e.stopPropagation();
          } else {
            activeDrag = true;
            origX = parseInt(el.style.left) || 0;
            origY = parseInt(el.style.top) || 0;
          }
        };

        const onMove = (e) => {
          if (!state.editMode || (!activeDrag && !activeResize)) return;
          const touch = e.touches ? e.touches[0] : e;
          const dx = touch.clientX - startX, dy = touch.clientY - startY;
          
          if (activeDrag) {
            el.style.left = `${Math.round(Math.max(8, origX + dx) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE}px`;
            el.style.top = `${Math.round(Math.max(8, origY + dy) / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE}px`;
          } else if (activeResize) {
            el.style.width = `${Math.max(64, origW + dx)}px`;
            el.style.height = `${Math.max(64, origH + dy)}px`;
          }
        };

        const onEnd = () => {
          if (!activeDrag && !activeResize) return;
          const itemId = el.getAttribute('data-id');
          const target = state.folders.find(f => f.id === itemId) || state.files.find(f => f.id === itemId) || state.textBubbles.find(b => b.id === itemId);
          if (target) {
            if (activeDrag) { target.x = parseInt(el.style.left); target.y = parseInt(el.style.top); }
            if (activeResize) { target.width = parseInt(el.style.width); target.height = parseInt(el.style.height); }
            if (isFolder(target)) saveFolder(target); 
            else if (isBubble(target)) saveTextBubble(target);
            else saveFile(target);
          }
          activeDrag = false; activeResize = false;
        };

        el.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        el.addEventListener('touchstart', onStart, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
      });
    }

    loadData();
    
    setTimeout(() => {
      if (state.files.length === 0 && state.folders.length <= 1 && state.ghToken) {
        syncWithGitHub(true);
      }
    }, 500);
  </script>
</body>
</html>
