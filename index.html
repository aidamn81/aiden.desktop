<!DOCTYPE html>
<html lang="en" class="bg-black text-white select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aiden Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .edit-grid-bg {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .touch-none { touch-action: none; }

    .folder-cube {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .folder-cube:active { transform: scale(0.95); }

    .resize-handle {
      width: 28px;
      height: 28px;
      bottom: -4px;
      right: -4px;
      border-top-left-radius: 12px;
      touch-action: none;
      display: none;
    }

    body.edit-mode .resize-handle {
      display: flex;
    }

    #modal-text-input:empty:before {
      content: attr(data-placeholder);
      color: #71717a;
      pointer-events: none;
    }
    #modal-text-input { outline: none; }
  </style>
</head>
<body class="bg-black min-h-screen text-zinc-100 selection:bg-zinc-800 overflow-hidden">
  <div id="app" class="h-screen w-screen bg-black text-white flex flex-col overflow-hidden"></div>

  <input id="file-input" type="file" multiple class="hidden" onchange="handleFileSelect(event)" />
  <input id="photo-input" type="file" accept="image/*,video/*,audio/*" multiple class="hidden" onchange="handleFileSelect(event)" />
  <input id="change-image-input" type="file" accept="image/*" class="hidden" onchange="handleChangeImageFile(event)" />
  <input id="folder-cover-input" type="file" accept="image/*" class="hidden" onchange="handleFolderCoverFile(event)" />
  <input id="app-thumbnail-input" type="file" accept="image/*" class="hidden" onchange="handleAppThumbnail(event)" />
  <input id="link-thumbnail-input" type="file" accept="image/*" class="hidden" onchange="handleLinkThumbnail(event)" />
  <input id="web-video-thumbnail-input" type="file" accept="image/*" class="hidden" onchange="handleWebVideoThumbnail(event)" />
  <input id="restore-backup-input" type="file" accept=".html,.json" class="hidden" onchange="handleRestoreBackupFile(event)" />

  <script>
    const CONFIG = {
      ghRepo: 'aidamn81/aidenfiles',
      ghPath: 'aiden_meta.json',
      GRID_SIZE: 24
    };

    let state = {
      editMode: false,
      selectMode: false,
      selectedIds: [],
      currentFolderId: null,
      folders: [],
      files: [],
      textBubbles: [],
      ghToken: localStorage.getItem('af_gh_token') || '',
      isSyncing: false,
      activeMenuId: null,
      hamburgerMenuOpen: false,
      targetChangeImageId: null,
      targetFolderCoverId: null,
      quickViewFileId: null,
      showUploadModal: false,
      textEditorModal: null,
      linkModal: false,
      linkModalThumbData: null,
      webVideoModal: false,
      webVideoModalThumbData: null,
      appModal: false,
      appModalThumbData: null,
      activeUploads: [],
      popupVideoUrl: null
    };

    const uid = () => Math.random().toString(36).substring(2, 9);
    const isFolder = item => !('fileType' in item) && !('isBubble' in item);
    const isBubble = item => item.isBubble === true;

    function isVideoFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('video/') || t === 'web-video' || n.endsWith('.mp4') || n.endsWith('.mov') || n.endsWith('.webm') || n.endsWith('.m4v') || n.endsWith('.mkv');
    }
    function isAudioFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('audio/') || n.endsWith('.mp3') || n.endsWith('.m4a') || n.endsWith('.wav') || n.endsWith('.aac');
    }

    async function getOrCreateBlobUrl(file) {
      if (file.blobUrl) return file.blobUrl;
      if (file.rawBlob) {
        file.blobUrl = URL.createObjectURL(file.rawBlob);
        return file.blobUrl;
      }
      if (!file.dataUrl) return '';
      try {
        const res = await fetch(file.dataUrl);
        const blob = await res.blob();
        file.blobUrl = URL.createObjectURL(blob);
        return file.blobUrl;
      } catch (e) {
        return file.dataUrl;
      }
    }

    const DB_NAME = 'aiden_files_db';
    const DB_VERSION = 5;

    function openDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('textBubbles')) db.createObjectStore('textBubbles', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function loadData() {
      const db = await openDB();
      if (db) {
        state.folders = await new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const req = tx.objectStore('folders').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.files = await new Promise(res => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.textBubbles = await new Promise(res => {
          const tx = db.transaction('textBubbles', 'readonly');
          const req = tx.objectStore('textBubbles').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }

      for (let file of state.files) {
        if ((isVideoFile(file) || isAudioFile(file)) && file.fileType !== 'web-video') {
          await getOrCreateBlobUrl(file);
        }
      }

      if (state.folders.length === 0) {
        const root = { id: 'root', name: 'Aiden Files', parentId: null, width: 96, height: 96 };
        state.folders = [root];
        saveFolder(root);
      }
      render();
    }

    async function saveFolder(folder) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
      }
    }

    async function saveFile(file) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('files', 'readwrite');
        const fileToSave = { ...file };
        delete fileToSave.blobUrl;
        tx.objectStore('files').put(fileToSave);
      }
    }

    async function saveTextBubble(bubble) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('textBubbles', 'readwrite');
        tx.objectStore('textBubbles').put(bubble);
      }
    }

    async function deleteFromDB(storeName, id) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
      }
    }

    function resetToken() {
      const token = prompt('Enter your GitHub Personal Access Token:', state.ghToken);
      if (token !== null) {
        state.ghToken = token.trim();
        localStorage.setItem('af_gh_token', state.ghToken);
        alert('New token saved successfully!');
        syncWithGitHub();
      }
    }

    async function syncWithGitHub(forcePull = false) {
      if (!state.ghToken) {
        resetToken();
        if (!state.ghToken) return;
      }

      state.isSyncing = true;
      render();

      try {
        let cleanToken = state.ghToken.replace(/^(token|Bearer)\s+/i, '').trim();
        const authHeader = `token ${cleanToken}`;
        const headers = {
          'Authorization': authHeader,
          'Accept': 'application/vnd.github.v3+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };

        const metaUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/aiden_meta.json`;

        if (forcePull) {
          const getRes = await fetch(metaUrl, { headers });
          if (getRes.ok) {
            const getJson = await getRes.json();
            const manifest = JSON.parse(decodeURIComponent(escape(atob(getJson.content))));

            let allFolders = [];
            let allFiles = [];
            let allBubbles = [];

            for (let chunkFileName of manifest.chunks) {
              const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;
              const chunkRes = await fetch(chunkUrl, { headers });
              if (chunkRes.ok) {
                const chunkJson = await chunkRes.json();
                const chunkData = JSON.parse(decodeURIComponent(escape(atob(chunkJson.content))));
                if (chunkData.folders) allFolders.push(...chunkData.folders);
                if (chunkData.files) allFiles.push(...chunkData.files);
                if (chunkData.textBubbles) allBubbles.push(...chunkData.textBubbles);
              }
            }

            state.folders = allFolders.length > 0 ? allFolders : state.folders;
            state.files = allFiles.length > 0 ? allFiles : state.files;
            state.textBubbles = allBubbles.length > 0 ? allBubbles : state.textBubbles;

            for (let f of state.folders) await saveFolder(f);
            for (let fi of state.files) await saveFile(fi);
            for (let b of state.textBubbles) await saveTextBubble(b);
            alert('Synced chunks down from Cloud successfully!');
            state.isSyncing = false;
            render();
            return;
          }
        }

        const sanitizedFiles = state.files.map(file => {
          const copy = { ...file };
          delete copy.blobUrl;
          delete copy.rawBlob;
          return copy;
        });

        const CHUNK_SIZE = 15;
        const fileChunks = [];
        for (let i = 0; i < sanitizedFiles.length; i += CHUNK_SIZE) {
          fileChunks.push(sanitizedFiles.slice(i, i + CHUNK_SIZE));
        }
        if (fileChunks.length === 0) fileChunks.push([]);

        const chunkFileNames = [];

        for (let index = 0; index < fileChunks.length; index++) {
          const chunkFileName = `chunk_${index}.json`;
          chunkFileNames.push(chunkFileName);
          const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;

          let chunkSha = null;
          const existingChunkRes = await fetch(chunkUrl, { headers });
          if (existingChunkRes.ok) {
            const existingData = await existingChunkRes.json();
            chunkSha = existingData.sha;
          }

          const chunkPayloadData = {
            folders: index === 0 ? state.folders : [],
            files: fileChunks[index],
            textBubbles: index === 0 ? state.textBubbles : []
          };

          const chunkPutPayload = {
            message: `Sync Aiden Files Chunk ${index}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(chunkPayloadData)))),
            ...(chunkSha && { sha: chunkSha })
          };

          let putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          if (putRes.status === 500) {
            await new Promise(r => setTimeout(r, 1500));
            putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          }
          if (!putRes.ok) {
            throw new Error(`Failed to upload chunk ${index} (status ${putRes.status})`);
          }
        }

        let metaSha = null;
        const existingMetaRes = await fetch(metaUrl, { headers });
        if (existingMetaRes.ok) {
          const metaJson = await existingMetaRes.json();
          metaSha = metaJson.sha;
        }

        const metaManifest = { chunks: chunkFileNames, updatedAt: new Date().toISOString() };
        const metaPutPayload = {
          message: 'Update Aiden Files Manifest',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(metaManifest)))),
          ...(metaSha && { sha: metaSha })
        };

        const metaPutRes = await fetch(metaUrl, { method: 'PUT', headers, body: JSON.stringify(metaPutPayload) });
        if (!metaPutRes.ok) {
          throw new Error('Failed to update manifest file on GitHub.');
        }

        alert('Chunked Sync Successful! Cloud backup updated safely without server errors.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    function exportBackupToPCloud() {
      try {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `index.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        alert('index.html exported successfully! Save this file into your PCloud folder ("Desktop app backup"): https://e.pcloud.link/publink/show?code=kZmWky7ZBoAafpewSaROjw27N8bFvVY9d9qV');
      } catch (err) {
        alert('Export error: ' + err.message);
      }
    }

    function triggerRestoreBackup() {
      document.getElementById('restore-backup-input').click();
    }

    async function handleRestoreBackupFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(event) {
        try {
          const content = event.target.result;
          let restored = false;

          try {
            const backupData = JSON.parse(content);
            if (backupData && (backupData.folders || backupData.files)) {
              if (confirm('Restoring this JSON backup will overwrite your current local workspace. Proceed?')) {
                state.folders = backupData.folders || [];
                state.files = backupData.files || [];
                state.textBubbles = backupData.textBubbles || [];
                state.currentFolderId = null;

                for (let f of state.folders) await saveFolder(f);
                for (let fi of state.files) await saveFile(fi);
                for (let b of state.textBubbles) await saveTextBubble(b);

                restored = true;
                alert('Backup data restored successfully!');
                render();
              }
            }
          } catch (jsonErr) {}

          if (!restored && (file.name.endsWith('.html') || content.includes('state =') || content.includes('aiden_files_db'))) {
            alert('index.html backup file selected. To load this saved app version, please open the saved HTML file directly in your web browser.');
          } else if (!restored) {
            throw new Error('Unrecognized backup file format.');
          }
        } catch (err) {
          alert('Failed to restore backup: ' + err.message);
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function toggleHamburgerMenu(e) {
      if (e) e.stopPropagation();
      state.hamburgerMenuOpen = !state.hamburgerMenuOpen;
      state.activeMenuId = null;
      render();
    }
    function closeHamburgerMenu() {
      if (state.hamburgerMenuOpen) {
        state.hamburgerMenuOpen = false;
        render();
      }
    }
    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selectedIds = [];
      render();
    }
    function toggleEditMode() {
      state.editMode = !state.editMode;
      document.body.classList.toggle('edit-mode', state.editMode);
      render();
    }
    function navigateTo(folderId) {
      state.currentFolderId = folderId;
      state.selectedIds = [];
      render();
    }
    function navigateBack() {
      if (state.currentFolderId) {
        const current = state.folders.find(f => f.id === state.currentFolderId);
        state.currentFolderId = current ? current.parentId : null;
        state.selectedIds = [];
        render();
      }
    }
    function closeMenu() {
      if (state.activeMenuId) {
        state.activeMenuId = null;
        render();
      }
    }
    function toggleSelectAll() {
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];
      const allSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));
      if (allSelected) {
        state.selectedIds = [];
      } else {
        state.selectedIds = items.map(i => i.id);
      }
      render();
    }

    function openNewFolderModal() {
      const name = prompt('Enter folder name:', 'New Folder');
      if (name) {
        const newFolder = {
          id: uid(),
          name: name.trim(),
          parentId: state.currentFolderId,
          x: 48,
          y: 48,
          width: 96,
          height: 96
        };
        state.folders.push(newFolder);
        saveFolder(newFolder);
        render();
      }
    }

    function openUploadModal() { state.showUploadModal = true; render(); }
    function closeUploadModal() { state.showUploadModal = false; render(); }
    function openLinkModal() { state.linkModal = true; render(); }
    function closeLinkModal() { state.linkModal = false; render(); }
    function openWebVideoModal() { state.webVideoModal = true; render(); }
    function closeWebVideoModal() { state.webVideoModal = false; render(); }
    function openAppModal() { state.appModal = true; render(); }
    function closeAppModal() { state.appModal = false; render(); }

    function handleFileSelect(e) {
      const uploadedFiles = Array.from(e.target.files);
      if (!uploadedFiles.length) return;
      
      uploadedFiles.forEach(async (file) => {
        const reader = new FileReader();
        reader.onload = async function(event) {
          const dataUrl = event.target.result;
          const newFile = {
            id: uid(),
            name: file.name,
            fileType: file.type,
            size: file.size,
            dataUrl: dataUrl,
            rawBlob: file,
            parentId: state.currentFolderId,
            x: 48,
            y: 48,
            width: 96,
            height: 96
          };
          state.files.push(newFile);
          await saveFile(newFile);
          render();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
      closeUploadModal();
    }

    function handleChangeImageFile(e) {
      const file = e.target.files[0];
      if (!file || !state.targetChangeImageId) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        const f = state.files.find(item => item.id === state.targetChangeImageId);
        if (f) {
          f.dataUrl = ev.target.result;
          f.rawBlob = file;
          await saveFile(f);
        }
        state.targetChangeImageId = null;
        render();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function handleFolderCoverFile(e) {
      const file = e.target.files[0];
      if (!file || !state.targetFolderCoverId) return;
      const reader = new FileReader();
      reader.onload = async function(ev) {
        const folder = state.folders.find(item => item.id === state.targetFolderCoverId);
        if (folder) {
          folder.coverDataUrl = ev.target.result;
          await saveFolder(folder);
        }
        state.targetFolderCoverId = null;
        render();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function handleAppThumbnail(e) {}
    function handleLinkThumbnail(e) {}
    function handleWebVideoThumbnail(e) {}

    function bulkCopy() { alert('Copy selected items'); }
    function bulkMove() { alert('Move selected items'); }
    function bulkShare() { alert('Share selected items'); }
    function bulkDelete() {
      if (confirm('Delete selected items?')) {
        state.files = state.files.filter(f => !state.selectedIds.includes(f.id));
        state.folders = state.folders.filter(f => !state.selectedIds.includes(f.id) && f.id !== 'root');
        state.textBubbles = state.textBubbles.filter(b => !state.selectedIds.includes(b.id));
        state.selectedIds = [];
        render();
      }
    }

    function renderItem(item) {
      const isSelected = state.selectedIds.includes(item.id);
      const isF = isFolder(item);
      const isB = isBubble(item);
      const x = item.x || 48;
      const y = item.y || 48;
      const w = item.width || 96;
      const h = item.height || 96;

      let iconName = 'file';
      if (isF) iconName = 'folder';
      else if (isB) iconName = 'align-left';
      else if (isVideoFile(item)) iconName = 'video';
      else if (isAudioFile(item)) iconName = 'music';

      return `
        <div data-id="${item.id}" class="absolute flex flex-col items-center justify-center cursor-pointer group select-none ${isSelected ? 'ring-2 ring-indigo-500 rounded-2xl' : ''}" style="left: ${x}px; top: ${y}px; width: ${w}px; height: ${h}px;" onclick="handleItemClick(event, '${item.id}')">
          <div class="folder-cube bg-zinc-900 border border-zinc-800 flex flex-col items-center justify-center relative group overflow-hidden">
            ${isF && item.coverDataUrl ? `
              <img src="${item.coverDataUrl}" class="w-full h-full object-cover" />
            ` : !isF && !isB && item.dataUrl && (item.fileType || '').startsWith('image/') ? `
              <img src="${item.dataUrl}" class="w-full h-full object-cover" />
            ` : `
              <div class="flex flex-col items-center justify-center p-2 text-center w-full h-full ${isB ? 'bg-zinc-950 text-amber-200' : ''}">
                <i data-lucide="${iconName}" class="w-8 h-8 ${isF ? 'text-amber-400' : isB ? 'text-amber-300' : 'text-zinc-400'} mb-1"></i>
                <span class="text-[11px] font-medium ${isF ? 'text-zinc-200 font-semibold' : 'text-zinc-300'} truncate w-full px-1">${isB ? (item.text || 'Note') : item.name}</span>
              </div>
            `}
          </div>
          ${state.editMode ? `
            <div class="resize-handle absolute bg-amber-500 text-black flex items-center justify-center rounded-tl-xl shadow-lg cursor-nwse-resize" onpointerdown="startResize(event, '${item.id}')">
              <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            </div>
          ` : ''}
        </div>
      `;
    }

    function handleItemClick(e, id) {
      e.stopPropagation();
      if (state.selectMode) {
        if (state.selectedIds.includes(id)) {
          state.selectedIds = state.selectedIds.filter(i => i !== id);
        } else {
          state.selectedIds.push(id);
        }
        render();
        return;
      }
      const folder = state.folders.find(f => f.id === id);
      if (folder) {
        navigateTo(folder.id);
      } else {
        const file = state.files.find(f => f.id === id);
        if (file) {
          state.quickViewFileId = file.id;
          render();
        }
      }
    }

    function startResize(e, id) {
      e.stopPropagation();
    }

    function renderUploadModal() {
      if (!state.showUploadModal) return '';
      return `
        <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="closeUploadModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between">
              <h3 class="text-lg font-semibold text-zinc-100">Add Content</h3>
              <button onclick="closeUploadModal()" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="document.getElementById('file-input').click()" class="flex flex-col items-center justify-center p-4 bg-zinc-800/60 hover:bg-zinc-800 rounded-xl border border-zinc-700/50 transition">
                <i data-lucide="file-up" class="w-6 h-6 text-indigo-400 mb-2"></i>
                <span class="text-xs font-medium text-zinc-200">Upload Files</span>
              </button>
              <button onclick="openNewFolderModal(); closeUploadModal();" class="flex flex-col items-center justify-center p-4 bg-zinc-800/60 hover:bg-zinc-800 rounded-xl border border-zinc-700/50 transition">
                <i data-lucide="folder-plus" class="w-6 h-6 text-amber-400 mb-2"></i>
                <span class="text-xs font-medium text-zinc-200">New Folder</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderLinkModal() { return ''; }
    function renderWebVideoModal() { return ''; }
    function renderAppModal() { return ''; }
    function renderQuickViewModal() { return ''; }
    function renderTextEditorModal() { return ''; }
    function renderPopupVideoModal() { return ''; }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      const currentFolder = state.folders.find(f => f.id === state.currentFolderId) || { name: 'Aiden Files' };
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const allItems = [...childrenFolders, ...childrenFiles, ...childrenBubbles];

      app.innerHTML = `
        <!-- Top Navigation Bar -->
        <header class="h-14 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur px-4 flex items-center justify-between z-30 shrink-0">
          <div class="flex items-center space-x-3">
            ${state.currentFolderId ? `
              <button onclick="navigateBack()" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-900 transition flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
              </button>
            ` : `
              <button onclick="toggleHamburgerMenu(event)" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-900 transition">
                <i data-lucide="menu" class="w-5 h-5"></i>
              </button>
            `}
            <h1 class="text-sm font-semibold tracking-wide text-zinc-100 truncate max-w-[200px] sm:max-w-xs">${currentFolder.name}</h1>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="toggleSelectMode()" class="px-3 py-1.5 text-xs font-medium rounded-lg ${state.selectMode ? 'bg-indigo-600 text-white' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'} transition">
              ${state.selectMode ? 'Done' : 'Select'}
            </button>
            <button onclick="toggleEditMode()" class="px-3 py-1.5 text-xs font-medium rounded-lg ${state.editMode ? 'bg-amber-600 text-white' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'} transition">
              ${state.editMode ? 'Lock' : 'Edit'}
            </button>
            <button onclick="openUploadModal()" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        </header>

        <!-- Hamburger Menu Overlay -->
        ${state.hamburgerMenuOpen ? `
          <div class="fixed inset-0 z-50 flex" onclick="closeHamburgerMenu()">
            <div class="w-72 bg-zinc-950 border-r border-zinc-800 h-full flex flex-col p-4 shadow-2xl" onclick="event.stopPropagation()">
              <div class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800">
                <span class="font-bold text-zinc-100 flex items-center gap-2"><i data-lucide="folder-kanban" class="w-5 h-5 text-indigo-400"></i> Aiden Files</span>
                <button onclick="toggleHamburgerMenu()" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
              </div>
              <div class="space-y-1 flex-1 overflow-y-auto">
                <button onclick="syncWithGitHub(); toggleHamburgerMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-300 hover:bg-zinc-900 flex items-center gap-3"><i data-lucide="cloud" class="w-4 h-4 text-indigo-400"></i> Sync with GitHub</button>
                <button onclick="exportBackupToPCloud(); toggleHamburgerMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-300 hover:bg-zinc-900 flex items-center gap-3"><i data-lucide="download" class="w-4 h-4 text-emerald-400"></i> Export Backup (.html)</button>
                <button onclick="triggerRestoreBackup(); toggleHamburgerMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-300 hover:bg-zinc-900 flex items-center gap-3"><i data-lucide="upload" class="w-4 h-4 text-amber-400"></i> Restore Backup</button>
                <button onclick="resetToken(); toggleHamburgerMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-zinc-300 hover:bg-zinc-900 flex items-center gap-3"><i data-lucide="key" class="w-4 h-4 text-zinc-400"></i> Set GitHub Token</button>
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Main Workspace Area -->
        <main class="flex-1 relative overflow-auto ${state.editMode ? 'edit-grid-bg' : ''}" onclick="closeMenu(); closeHamburgerMenu()">
          <div class="w-full h-full relative min-h-[800px]">
            ${allItems.map((item, index) => renderItem(item, index)).join('')}
          </div>
        </main>

        <!-- Selection Bottom Bar -->
        ${state.selectMode ? `
          <footer class="h-16 border-t border-zinc-800 bg-zinc-950 px-4 flex items-center justify-between z-30 shrink-0">
            <span class="text-xs text-zinc-400">${state.selectedIds.length} selected</span>
            <div class="flex items-center space-x-2">
              <button onclick="toggleSelectAll()" class="px-3 py-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg">Select All</button>
              <button onclick="bulkDelete()" class="px-3 py-1.5 text-xs bg-rose-600/80 hover:bg-rose-600 text-white rounded-lg">Delete</button>
            </div>
          </footer>
        ` : ''}

        ${renderUploadModal()}
        ${renderLinkModal()}
        ${renderWebVideoModal()}
        ${renderAppModal()}
        ${renderQuickViewModal()}
        ${renderTextEditorModal()}
        ${renderPopupVideoModal()}
      `;

      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    loadData();
  </script>
</body>
</html>
