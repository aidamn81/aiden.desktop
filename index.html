<!DOCTYPE html>
<html lang="en" class="bg-black text-white select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aiden Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .edit-grid-bg {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .touch-none { touch-action: none; }

    .folder-cube {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .folder-cube:active { transform: scale(0.95); }

    .resize-handle {
      width: 28px;
      height: 28px;
      bottom: -4px;
      right: -4px;
      border-top-left-radius: 12px;
      touch-action: none;
      display: none;
    }

    body.edit-mode .resize-handle {
      display: flex;
    }

    .select-checkbox {
      display: none;
    }

    body.edit-mode .select-checkbox {
      display: flex;
    }

    #modal-text-input:empty:before {
      content: attr(data-placeholder);
      color: #71717a;
      pointer-events: none;
    }
    #modal-text-input { outline: none; }
  </style>
</head>
<body class="bg-black min-h-screen text-zinc-100 selection:bg-zinc-800 overflow-hidden">
  <div id="app" class="h-screen w-screen bg-black text-white flex flex-col overflow-hidden"></div>

  <input id="file-input" type="file" multiple class="hidden" />
  <input id="photo-input" type="file" accept="image/*,video/*,audio/*" multiple class="hidden" />
  <input id="change-image-input" type="file" accept="image/*" class="hidden" />
  <input id="folder-cover-input" type="file" accept="image/*" class="hidden" />
  <input id="app-thumbnail-input" type="file" accept="image/*" class="hidden" />
  <input id="link-thumbnail-input" type="file" accept="image/*" class="hidden" />
  <input id="web-video-thumbnail-input" type="file" accept="image/*" class="hidden" />

  <script>
    const CONFIG = {
      ghRepo: 'aidamn81/aidenfiles',
      ghPath: 'aiden_meta.json',
      GRID_SIZE: 24
    };

    let state = {
      editMode: false,
      selectMode: false,
      selectedIds: [],
      currentFolderId: null,
      folders: [],
      files: [],
      textBubbles: [],
      ghToken: localStorage.getItem('af_gh_token') || '',
      isSyncing: false,
      activeMenuId: null,
      hamburgerMenuOpen: false,
      targetChangeImageId: null,
      targetFolderCoverId: null,
      quickViewFileId: null,
      showUploadModal: false,
      textEditorModal: null,
      linkModal: false,
      linkModalThumbData: null,
      webVideoModal: false,
      webVideoModalThumbData: null,
      appModal: false,
      appModalThumbData: null,
      activeUploads: [],
      popupVideoUrl: null
    };

    const uid = () => Math.random().toString(36).substring(2, 9);
    const isFolder = item => !('fileType' in item) && !('isBubble' in item);
    const isBubble = item => item.isBubble === true;

    function isVideoFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('video/') || t === 'web-video' || n.endsWith('.mp4') || n.endsWith('.mov') || n.endsWith('.webm') || n.endsWith('.m4v') || n.endsWith('.mkv');
    }
    function isAudioFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('audio/') || n.endsWith('.mp3') || n.endsWith('.m4a') || n.endsWith('.wav') || n.endsWith('.aac');
    }

    async function getOrCreateBlobUrl(file) {
      if (file.blobUrl) return file.blobUrl;
      if (file.rawBlob) {
        file.blobUrl = URL.createObjectURL(file.rawBlob);
        return file.blobUrl;
      }
      if (!file.dataUrl) return '';
      try {
        const res = await fetch(file.dataUrl);
        const blob = await res.blob();
        file.blobUrl = URL.createObjectURL(blob);
        return file.blobUrl;
      } catch (e) {
        return file.dataUrl;
      }
    }

    const DB_NAME = 'aiden_files_db';
    const DB_VERSION = 5;

    function openDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('textBubbles')) db.createObjectStore('textBubbles', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function loadData() {
      const db = await openDB();
      if (db) {
        state.folders = await new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const req = tx.objectStore('folders').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.files = await new Promise(res => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.textBubbles = await new Promise(res => {
          const tx = db.transaction('textBubbles', 'readonly');
          const req = tx.objectStore('textBubbles').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }

      for (let file of state.files) {
        if ((isVideoFile(file) || isAudioFile(file)) && file.fileType !== 'web-video') {
          await getOrCreateBlobUrl(file);
        }
      }

      if (state.folders.length === 0) {
        const root = { id: 'root', name: 'Aiden Files', parentId: null, width: 96, height: 96 };
        state.folders = [root];
        saveFolder(root);
      }
      render();
    }

    async function saveFolder(folder) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
      }
    }

    async function saveFile(file) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('files', 'readwrite');
        const fileToSave = { ...file };
        delete fileToSave.blobUrl;
        tx.objectStore('files').put(fileToSave);
      }
    }

    async function saveTextBubble(bubble) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('textBubbles', 'readwrite');
        tx.objectStore('textBubbles').put(bubble);
      }
    }

    async function deleteFromDB(storeName, id) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
      }
    }

    function resetToken() {
      const token = prompt('Enter your GitHub Personal Access Token:', state.ghToken);
      if (token !== null) {
        state.ghToken = token.trim();
        localStorage.setItem('af_gh_token', state.ghToken);
        alert('New token saved successfully!');
        syncWithGitHub();
      }
    }

    async function syncWithGitHub(forcePull = false) {
      if (!state.ghToken) {
        resetToken();
        if (!state.ghToken) return;
      }

      state.isSyncing = true;
      render();

      try {
        let cleanToken = state.ghToken.replace(/^(token|Bearer)\s+/i, '').trim();
        const authHeader = `token ${cleanToken}`;
        const headers = {
          'Authorization': authHeader,
          'Accept': 'application/vnd.github.v3+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };

        const metaUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/aiden_meta.json`;

        if (forcePull) {
          const getRes = await fetch(metaUrl, { headers });
          if (getRes.ok) {
            const getJson = await getRes.json();
            const manifest = JSON.parse(decodeURIComponent(escape(atob(getJson.content))));

            let allFolders = [];
            let allFiles = [];
            let allBubbles = [];

            for (let chunkFileName of manifest.chunks) {
              const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;
              const chunkRes = await fetch(chunkUrl, { headers });
              if (chunkRes.ok) {
                const chunkJson = await chunkRes.json();
                const chunkData = JSON.parse(decodeURIComponent(escape(atob(chunkJson.content))));
                if (chunkData.folders) allFolders.push(...chunkData.folders);
                if (chunkData.files) allFiles.push(...chunkData.files);
                if (chunkData.textBubbles) allBubbles.push(...chunkData.textBubbles);
              }
            }

            state.folders = allFolders.length > 0 ? allFolders : state.folders;
            state.files = allFiles.length > 0 ? allFiles : state.files;
            state.textBubbles = allBubbles.length > 0 ? allBubbles : state.textBubbles;

            for (let f of state.folders) await saveFolder(f);
            for (let fi of state.files) await saveFile(fi);
            for (let b of state.textBubbles) await saveTextBubble(b);
            alert('Synced chunks down from Cloud successfully!');
            state.isSyncing = false;
            render();
            return;
          }
        }

        const sanitizedFiles = state.files.map(file => {
          const copy = { ...file };
          delete copy.blobUrl;
          delete copy.rawBlob;
          return copy;
        });

        const CHUNK_SIZE = 15;
        const fileChunks = [];
        for (let i = 0; i < sanitizedFiles.length; i += CHUNK_SIZE) {
          fileChunks.push(sanitizedFiles.slice(i, i + CHUNK_SIZE));
        }
        if (fileChunks.length === 0) fileChunks.push([]);

        const chunkFileNames = [];

        for (let index = 0; index < fileChunks.length; index++) {
          const chunkFileName = `chunk_${index}.json`;
          chunkFileNames.push(chunkFileName);
          const chunkUrl = `https://api.github.com/repos/${CONFIG.ghRepo}/contents/chunks/${chunkFileName}`;

          let chunkSha = null;
          const existingChunkRes = await fetch(chunkUrl, { headers });
          if (existingChunkRes.ok) {
            const existingData = await existingChunkRes.json();
            chunkSha = existingData.sha;
          }

          const chunkPayloadData = {
            folders: index === 0 ? state.folders : [],
            files: fileChunks[index],
            textBubbles: index === 0 ? state.textBubbles : []
          };

          const chunkPutPayload = {
            message: `Sync Aiden Files Chunk ${index}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(chunkPayloadData)))),
            ...(chunkSha && { sha: chunkSha })
          };

          let putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          if (putRes.status === 500) {
            await new Promise(r => setTimeout(r, 1500));
            putRes = await fetch(chunkUrl, { method: 'PUT', headers, body: JSON.stringify(chunkPutPayload) });
          }
          if (!putRes.ok) {
            throw new Error(`Failed to upload chunk ${index} (status ${putRes.status})`);
          }
        }

        let metaSha = null;
        const existingMetaRes = await fetch(metaUrl, { headers });
        if (existingMetaRes.ok) {
          const metaJson = await existingMetaRes.json();
          metaSha = metaJson.sha;
        }

        const metaManifest = { chunks: chunkFileNames, updatedAt: new Date().toISOString() };
        const metaPutPayload = {
          message: 'Update Aiden Files Manifest',
          content: btoa(unescape(encodeURIComponent(JSON.stringify(metaManifest)))),
          ...(metaSha && { sha: metaSha })
        };

        const metaPutRes = await fetch(metaUrl, { method: 'PUT', headers, body: JSON.stringify(metaPutPayload) });
        if (!metaPutRes.ok) {
          throw new Error('Failed to update manifest file on GitHub.');
        }

        alert('Chunked Sync Successful! Cloud backup updated safely without server errors.');
      } catch (err) {
        alert('Sync error: ' + err.message);
      } finally {
        state.isSyncing = false;
        render();
      }
    }

    function createChecklistBubble() {
      const id = uid();
      const defaultText = `[ ] First checklist task\n[ ] Second checklist task\n[x] Completed item example`;
      const bubble = {
        id,
        parentId: state.currentFolderId,
        isBubble: true,
        text: defaultText,
        isChecklist: true,
        fontFamily: 'system-ui, -apple-system, sans-serif',
        fontSize: 'md',
        fontColor: '#ffffff',
        bgColour: '#18181b',
        align: 'left',
        width: 160,
        height: 120,
        x: 40,
        y: 40
      };
      state.textBubbles.push(bubble);
      saveTextBubble(bubble);
      render();
    }

    function toggleChecklistItem(bubbleId, lineIndex) {
      const bubble = state.textBubbles.find(b => b.id === bubbleId);
      if (!bubble) return;
      const lines = bubble.text.split('\n');
      if (lines[lineIndex] !== undefined) {
        if (lines[lineIndex].startsWith('[ ] ')) {
          lines[lineIndex] = lines[lineIndex].replace('[ ] ', '[x] ');
        } else if (lines[lineIndex].startsWith('[x] ')) {
          lines[lineIndex] = lines[lineIndex].replace('[x] ', '[ ] ');
        }
        bubble.text = lines.join('\n');
        saveTextBubble(bubble);
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      const currentFolder = state.folders.find(f => f.id === state.currentFolderId);
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];
      const allChildrenSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));

      if (state.editMode) {
        document.body.classList.add('edit-mode');
      } else {
        document.body.classList.remove('edit-mode');
      }

      app.innerHTML = `
        <header class="shrink-0 z-50 bg-black/95 backdrop-blur-lg border-b border-zinc-900 px-3 py-2 flex items-center justify-between gap-2 relative">
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
                <i data-lucide="menu" class="w-5 h-5"></i>
              </button>
              ${state.currentFolderId !== null ? `
                <button onclick="navigateBack()" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1 text-xs font-bold shadow-md cursor-pointer shrink-0" title="Back">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  <span>Back</span>
                </button>
              ` : ''}
              <button onclick="toggleSelectMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.selectMode ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                ${state.selectMode ? 'Cancel' : 'Select'}
              </button>
              <button onclick="toggleEditMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.editMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                ${state.editMode ? 'Edit Mode On' : 'Edit Mode Locked'}
              </button>
              <button onclick="openTextEditorModal()" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1.5 text-xs font-bold shadow-md cursor-pointer shrink-0" title="Add Text Bubble">
                <i data-lucide="message-square" class="w-4 h-4 text-amber-400"></i>
                <span>Text Bubble</span>
              </button>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0">
              <span onclick="navigateTo(null)" class="cursor-pointer hover:text-white">Home</span>
              ${currentFolder ? `<span class="text-zinc-600">/</span><span class="text-white font-semibold truncate">${currentFolder.name}</span>` : ''}
            </div>
          </div>

          ${state.hamburgerMenuOpen ? `
            <div onclick="event.stopPropagation()" class="absolute top-14 left-3 w-64 bg-black border border-zinc-700/90 rounded-2xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-2 flex flex-col gap-1 px-2">
              <button onclick="navigateTo(null); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
              </button>
              <button onclick="openNewFolderModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
              </button>
              <button onclick="openUploadModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i> Add Item
              </button>
              <button onclick="openLinkModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="link" class="w-4 h-4 text-amber-400"></i> Add Link
              </button>
              <button onclick="openWebVideoModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="video" class="w-4 h-4 text-amber-400"></i> Add Web Video
              </button>
              <button onclick="openAppModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i> Add App
              </button>
              <div class="h-px bg-zinc-800 my-1"></div>
              <button onclick="syncWithGitHub(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
                <i data-lucide="${state.isSyncing ? 'refresh-cw' : 'cloud'}" class="w-4 h-4 ${state.isSyncing ? 'animate-spin text-amber-400' : 'text-zinc-400'}"></i>
                <span>${state.isSyncing ? 'Syncing...' : 'Sync'}</span>
              </button>
              <button onclick="resetToken(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-300 font-bold cursor-pointer">
                <i data-lucide="key" class="w-4 h-4 text-zinc-400"></i> Update GitHub token
              </button>
              <button onclick="forcePullCloudData(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-amber-400 font-bold cursor-pointer">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Pull Cloud
              </button>
            </div>
          ` : ''}
        </header>

        <main onclick="closeMenu(); closeHamburgerMenu();" class="flex-1 relative w-full h-full overflow-auto ${state.editMode ? 'edit-grid-bg' : ''}" id="main-scroll-container">
          ${state.hamburgerMenuOpen ? `<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40" onclick="closeHamburgerMenu()"></div>` : ''}
          
          ${state.activeUploads.length > 0 ? `
            <div class="sticky top-3 left-3 right-3 mx-4 z-30 bg-zinc-900/95 border border-zinc-800 backdrop-blur-xl p-3.5 rounded-2xl shadow-2xl flex flex-col gap-2.5">
              <div class="flex items-center justify-between text-xs text-zinc-300 font-semibold">
                <span class="flex items-center gap-2"><i data-lucide="upload-cloud" class="w-4 h-4 text-amber-400 animate-pulse"></i> Uploading Files in Background (${state.activeUploads.length})</span>
                <span class="text-[10px] text-zinc-500">Keep app open until complete</span>
              </div>
              <div class="flex flex-col gap-2">
                ${state.activeUploads.map(up => `
                  <div class="flex flex-col gap-1 bg-zinc-950 p-2.5 rounded-xl border border-zinc-800/80">
                    <div class="flex items-center justify-between text-xs">
                      <span class="truncate font-medium text-white max-w-[70%]" title="${up.name}">${up.name}</span>
                      <span class="text-amber-400 font-bold">${up.progress}%</span>
                    </div>
                    <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                      <div class="h-full bg-amber-500 transition-all duration-150" style="width: ${up.progress}%"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${items.length === 0 && state.activeUploads.length === 0 ? `
            <div class="flex flex-col items-center justify-center h-full text-center p-6 text-zinc-500 text-sm gap-3">
              <span>Folder is empty</span>
              <button onclick="forcePullCloudData()" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-xl text-xs text-amber-400 font-bold flex items-center gap-2">
                <i data-lucide="download-cloud" class="w-4 h-4"></i> Restore / Sync from Cloud Backup
              </button>
            </div>
          ` : `
            <div class="relative min-w-[1200px] min-h-[1200px] p-4 select-none" id="canvas-container">
              ${items.map((item, index) => renderItem(item, index)).join('')}
            </div>
          `}
        </main>

        ${state.selectMode ? `
          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900/95 border border-zinc-700 backdrop-blur-xl px-6 py-3.5 rounded-2xl shadow-2xl z-40 flex items-center gap-4 flex-wrap justify-center">
            <button onclick="toggleSelectAll()" class="px-3 py-2 bg-indigo-950 border border-indigo-700 rounded-xl text-xs font-bold text-indigo-300 flex items-center gap-1.5 shadow-sm shrink-0">
              <i data-lucide="${allChildrenSelected ? 'check-square' : 'square'}" class="w-4 h-4"></i>
              ${allChildrenSelected ? 'Deselect All' : 'Select All'}
            </button>
            ${state.selectedIds.length > 0 ? `
              <div class="h-4 w-px bg-zinc-800"></div>
              <span class="text-xs font-bold text-zinc-300">${state.selectedIds.length} Selected</span>
              <div class="h-4 w-px bg-zinc-800"></div>
              <button onclick="bulkCopy()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="copy" class="w-4 h-4"></i> Copy</button>
              <button onclick="bulkMove()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="folder-output" class="w-4 h-4"></i> Move to folder</button>
              <button onclick="bulkShare()" class="flex items-center gap-1.5 text-xs text-zinc-200 hover:text-amber-400 font-bold"><i data-lucide="share" class="w-4 h-4"></i> Share</button>
              <button onclick="bulkDelete()" class="flex items-center gap-1.5 text-xs text-red-400 hover:text-red-300 font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i> Delete</button>
            ` : ''}
          </div>
        ` : ''}

        ${state.showUploadModal ? renderUploadModal() : ''}
        ${state.linkModal ? renderLinkModal() : ''}
        ${state.webVideoModal ? renderWebVideoModal() : ''}
        ${state.appModal ? renderAppModal() : ''}
        ${state.quickViewFileId ? renderQuickViewModal() : ''}
        ${state.textEditorModal ? renderTextEditorModal() : ''}
        ${state.popupVideoUrl ? renderPopupVideoModal() : ''}
      `;

      if (window.lucide) window.lucide.createIcons();
      attachDragAndResizeListeners();
    }

    function getFileIcon(type, name) {
      if (type === 'link' || name.startsWith('http')) return 'link';
      if (type === 'web-video') return 'video';
      if (type === 'app' || type === 'ios-app') return 'smartphone';
      if (type.startsWith('video/') || name.endsWith('.mp4') || name.endsWith('.mov') || name.endsWith('.webm') || name.endsWith('.m4v') || name.endsWith('.mkv')) return 'video';
      if (type.startsWith('audio/')) return 'music';
      if (type === 'application/pdf' || name.endsWith('.pdf')) return 'file-text';
      if (type.startsWith('text/') || name.endsWith('.txt') || name.endsWith('.html') || name.endsWith('.json') || name.endsWith('.csv')) return 'file-text';
      if (name.endsWith('.docx') || name.endsWith('.doc') || name.endsWith('.xlsx') || name.endsWith('.xls')) return 'file-spreadsheet';
      return 'file';
    }

    function bubbleInlineStyle(item) {
      let style = '';
      if (item.fontFamily) style += `font-family:${item.fontFamily};`;
      if (item.fontSize === 'lg') style += 'font-size:16px;';
      else if (item.fontSize === 'sm') style += 'font-size:10px;';
      else style += 'font-size:11px;';
      if (item.isBold) style += 'font-weight:bold;';
      if (item.isItalic) style += 'font-style:italic;';
      if (item.isUnderline) style += 'text-decoration:underline;';
      if (item.fontColor) style += `color:${item.fontColor};`;
      if (item.bgColour) style += `background-color:${item.bgColour};`;
      if (item.align) style += `text-align:${item.align};`;
      return style;
    }

    function renderBubbleContent(item) {
      let rawText = item.text || 'Empty bubble';
      if (item.isChecklist || rawText.includes('[ ]') || rawText.includes('[x]')) {
        let lines = rawText.split('\n');
        return lines.map((line, idx) => {
          if (line.startsWith('[ ] ')) {
            return `<div class="flex items-center gap-1.5 my-1 cursor-pointer pointer-events-auto" onclick="event.stopPropagation(); toggleChecklistItem('${item.id}', ${idx})">
              <span class="w-3.5 h-3.5 rounded border border-zinc-500 bg-zinc-800 inline-block shrink-0"></span>
              <span>${line.substring(4)}</span>
            </div>`;
          } else if (line.startsWith('[x] ')) {
            return `<div class="flex items-center gap-1.5 my-1 cursor-pointer pointer-events-auto line-through opacity-60" onclick="event.stopPropagation(); toggleChecklistItem('${item.id}', ${idx})">
              <span class="w-3.5 h-3.5 rounded border border-amber-500 bg-amber-500 flex items-center justify-center inline-block shrink-0 text-black text-[9px] font-bold">✓</span>
              <span>${line.substring(4)}</span>
            </div>`;
          }
          return `<div>${line}</div>`;
        }).join('');
      }
      return rawText;
    }

    function renderItem(item, index) {
      const col = index % 4;
      const row = Math.floor(index / 4);
      const posX = item.x !== undefined ? item.x : (20 + col * 140);
      const posY = item.y !== undefined ? item.y : (20 + row * 160);
      const itemWidth = item.width || (isFolder(item) ? 96 : isBubble(item) ? 140 : 112);
      const itemHeight = item.height || (isFolder(item) ? 96 : isBubble(item) ? 80 : 144);
      const folder = isFolder(item);
      const bubble = isBubble(item);
      const isMenuOpen = state.activeMenuId === item.id;
      const isSelected = state.selectedIds.includes(item.id);

      if (bubble) {
        let bubbleCustomBg = item.bgColour ? `background-color:${item.bgColour};` : '';
        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; min-height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false, true)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : (state.editMode ? 'border-yellow-500/60' : 'border-zinc-700')} rounded-2xl p-3 shadow-lg relative flex flex-col justify-between overflow-hidden" style="${bubbleCustomBg}">
              <div class="w-full h-full whitespace-pre-wrap break-words leading-tight select-none" style="${bubbleInlineStyle(item)}">${renderBubbleContent(item)}</div>
              <div class="select-checkbox absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>
              <button type="button" onclick="toggleMenu(event, '${item.id}')" class="absolute top-1.5 right-1.5 p-1.5 bg-black/70 hover:bg-black rounded-full text-zinc-200 z-30 cursor-pointer shadow-md"><i data-lucide="more-vertical" class="w-3.5 h-3.5 pointer-events-none"></i></button>
            </div>
            <div class="resize-handle absolute bottom-0 right-0 bg-yellow-500 rounded-tl-xl cursor-se-resize items-center justify-center z-20 shadow-md"><i data-lucide="arrow-down-right" class="w-3 h-3 text-black stroke-[3]"></i></div>
            ${isMenuOpen ? renderContextMenu(item, false, true) : ''}
          </div>
        `;
      } else if (folder) {
        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', true)">
            <div class="folder-cube w-full h-full shrink-0 bg-gradient-to-b from-zinc-800 to-zinc-950 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : 'border-zinc-700/60'} flex flex-col items-center justify-center relative overflow-hidden group">
              ${item.coverUrl ? `<img src="${item.coverUrl}" class="w-full h-full object-cover rounded-[20px] pointer-events-none" />` : `<i data-lucide="folder" class="w-10 h-10 text-amber-400 fill-amber-400/20 stroke-[1.5] pointer-events-none"></i>`}
              <div class="select-checkbox absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>
              <button type="button" onclick="toggleMenu(event, '${item.id}')" class="absolute top-1.5 right-1.5 p-2 bg-black/70 hover:bg-black rounded-full text-zinc-200 z-30 cursor-pointer shadow-md"><i data-lucide="more-vertical" class="w-4 h-4 pointer-events-none"></i></button>
              <span class="absolute bottom-2 left-2 right-2 text-[11px] font-bold text-white bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg truncate text-center pointer-events-none shadow-md" title="${item.name}">${item.name}</span>
            </div>
            <div class="resize-handle absolute bottom-0 right-0 bg-yellow-500 rounded-tl-xl cursor-se-resize items-center justify-center z-20 shadow-md"><i data-lucide="arrow-down-right" class="w-3 h-3 text-black stroke-[3]"></i></div>
            ${isMenuOpen ? renderContextMenu(item, true) : ''}
          </div>
        `;
      } else {
        const type = item.fileType || '';
        const isImage = type.startsWith('image/');
        const isVideo = isVideoFile(item);
        const isWebVideo = type === 'web-video';
        const isLink = type === 'link';
        const isApp = type === 'app' || type === 'ios-app';
        const imgSrc = item.thumbnailData || item.dataUrl;
        const icon = getFileIcon(type, item.name);

        return `
          <div id="item-${item.id}" data-id="${item.id}" style="left: ${posX}px; top: ${posY}px; width: ${itemWidth}px; height: ${itemHeight}px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/50' : (state.editMode ? 'border-yellow-500/60' : 'border-zinc-800')} rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg relative">
              <div class="w-full h-full bg-zinc-950 relative overflow-hidden flex items-center justify-center rounded-2xl">
                ${(isImage || ((isApp || isLink || isWebVideo) && item.thumbnailData)) && imgSrc ? `<img src="${imgSrc}" class="w-full h-full object-cover rounded-xl pointer-events-none" alt="${item.name}" />` : `
                  <div class="flex flex-col items-center gap-1 text-zinc-400">
                    <i data-lucide="${icon}" class="w-8 h-8 text-amber-400 pointer-events-none"></i>
                    ${isLink ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">Link</span>' : ''}
                    ${isWebVideo ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">Web Video</span>' : ''}
                    ${isApp ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">iOS App</span>' : ''}
                    ${isVideo && !isWebVideo ? '<span class="text-[9px] uppercase font-bold tracking-wider text-zinc-500">Video</span>' : ''}
                    ${type.startsWith('audio/') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-zinc-500">Audio</span>' : ''}
                    ${type === 'application/pdf' || item.name.endsWith('.pdf') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-red-400">PDF</span>' : ''}
                    ${type.startsWith('text/') || item.name.endsWith('.txt') || item.name.endsWith('.html') || item.name.endsWith('.json') ? '<span class="text-[9px] uppercase font-bold tracking-wider text-amber-400">DOC</span>' : ''}
                  </div>
                `}
                <div class="select-checkbox absolute top-2 left-2 w-5 h-5 rounded-md border border-zinc-400 items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'bg-black/60'} pointer-events-none">${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}</div>
                <button type="button" onclick="toggleMenu(event, '${item.id}')" class="absolute top-1.5 right-1.5 p-2 bg-black/70 hover:bg-black rounded-full text-zinc-200 backdrop-blur-sm z-30 cursor-pointer shadow-md"><i data-lucide="more-vertical" class="w-4 h-4 pointer-events-none"></i></button>
                <span class="absolute bottom-2 left-2 right-2 text-[11px] font-bold text-white bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg truncate text-center pointer-events-none shadow-md" title="${item.name}">${item.name}</span>
              </div>
            </div>
            <div class="resize-handle absolute bottom-0 right-0 bg-yellow-500 rounded-tl-xl cursor-se-resize items-center justify-center z-20 shadow-md"><i data-lucide="arrow-down-right" class="w-3 h-3 text-black stroke-[3]"></i></div>
            ${isMenuOpen ? renderContextMenu(item, false) : ''}
          </div>
        `;
      }
    }

      if (isBubbleItem) {
        return `
          <div onclick="event.stopPropagation()" class="absolute left-full top-0 ml-2 w-48 bg-black border border-zinc-700/90 rounded-xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-1">

            <button type="button" onclick="moveToFolder('${item.id}', false, true)" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="folder-output" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Move to folder</button>

            <button type="button" onclick="renameItem('${item.id}', false, true)" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="edit-3" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Rename</button>
            <button type="button" onclick="deleteItemConfirm('${item.id}', false, true)" class="w-full px-3 py-2 text-left hover:bg-red-500/10 flex items-center gap-2 text-red-400 font-medium cursor-pointer"><i data-lucide="trash-2" class="w-3.5 h-3.5 text-red-400 pointer-events-none"></i> Delete with confirmation</button>

      return `
        <div onclick="event.stopPropagation()" class="absolute left-full top-0 ml-2 w-48 bg-black border border-zinc-700/90 rounded-xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-1">
          ${isFolderItem ? `
            <button type="button" onclick="triggerFolderCover('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="image" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Change cover image</button>
            <button type="button" onclick="renameItem('${item.id}', true)" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="edit-3" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Rename</button>
            <button type="button" onclick="moveToFolder('${item.id}', true)" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="folder-output" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Move to folder</button>
            <button type="button" onclick="resizeByFinger('${item.id}', true)" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="maximize-2" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Resize by finger</button>
            <button type="button" onclick="snapToOriginalShape('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Snap to original shape</button>

            <button type="button" onclick="openQuickView('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="eye" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Quick Look</button>
            <button type="button" onclick="openTextEditorModal(null, '${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-amber-400 font-medium cursor-pointer"><i data-lucide="message-square" class="w-3.5 h-3.5 text-amber-400 pointer-events-none"></i> Add Text Bubble</button>
            <button type="button" onclick="copySingleFileClipboard('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="copy" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Copy to Clipboard</button>
            <button type="button" onclick="shareFile('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="share" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> iOS Share</button>
            <button type="button" onclick="triggerChangeImage('${item.id}')" class="w-full px-3 py-2 text-left hover:bg-zinc-800 flex items-center gap-2 text-zinc-200 cursor-pointer"><i data-lucide="image" class="w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i> Change Image</button>

    function renderLinkModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLinkModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white">Add Web Link</h3>
            <p class="text-xs text-zinc-400">Enter the URL and an optional display thumbnail.</p>
            <div class="flex flex-col gap-3 mt-2">
              <input id="link-url-input" type="text" placeholder="https://example.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white text-xs outline-none focus:border-amber-500" />

    function renderPopupVideoModal() {
      let embedHtml = '';
      let url = state.popupVideoUrl || '';
      
      let ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      let dmMatch = url.match(/(?:dailymotion\.com\/(?:video\/|embed\/video\/)|dai\.ly\/)([\w-]+)/);
      
      if (ytMatch && ytMatch[1]) {
        embedHtml = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      } else if (dmMatch && dmMatch[1]) {
        embedHtml = `<iframe class="w-full h-full" src="https://www.dailymotion.com/embed/video/${dmMatch[1]}?autoplay=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
      } else if (url.includes('<iframe') || url.includes('<object')) {
        embedHtml = url;
      } else {
        embedHtml = `<video id="popup-video-element" controls autoplay playsinline webkit-playsinline class="w-full h-full object-contain" src="${url}"></video>`;
      }

      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4" onclick="closePopupVideo()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden w-full max-w-3xl flex flex-col shadow-2xl relative" onclick="event.stopPropagation()">

            <div class="relative w-full bg-black flex items-center justify-center aspect-video">

              <span class="text-zinc-400">Stream or Embed Player</span>

    async function toggleVideoPip() {
      const vid = document.getElementById('popup-video-element');
      if (!vid) return;
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (vid.requestPictureInPicture) {
          await vid.requestPictureInPicture();
        } else {
          alert('Picture-in-Picture is not supported in this browser.');

      } catch (e) {
        alert('PiP mode could not be activated: ' + e.message);
      }

    function openTextEditorModal(bubbleId = null, attachedFileId = null) {
      let ed;
      if (bubbleId) {
        const bubble = state.textBubbles.find(b => b.id === bubbleId);
        if (!bubble) return;
        ed = {
          id: bubble.id,
          isNew: false,
          attachedFileId: bubble.attachedFileId || null,
          text: bubble.text || '',
          fontFamily: bubble.fontFamily || 'system-ui, -apple-system, sans-serif',
          fontSize: bubble.fontSize || 'md',
          fontColor: bubble.fontColor || '#ffffff',
          bgColour: bubble.bgColour || '#18181b',
          align: bubble.align || 'left',
          isBold: !!bubble.isBold,
          isItalic: !!bubble.isItalic,
          isUnderline: !!bubble.isUnderline,
          history: [bubble.text || ''],
          historyIndex: 0
        };
      } else {
        ed = {
          id: uid(),
          isNew: true,
          attachedFileId: attachedFileId,
          text: '',
          fontFamily: 'system-ui, -apple-system, sans-serif',
          fontSize: 'md',
          fontColor: '#ffffff',
          bgColour: '#18181b',
          align: 'left',
          isBold: false,
          isItalic: false,
          isUnderline: false,
          history: [''],
          historyIndex: 0
        };
      }
      state.textEditorModal = ed;
      render();
      setTimeout(() => {
        const el = document.getElementById('modal-text-input');
        if (el) {
          el.innerText = ed.text;
          el.style.fontFamily = ed.fontFamily;
          if (ed.fontSize === 'lg') el.style.fontSize = '16px';
          else if (ed.fontSize === 'sm') el.style.fontSize = '10px';
          else el.style.fontSize = '12px';
          el.style.fontWeight = ed.isBold ? 'bold' : 'normal';
          el.style.fontStyle = ed.isItalic ? 'italic' : 'normal';
          el.style.textDecoration = ed.isUnderline ? 'underline' : 'none';
          if (ed.fontColor) el.style.color = ed.fontColor;
          if (ed.bgColour) el.style.backgroundColor = ed.bgColour;
          if (ed.align) el.style.textAlign = ed.align;
          el.focus();
        }
      }, 50);
    }

    function applyTextEditorFormat(key, value) {
      const ed = state.textEditorModal;
      if (!ed) return;
      if (key === 'isBold' || key === 'isItalic' || key === 'isUnderline') {
        ed[key] = !ed[key];
      } else {
        ed[key] = value;
      }

      const el = document.getElementById('modal-text-input');
      if (el) {
        if (ed.fontFamily) el.style.fontFamily = ed.fontFamily;
        if (ed.fontSize === 'lg') el.style.fontSize = '16px';
        else if (ed.fontSize === 'sm') el.style.fontSize = '10px';
        else el.style.fontSize = '12px';
        el.style.fontWeight = ed.isBold ? 'bold' : 'normal';
        el.style.fontStyle = ed.isItalic ? 'italic' : 'normal';
        el.style.textDecoration = ed.isUnderline ? 'underline' : 'none';
        el.style.color = ed.fontColor || '#ffffff';
        el.style.backgroundColor = ed.bgColour || '#18181b';
        el.style.textAlign = ed.align || 'left';
      }
      render();
      setTimeout(() => {
        const el2 = document.getElementById('modal-text-input');
        if (el2) el2.innerText = ed.text;
      }, 10);
    }

    function onTextEditorInput(e) {
      const ed = state.textEditorModal;
      if (!ed) return;
      const text = e.target.innerText;
      ed.text = text;
      if (ed.history[ed.historyIndex] !== text) {
        ed.history = ed.history.slice(0, ed.historyIndex + 1);
        ed.history.push(text);
        ed.historyIndex = ed.history.length - 1;
      }
    }

    function textEditorUndo() {
      const ed = state.textEditorModal;
      if (!ed || ed.historyIndex <= 0) return;
      ed.historyIndex--;
      ed.text = ed.history[ed.historyIndex];
      const el = document.getElementById('modal-text-input');
      if (el) el.innerText = ed.text;
      render();
    }

    function textEditorRedo() {
      const ed = state.textEditorModal;
      if (!ed || ed.historyIndex >= ed.history.length - 1) return;
      ed.historyIndex++;
      ed.text = ed.history[ed.historyIndex];
      const el = document.getElementById('modal-text-input');
      if (el) el.innerText = ed.text;
      render();
    }

    function closeTextEditorModal() {
      state.textEditorModal = null;
      render();
    }

    function saveTextEditorModal() {
      const ed = state.textEditorModal;
      if (!ed) return;
      const el = document.getElementById('modal-text-input');
      const text = el ? el.innerText.trim() : ed.text.trim();

      if (!text) {
        alert('Please enter some text for the bubble.');
        return;
      }

      let bubble = state.textBubbles.find(b => b.id === ed.id);
      if (bubble) {
        bubble.text = text;
        bubble.fontFamily = ed.fontFamily;
        bubble.fontSize = ed.fontSize;
        bubble.fontColor = ed.fontColor;
        bubble.bgColour = ed.bgColour;
        bubble.align = ed.align;
        bubble.isBold = ed.isBold;
        bubble.isItalic = ed.isItalic;
        bubble.isUnderline = ed.isUnderline;
        saveTextBubble(bubble);
      } else {
        bubble = {
          id: ed.id,
          parentId: state.currentFolderId,
          isBubble: true,
          attachedFileId: ed.attachedFileId,
          text: text,
          fontFamily: ed.fontFamily,
          fontSize: ed.fontSize,
          fontColor: ed.fontColor,
          bgColour: ed.bgColour,
          align: ed.align,
          isBold: ed.isBold,
          isItalic: ed.isItalic,
          isUnderline: ed.isUnderline,
          width: 140,
          height: 80,
          x: 40,
          y: 40
        };
        state.textBubbles.push(bubble);
        saveTextBubble(bubble);
      }
      closeTextEditorModal();
    }

    function toggleHamburgerMenu(e) {
      if (e) e.stopPropagation();
      state.hamburgerMenuOpen = !state.hamburgerMenuOpen;
      render();
    }

    function closeHamburgerMenu() {
      if (state.hamburgerMenuOpen) {
        state.hamburgerMenuOpen = false;
        render();
      }
    }

    function navigateTo(folderId) {
      state.currentFolderId = folderId;
      state.selectedIds = [];
      state.activeMenuId = null;
      render();
    }

    function navigateBack() {
      if (state.currentFolderId === null) return;
      const curr = state.folders.find(f => f.id === state.currentFolderId);
      if (curr) {
        navigateTo(curr.parentId);
      } else {
        navigateTo(null);
      }
    }

    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      state.selectedIds = [];
      render();
    }

    function toggleEditMode() {
      state.editMode = !state.editMode;
      render();
    }

    function handleItemClick(e, id, isFolderItem, isBubbleItem = false) {
      if (e) e.stopPropagation();
      if (state.selectMode) {
        if (state.selectedIds.includes(id)) {
          state.selectedIds = state.selectedIds.filter(i => i !== id);
        } else {
          state.selectedIds.push(id);
        }
        render();
        return;
      }

      if (isFolderItem) {
        navigateTo(id);
      } else if (isBubbleItem) {
        openTextEditorModal(id);
      } else {
        const file = state.files.find(f => f.id === id);
        if (!file) return;

        if (file.fileType === 'link' && file.dataUrl) {
          window.open(file.dataUrl, '_blank');
        } else if (file.fileType === 'app' || file.fileType === 'ios-app') {
          if (file.dataUrl) window.location.href = file.dataUrl;
        } else if (file.fileType === 'web-video') {
          state.popupVideoUrl = file.dataUrl;
          render();
        } else {
          openQuickView(id);
        }
      }
    }

    function toggleMenu(e, id) {
      if (e) e.stopPropagation();
      state.activeMenuId = state.activeMenuId === id ? null : id;
      render();
    }

    function closeMenu() {
      if (state.activeMenuId !== null) {
        state.activeMenuId = null;
        render();
      }
    }

    function openUploadModal() {
      state.showUploadModal = true;
      render();
    }

    function closeUploadModal() {
      state.showUploadModal = false;
      render();
    }

    function openLinkModal() {
      state.linkModal = true;
      state.linkModalThumbData = null;
      render();
    }

    function closeLinkModal() {
      state.linkModal = false;
      state.linkModalThumbData = null;
      render();
    }

    function saveLinkModal() {
      const urlInput = document.getElementById('link-url-input');
      const nameInput = document.getElementById('link-name-input');
      let url = urlInput ? urlInput.value.trim() : '';
      let name = nameInput ? nameInput.value.trim() : '';

      if (!url) {
        alert('Please enter a valid URL.');
        return;
      }
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      if (!name) name = url;

      const file = {
        id: uid(),
        parentId: state.currentFolderId,
        name: name,
        fileType: 'link',
        dataUrl: url,
        thumbnailData: state.linkModalThumbData || null,
        width: 112,
        height: 144
      };
      state.files.push(file);
      saveFile(file);
      closeLinkModal();
      render();
    }

    function openWebVideoModal() {
      state.webVideoModal = true;
      state.webVideoModalThumbData = null;
      render();
    }

    function closeWebVideoModal() {
      state.webVideoModal = false;
      state.webVideoModalThumbData = null;
      render();
    }

    function saveWebVideoModal() {
      const urlInput = document.getElementById('web-video-url-input');
      const nameInput = document.getElementById('web-video-name-input');
      let url = urlInput ? urlInput.value.trim() : '';
      let name = nameInput ? nameInput.value.trim() : '';

      if (!url) {
        alert('Please enter a video URL or embed snippet.');
        return;
      }
      if (!name) name = 'Web Video';

      const file = {
        id: uid(),
        parentId: state.currentFolderId,
        name: name,
        fileType: 'web-video',
        dataUrl: url,
        thumbnailData: state.webVideoModalThumbData || null,
        width: 112,
        height: 144
      };
      state.files.push(file);
      saveFile(file);
      closeWebVideoModal();
      render();
    }

    function openAppModal() {
      state.appModal = true;
      state.appModalThumbData = null;
      render();
    }

    function closeAppModal() {
      state.appModal = false;
      state.appModalThumbData = null;
      render();
    }

    function saveAppModal() {
      const schemeInput = document.getElementById('app-scheme-input');
      const nameInput = document.getElementById('app-name-input');
      let scheme = schemeInput ? schemeInput.value.trim() : '';
      let name = nameInput ? nameInput.value.trim() : '';

      if (!scheme) {
        alert('Please enter an app URL scheme.');
        return;
      }
      if (!name) name = 'iOS App';

      const file = {
        id: uid(),
        parentId: state.currentFolderId,
        name: name,
        fileType: 'app',
        dataUrl: scheme,
        thumbnailData: state.appModalThumbData || null,
        width: 112,
        height: 144
      };
      state.files.push(file);
      saveFile(file);
      closeAppModal();
      render();
    }

    function closePopupVideo() {
      state.popupVideoUrl = null;
      render();
    }

    function openNewFolderModal() {
      const name = prompt('Enter folder name:');
      if (name && name.trim()) {
        const folder = {
          id: uid(),
          name: name.trim(),
          parentId: state.currentFolderId,
          width: 96,
          height: 96
        };
        state.folders.push(folder);
        saveFolder(folder);
        render();
      }
    }

    function triggerFolderCover(folderId) {
      state.targetFolderCoverId = folderId;
      document.getElementById('folder-cover-input').click();
    }

    function triggerChangeImage(fileId) {
      state.targetChangeImageId = fileId;
      document.getElementById('change-image-input').click();
    }

    function renameItem(id, isFolderItem, isBubbleItem = false) {
      if (isBubbleItem) {
        openTextEditorModal(id);
        return;
      }
      if (isFolderItem) {
        const folder = state.folders.find(f => f.id === id);
        if (!folder) return;
        const newName = prompt('Rename folder:', folder.name);
        if (newName && newName.trim()) {
          folder.name = newName.trim();
          saveFolder(folder);
          render();
        }
      } else {
        const file = state.files.find(f => f.id === id);
        if (!file) return;
        const newName = prompt('Rename file:', file.name);
        if (newName && newName.trim()) {
          file.name = newName.trim();
          saveFile(file);
          render();
        }
      }
    }

    function deleteItemConfirm(id, isFolderItem, isBubbleItem = false) {
      if (confirm('Are you sure you want to delete this item?')) {
        if (isBubbleItem) {
          state.textBubbles = state.textBubbles.filter(b => b.id !== id);
          deleteFromDB('textBubbles', id);
        } else if (isFolderItem) {
          state.folders = state.folders.filter(f => f.id !== id);
          deleteFromDB('folders', id);
        } else {
          state.files = state.files.filter(f => f.id !== id);
          deleteFromDB('files', id);
        }
        render();
      }
    }

    function snapToOriginalShape(id) {
      const folder = state.folders.find(f => f.id === id);
      if (folder) {
        folder.width = 96;
        folder.height = 96;
        saveFolder(folder);
        render();
        return;
      }
      const bubble = state.textBubbles.find(b => b.id === id);
      if (bubble) {
        bubble.width = 140;
        bubble.height = 80;
        saveTextBubble(bubble);
        render();
        return;
      }
      const file = state.files.find(f => f.id === id);
      if (file) {
        file.width = 112;
        file.height = 144;
        saveFile(file);
        render();
      }
    }

    function resizeByFinger(id, isFolderItem) {
      alert('You can drag the yellow handle at the bottom right corner of any item in Edit Mode to resize it with your finger!');
    }

    function moveToFolder(id, isFolderItem, isBubbleItem = false) {
      const availableFolders = state.folders.filter(f => f.id !== id && f.id !== state.currentFolderId);
      if (availableFolders.length === 0) {
        alert('No other folders available to move to.');
        return;
      }
      let msg = 'Select target folder ID or name:\n' + availableFolders.map(f => `${f.name} (ID: ${f.id})`).join('\n');
      const target = prompt(msg);
      if (!target) return;
      const found = availableFolders.find(f => f.id === target.trim() || f.name.toLowerCase() === target.trim().toLowerCase());
      if (found) {
        if (isBubbleItem) {
          const bubble = state.textBubbles.find(b => b.id === id);
          if (bubble) {
            bubble.parentId = found.id === 'root' ? null : found.id;
            saveTextBubble(bubble);
          }
        } else if (isFolderItem) {
          const folder = state.folders.find(f => f.id === id);
          if (folder) {
            folder.parentId = found.id === 'root' ? null : found.id;
            saveFolder(folder);
          }
        } else {
          const file = state.files.find(f => f.id === id);
          if (file) {
            file.parentId = found.id === 'root' ? null : found.id;
            saveFile(file);
          }
        }
        render();
      } else {
        alert('Folder not found.');
      }
    }

    function openQuickView(id) {
      state.quickViewFileId = id;
      render();
    }

    function closeQuickView() {
      state.quickViewFileId = null;
      render();
    }

    function renderQuickViewModal() {
      const file = state.files.find(f => f.id === state.quickViewFileId);
      if (!file) return '';

      const type = file.fileType || '';
      const isImage = type.startsWith('image/');
      const isVideo = isVideoFile(file);
      const isAudio = isAudioFile(file);

      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4" onclick="closeQuickView()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 w-full max-w-2xl flex flex-col gap-4 shadow-2xl relative max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
              <span class="text-sm font-bold text-white truncate max-w-[80%]">${file.name}</span>
              <button onclick="closeQuickView()" class="p-1.5 bg-zinc-800 hover:bg-zinc-700 rounded-full text-zinc-300"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex items-center justify-center bg-black rounded-2xl overflow-hidden min-h-[200px]">
              ${isImage && (file.blobUrl || file.dataUrl) ? `<img src="${file.blobUrl || file.dataUrl}" class="max-h-[60vh] object-contain rounded-xl" />` : ''}
              ${isVideo && (file.blobUrl || file.dataUrl) ? `<video controls autoplay playsinline class="max-h-[60vh] w-full rounded-xl" src="${file.blobUrl || file.dataUrl}"></video>` : ''}
              ${isAudio && (file.blobUrl || file.dataUrl) ? `<audio controls autoplay class="w-full m-4" src="${file.blobUrl || file.dataUrl}"></audio>` : ''}
              {!isImage && !isVideo && !isAudio ? `<div class="p-8 text-center text-zinc-400 text-xs">Preview not available for this file type.<br/><br/><a href="${file.blobUrl || file.dataUrl}" download="${file.name}" class="px-4 py-2 bg-amber-500 text-black font-bold rounded-xl inline-block mt-2">Download File</a></div>` : ''}
            </div>
            <div class="flex items-center justify-between text-xs text-zinc-400 border-t border-zinc-800 pt-3">
              <span>Type: ${file.fileType || 'Unknown'}</span>
              <button onclick="shareFile('${file.id}')" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-amber-400 font-bold rounded-xl flex items-center gap-1.5"><i data-lucide="share" class="w-3.5 h-3.5"></i> iOS Share</button>
            </div>
          </div>
        </div>
      `;
    }

    async function copySingleFileClipboard(id) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(file.dataUrl || file.blobUrl || file.name);
          alert('Copied to clipboard!');
        } else {
          alert('Clipboard access not supported.');
        }
      } catch (e) {
        alert('Could not copy: ' + e.message);
      }
    }

    async function shareFile(id) {
      const file = state.files.find(f => f.id === id);
      if (!file) return;
      try {
        if (navigator.share) {
          await navigator.share({
            title: file.name,
            url: file.dataUrl || file.blobUrl
          });
        } else {
          copySingleFileClipboard(id);
        }
      } catch (e) {
        console.log('Share canceled/failed');
      }
    }

    function toggleSelectAll() {
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const allItems = [...childrenFolders, ...childrenFiles, ...childrenBubbles];

      if (state.selectedIds.length === allItems.length) {
        state.selectedIds = [];
      } else {
        state.selectedIds = allItems.map(i => i.id);
      }
      render();
    }

    function bulkDelete() {
      if (confirm(`Delete ${state.selectedIds.length} selected items?`)) {
        state.selectedIds.forEach(id => {
          state.folders = state.folders.filter(f => f.id !== id);
          state.files = state.files.filter(f => f.id !== id);
          state.textBubbles = state.textBubbles.filter(b => b.id !== id);
          deleteFromDB('folders', id);
          deleteFromDB('files', id);
          deleteFromDB('textBubbles', id);
        });
        state.selectedIds = [];
        render();
      }
    }

    function bulkCopy() {
      alert('Selected items copied to memory clipboard.');
    }

    function bulkMove() {
      const availableFolders = state.folders.filter(f => !state.selectedIds.includes(f.id));
      if (availableFolders.length === 0) {
        alert('No available target folders.');
        return;
      }
      let msg = 'Select target folder ID or name:\n' + availableFolders.map(f => `${f.name} (ID: ${f.id})`).join('\n');
      const target = prompt(msg);
      if (!target) return;
      const found = availableFolders.find(f => f.id === target.trim() || f.name.toLowerCase() === target.trim().toLowerCase());
      if (found) {
        const targetParentId = found.id === 'root' ? null : found.id;
        state.selectedIds.forEach(id => {
          const folder = state.folders.find(f => f.id === id);
          if (folder) { folder.parentId = targetParentId; saveFolder(folder); }
          const file = state.files.find(f => f.id === id);
          if (file) { file.parentId = targetParentId; saveFile(file); }
          const bubble = state.textBubbles.find(b => b.id === id);
          if (bubble) { bubble.parentId = targetParentId; saveTextBubble(bubble); }
        });
        state.selectedIds = [];
        render();
      }
    }

    function bulkShare() {
      alert('iOS Share triggered for selected batch.');
    }

    function forcePullCloudData() {
      if (confirm('Force pull latest data from GitHub Cloud? Unsaved local changes will be replaced.')) {
        syncWithGitHub(true);
      }
    }

    function attachDragAndResizeListeners() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      let activeDragId = null;
      let activeResizeId = null;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      let initialWidth = 0, initialHeight = 0;

      container.querySelectorAll('[id^="item-"]').forEach(el => {
        const id = el.getAttribute('data-id');

        el.addEventListener('pointerdown', (e) => {
          if (!state.editMode) return;
          if (e.target.closest('.resize-handle') || e.target.closest('button')) return;

          activeDragId = id;
          startX = e.clientX;
          startY = e.clientY;
          initialLeft = parseInt(el.style.left) || 0;
          initialTop = parseInt(el.style.top) || 0;
          el.setPointerCapture(e.pointerId);
          e.stopPropagation();
        });

        const handle = el.querySelector('.resize-handle');
        if (handle) {
          handle.addEventListener('pointerdown', (e) => {
            if (!state.editMode) return;
            activeResizeId = id;
            startX = e.clientX;
            startY = e.clientY;
            initialWidth = el.offsetWidth;
            initialHeight = el.offsetHeight;
            handle.setPointerCapture(e.pointerId);
            e.stopPropagation();
          });
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (activeDragId) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          let newX = Math.max(0, initialLeft + dx);
          let newY = Math.max(0, initialTop + dy);

          newX = Math.round(newX / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
          newY = Math.round(newY / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;

          const el = document.getElementById(`item-${activeDragId}`);
          if (el) {
            el.style.left = newX + 'px';
            el.style.top = newY + 'px';
          }
        }

        if (activeResizeId) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          let newW = Math.max(64, initialWidth + dx);
          let newH = Math.max(64, initialHeight + dy);

          newW = Math.round(newW / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;
          newH = Math.round(newH / CONFIG.GRID_SIZE) * CONFIG.GRID_SIZE;

          const el = document.getElementById(`item-${activeResizeId}`);
          if (el) {
            el.style.width = newW + 'px';
            el.style.height = newH + 'px';
          }
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (activeDragId) {
          const el = document.getElementById(`item-${activeDragId}`);
          if (el) {
            const x = parseInt(el.style.left) || 0;
            const y = parseInt(el.style.top) || 0;
            const folder = state.folders.find(f => f.id === activeDragId);
            if (folder) { folder.x = x; folder.y = y; saveFolder(folder); }
            const bubble = state.textBubbles.find(b => b.id === activeDragId);
            if (bubble) { bubble.x = x; bubble.y = y; saveTextBubble(bubble); }
            const file = state.files.find(f => f.id === activeDragId);
            if (file) { file.x = x; file.y = y; saveFile(file); }
          }
          activeDragId = null;
        }

        if (activeResizeId) {
          const el = document.getElementById(`item-${activeResizeId}`);
          if (el) {
            const w = el.offsetWidth;
            const h = el.offsetHeight;
            const folder = state.folders.find(f => f.id === activeResizeId);
            if (folder) { folder.width = w; folder.height = h; saveFolder(folder); }
            const bubble = state.textBubbles.find(b => b.id === activeResizeId);
            if (bubble) { bubble.width = w; bubble.height = h; saveTextBubble(bubble); }
            const file = state.files.find(f => f.id === activeResizeId);
            if (file) { file.width = w; file.height = h; saveFile(file); }
          }
          activeResizeId = null;
        }
      });
    }

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (let f of files) {
        const id = uid();
        const uploadObj = { id, name: f.name, progress: 0 };
        state.activeUploads.push(uploadObj);
        render();

        const reader = new FileReader();
        reader.onprogress = (ev) => {
          if (ev.lengthComputable) {
            uploadObj.progress = Math.round((ev.loaded / ev.total) * 100);
            render();
          }
        };
        reader.onload = async () => {
          const fileData = {
            id,
            parentId: state.currentFolderId,
            name: f.name,
            fileType: f.type || 'application/octet-stream',
            dataUrl: reader.result,
            width: 112,
            height: 144
          };
          state.files.push(fileData);
          await saveFile(fileData);
          state.activeUploads = state.activeUploads.filter(u => u.id !== id);
          render();
        };
        reader.readAsDataURL(f);
      }
      e.target.value = '';
    });

    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (let f of files) {
        const id = uid();
        const uploadObj = { id, name: f.name, progress: 0 };
        state.activeUploads.push(uploadObj);
        render();

        const reader = new FileReader();
        reader.onprogress = (ev) => {
          if (ev.lengthComputable) {
            uploadObj.progress = Math.round((ev.loaded / ev.total) * 100);
            render();
          }
        };
        reader.onload = async () => {
          const fileData = {
            id,
            parentId: state.currentFolderId,
            name: f.name,
            fileType: f.type || 'image/png',
            dataUrl: reader.result,
            width: 112,
            height: 144
          };
          state.files.push(fileData);
          await saveFile(fileData);
          state.activeUploads = state.activeUploads.filter(u => u.id !== id);
          render();
        };
        reader.readAsDataURL(f);
      }
      e.target.value = '';
    });

    document.getElementById('change-image-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && state.targetChangeImageId) {
        const reader = new FileReader();
        reader.onload = () => {
          const target = state.files.find(f => f.id === state.targetChangeImageId);
          if (target) {
            target.thumbnailData = reader.result;
            saveFile(target);
            render();
          }
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    });

    document.getElementById('folder-cover-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && state.targetFolderCoverId) {
        const reader = new FileReader();
        reader.onload = () => {
          const target = state.folders.find(f => f.id === state.targetFolderCoverId);
          if (target) {
            target.coverUrl = reader.result;
            saveFolder(target);
            render();
          }
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    });

    document.getElementById('link-thumbnail-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          state.linkModalThumbData = reader.result;
          render();
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    });

    document.getElementById('web-video-thumbnail-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          state.webVideoModalThumbData = reader.result;
          render();
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    });

    document.getElementById('app-thumbnail-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          state.appModalThumbData = reader.result;
          render();
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    });

    loadData();
  </script>
