<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aiden Files - Gothic Archive</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #e5e7eb;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col select-none">

    <!-- Top Navigation / Header -->
    <header class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded bg-purple-950 border border-purple-800 flex items-center justify-center text-purple-300 font-bold">A</div>
            <div>
                <h1 class="text-sm font-semibold tracking-wider uppercase text-purple-200">Aiden Files</h1>
                <p class="text-xs text-zinc-500">Gothic Archive Edition</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button id="saveBtn" class="px-3 py-1.5 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded text-zinc-300 transition">Save State</button>
            <button id="loadBtn" class="px-3 py-1.5 text-xs font-medium bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded text-zinc-300 transition">Load State</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-6 relative">
        <div class="max-w-7xl mx-auto">
            <!-- Toolbar / Formatting Bar -->
            <div id="formattingBar" class="flex flex-wrap items-center justify-between gap-2 mb-6 p-3 bg-zinc-900/60 border border-zinc-800 rounded-lg">
                <div class="flex items-center space-x-2">
                    <button id="newFolderBtn" class="px-3 py-1.5 text-xs bg-purple-900/50 hover:bg-purple-900 text-purple-200 border border-purple-700/50 rounded transition">+ New Folder</button>
                    <button id="uploadBtn" class="px-3 py-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 rounded transition">Upload File</button>
                    <input type="file" id="fileInput" class="hidden" multiple>
                </div>
                <div class="flex items-center space-x-2 text-xs text-zinc-400">
                    <span id="itemCount">0 items</span>
                </div>
            </div>

            <!-- Archive Workspace / Grid -->
            <div id="workspace" class="min-h-[60vh] border border-dashed border-zinc-800 rounded-xl p-4 flex flex-wrap gap-4 items-start content-start relative">
                <!-- Empty State Message -->
                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-600 pointer-events-none">
                    <svg class="w-12 h-12 mb-2 stroke-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    <p class="text-sm">Your archive is empty. Upload files or create folders.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 py-3 text-center text-xs text-zinc-600">
        Aiden Files &bull; Secure Standalone Archive
    </footer>

    <!-- Basic Client Script Wrapper -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workspace = document.getElementById('workspace');
            const emptyState = document.getElementById('emptyState');
            const itemCount = document.getElementById('itemCount');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const newFolderBtn = document.getElementById('newFolderBtn');
            const saveBtn = document.getElementById('saveBtn');
            const loadBtn = document.getElementById('loadBtn');

            let items = [];

            function updateUI() {
                itemCount.textContent = `${items.length} items`;
                if (items.length > 0) {
                    emptyState.style.display = 'none';
                } else {
                    emptyState.style.display = 'flex';
                }
            }

            uploadBtn.addEventListener('click', () => fileInput.click());
            
            fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    items.push({ id: Date.now() + Math.random(), name: file.name, type: 'file' });
                });
                updateUI();
            });

            newFolderBtn.addEventListener('click', () => {
                const folderName = prompt("Enter folder name:", "New Gothic Folder");
                if (folderName) {
                    items.push({ id: Date.now() + Math.random(), name: folderName, type: 'folder' });
                    updateUI();
                }
            });

            saveBtn.addEventListener('click', () => {
                localStorage.setItem('aiden_files_state', JSON.stringify(items));
                alert('Archive state saved successfully.');
            });

            loadBtn.addEventListener('click', () => {
                const saved = localStorage.getItem('aiden_files_state');
                if (saved) {
                    items = JSON.parse(saved);
                    updateUI();
                    alert('Archive state loaded successfully.');
                } else {
                    alert('No saved state found.');
                }
            });
        });
    </script>
</body>
</html>
