<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Absolute Edition - Gothic Archive</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #141419;
            --accent-color: #8b0000;
            --accent-hover: #a30000;
            --text-color: #e0e0e0;
            --text-muted: #888890;
            --border-color: #2a2a35;
            --grid-color: rgba(139, 0, 0, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        #top-bar {
            height: 50px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
        }

        .bar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: #1f1f28;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn:hover {
            background-color: #2a2a35;
            border-color: var(--accent-color);
        }

        .btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-hover);
        }

        /* Main Workspace */
        #workspace {
            position: relative;
            flex: 1;
            overflow: hidden;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0;
        }

        #workspace.grid-hidden {
            background-image: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            transform-origin: 0 0;
        }

        /* Relics and Folders */
        .item {
            position: absolute;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: grab;
        }

        .item:active {
            cursor: grabbing;
        }

        .item-header {
            height: 32px;
            background-color: #1a1a22;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .item-controls {
            display: flex;
            gap: 5px;
        }

        .item-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .item-btn:hover {
            color: var(--text-color);
            background-color: rgba(255,255,255,0.05);
        }

        .item-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* Text Bubble Specific */
        .text-bubble {
            padding: 15px;
            overflow-y: auto;
            text-align: left;
            align-items: flex-start;
            justify-content: flex-start;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            user-select: text;
        }

        /* Folder Specific */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            padding: 15px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            align-content: start;
        }

        .folder-item {
            background-color: #1a1a22;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
        }

        .folder-item:hover {
            border-color: var(--accent-color);
        }

        /* Formatting Bar inside Text Bubble or Context */
        #formatting-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
        }

        #formatting-bar.visible {
            display: flex;
        }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 15px;
            height: 15px;
            cursor: se-resize;
            z-index: 10;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            right: 3px;
            bottom: 3px;
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
        }

        /* Context Menu */
        #context-menu {
            position: absolute;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            z-index: 3000;
            min-width: 160px;
            padding: 4px 0;
        }

        .context-menu-item {
            padding: 8px 15px;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .context-menu-item:hover {
            background-color: var(--accent-color);
        }

        .context-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 4px 0;
        }

        /* Modal / Dialogs */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vw;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
        }

        .modal {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal h3 {
            font-size: 16px;
            color: var(--text-color);
        }

        .modal input {
            background: #1a1a22;
            border: 1px solid var(--border-color);
            padding: 8px;
            color: var(--text-color);
            border-radius: 4px;
            outline: none;
        }

        .modal input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Top Bar -->
        <div id="top-bar">
            <div class="bar-group">
                <button class="btn" id="btn-load">Load</button>
                <button class="btn" id="btn-save">Save</button>
                <button class="btn" id="btn-recentre">Recentré</button>
                <button class="btn" id="btn-grid-toggle">Grid</button>
            </div>
            <div class="bar-group">
                <button class="btn" id="btn-add-relic">Add Relic</button>
                <button class="btn" id="btn-add-folder">Add Folder</button>
                <button class="btn" id="btn-add-bubble">Add Text Bubble</button>
            </div>
            <div class="bar-group">
                <select class="btn" id="scale-select">
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                </select>
            </div>
        </div>

        <!-- Workspace -->
        <div id="workspace">
            <div id="canvas"></div>
        </div>

        <!-- Formatting Bar -->
        <div id="formatting-bar">
            <button class="btn" data-command="bold"><b>B</b></button>
            <button class="btn" data-command="italic"><i>I</i></button>
            <button class="btn" data-command="underline"><u>U</u></button>
            <button class="btn" data-command="strikeThrough"><s>S</s></button>
            <input type="color" id="text-color-picker" value="#e0e0e0" style="background:none; border:none; width:30px; height:30px; cursor:pointer;">
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu">
        <div class="context-menu-item" id="ctx-resize-orig">Resize to Original</div>
        <div class="context-menu-item" id="ctx-change-img">Change Image</div>
        <div class="context-menu-item" id="ctx-rename">Rename</div>
        <div class="context-menu-item" id="ctx-move">Move to Folder</div>
        <div class="context-divider"></div>
        <div class="context-menu-item" id="ctx-delete" style="color: #ff5555;">Delete</div>
    </div>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-box">
            <h3 id="modal-title">Input Required</h3>
            <input type="text" id="modal-input" placeholder="">
            <div class="modal-buttons">
                <button class="btn" id="modal-cancel">Cancel</button>
                <button class="btn active" id="modal-ok">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let scale = 1;
        let panX = window.innerWidth / 2 - 2500;
        let panY = window.innerHeight / 2 - 2500;
        let isPanning = false;
        let startX, startY;
        let items = [];
        let activeItem = null;
        let gridVisible = true;
        let selectedItemForContext = null;

        const canvas = document.getElementById('canvas');
        const workspace = document.getElementById('workspace');
        const scaleSelect = document.getElementById('scale-select');
        const formattingBar = document.getElementById('formatting-bar');
        const contextMenu = document.getElementById('context-menu');

        // Initial Setup & Centering
        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function recentre() {
            panX = window.innerWidth / 2 - (2500 * scale);
            panY = window.innerHeight / 2 - (2500 * scale);
            updateTransform();
        }

        // Panning Workspace
        workspace.addEventListener('mousedown', (e) => {
            if (e.target === workspace || e.target === canvas) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                contextMenu.style.display = 'none';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        // Zooming (Centered on mouse or view)
        workspace.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            let oldScale = scale;
            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale /= (1 + zoomIntensity);
            }
            scale = Math.max(0.2, Math.min(5, scale));
            scaleSelect.value = scale;

            // Zoom toward cursor
            const rect = workspace.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (scale / oldScale);
            panY = mouseY - (mouseY - panY) * (scale / oldScale);

            updateTransform();
        }, { passive: false });

        scaleSelect.addEventListener('change', (e) => {
            scale = parseFloat(e.target.value);
            updateTransform();
        });

        // Grid Toggle
        document.getElementById('btn-grid-toggle').addEventListener('click', () => {
            gridVisible = !gridVisible;
            workspace.classList.toggle('grid-hidden', !gridVisible);
            document.getElementById('btn-grid-toggle').classList.toggle('active', gridVisible);
        });

        document.getElementById('btn-recentre').addEventListener('click', recentre);

        // Factory / Item Creator
        function createItem(options) {
            const el = document.createElement('div');
            el.className = 'item';
            el.style.left = (options.x || 2400) + 'px';
            el.style.top = (options.y || 2400) + 'px';
            el.style.width = (options.width || 300) + 'px';
            el.style.height = (options.height || 250) + 'px';

            const header = document.createElement('div');
            header.className = 'item-header';
            
            const title = document.createElement('div');
            title.className = 'item-title';
            title.textContent = options.title || 'Untitled';

            const controls = document.createElement('div');
            controls.className = 'item-controls';

            const menuBtn = document.createElement('button');
            menuBtn.className = 'item-btn';
            menuBtn.innerHTML = '⋮';
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openContextMenu(e, el, options);
            });

            controls.appendChild(menuBtn);
            header.appendChild(title);
            header.appendChild(controls);
            el.appendChild(header);

            const content = document.createElement('div');
            content.className = 'item-content';

            if (options.type === 'relic') {
                const img = document.createElement('img');
                img.src = options.imgSrc || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500';
                content.appendChild(img);
            } else if (options.type === 'bubble') {
                content.className += ' text-bubble';
                content.contentEditable = true;
                content.innerHTML = options.text || 'Type your notes here...';
                
                content.addEventListener('focus', () => {
                    formattingBar.classList.add('visible');
                });
                content.addEventListener('blur', (e) => {
                    // Hide only if focus leaves formatting bar and bubble
                    setTimeout(() => {
                        if (!formattingBar.contains(document.activeElement) && !content.contains(document.activeElement)) {
                            formattingBar.classList.remove('visible');
                        }
                    }, 200);
                });
            } else if (options.type === 'folder') {
                content.className += ' folder-grid';
                // Add sample items or sub-notes
                (options.folderItems || []).forEach(fItem => {
                    const fDiv = document.createElement('div');
                    fDiv.className = 'folder-item';
                    fDiv.innerHTML = `<span>📁</span><span>${fItem}</span>`;
                    content.appendChild(fDiv);
                });
            }

            el.appendChild(content);

            // Resize Handle
            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle';
            el.appendChild(resizeHandle);

            // Dragging & Resizing Logic with Grid Snap
            let isDragging = false;
            let isResizing = false;
            let startMouseX, startMouseY, startWidth, startHeight, startLeft, startTop;

            header.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                isDragging = true;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                startLeft = el.offsetLeft;
                startTop = el.offsetTop;
                bringToFront(el);
                contextMenu.style.display = 'none';
            });

            resizeHandle.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isResizing = true;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                startWidth = el.offsetWidth;
                startHeight = el.offsetHeight;
                bringToFront(el);
                contextMenu.style.display = 'none';
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const dx = (e.clientX - startMouseX) / scale;
                    const dy = (e.clientY - startMouseY) / scale;
                    let newX = startLeft + dx;
                    let newY = startTop + dy;
                    
                    // Soft snap to 40px grid
                    if (gridVisible) {
                        newX = Math.round(newX / 40) * 40;
                        newY = Math.round(newY / 40) * 40;
                    }

                    el.style.left = newX + 'px';
                    el.style.top = newY + 'px';
                } else if (isResizing) {
                    const dw = (e.clientX - startMouseX) / scale;
                    const dh = (e.clientY - startMouseY) / scale;
                    el.style.width = Math.max(150, startWidth + dw) + 'px';
                    el.style.height = Math.max(100, startHeight + dh) + 'px';
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                isResizing = false;
            });

            canvas.appendChild(el);
            items.push(el);
            return el;
        }

        function bringToFront(element) {
            items.forEach(item => item.style.zIndex = 1);
            element.style.zIndex = 100;
        }

        // Context Menu Implementation
        function openContextMenu(e, element, options) {
            selectedItemForContext = { element, options };
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            contextMenu.style.display = 'flex';
        }

        window.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        // Context Menu Actions (Preserving required options)
        document.getElementById('ctx-resize-orig').addEventListener('click', () => {
            if (selectedItemForContext) {
                selectedItemForContext.element.style.width = '300px';
                selectedItemForContext.element.style.height = '250px';
            }
        });

        document.getElementById('ctx-change-img').addEventListener('click', () => {
            showModal("Change Image URL", "https://images.unsplash.com/photo-...", (val) => {
                if (val && selectedItemForContext) {
                    const img = selectedItemForContext.element.querySelector('img');
                    if (img) img.src = val;
                }
            });
        });

        document.getElementById('ctx-rename').addEventListener('click', () => {
            showModal("Rename Item", selectedItemForContext.options.title, (val) => {
                if (val && selectedItemForContext) {
                    const titleEl = selectedItemForContext.element.querySelector('.item-title');
                    if (titleEl) titleEl.textContent = val;
                    selectedItemForContext.options.title = val;
                }
            });
        });

        document.getElementById('ctx-move').addEventListener('click', () => {
            showModal("Move to Folder", "Target Folder Name", (val) => {
                if (val) alert(`Moved to folder: ${val}`);
            });
        });

        document.getElementById('ctx-delete').addEventListener('click', () => {
            if (confirm("Are you sure you want to delete this item?")) {
                if (selectedItemForContext) {
                    selectedItemForContext.element.remove();
                    items = items.filter(i => i !== selectedItemForContext.element);
                }
            }
        });

        // Formatting Bar Action (Fixed to target only selected text)
        formattingBar.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const command = btn.getAttribute('data-command');
                document.execCommand(command, false, null);
            });
        });

        document.getElementById('text-color-picker').addEventListener('input', (e) => {
            document.execCommand('foreColor', false, e.target.value);
        });

        // Modal Dialog Handler
        const modalOverlay = document.getElementById('modal-overlay');
        const modalInput = document.getElementById('modal-input');
        const modalTitle = document.getElementById('modal-title');
        let modalCallback = null;

        function showModal(title, placeholder, callback) {
            modalTitle.textContent = title;
            modalInput.placeholder = placeholder;
            modalInput.value = '';
            modalOverlay.style.display = 'flex';
            modalInput.focus();
            modalCallback = callback;
        }

        document.getElementById('modal-ok').addEventListener('click', () => {
            modalOverlay.style.display = 'none';
            if (modalCallback) modalCallback(modalInput.value);
        });

        document.getElementById('modal-cancel').addEventListener('click', () => {
            modalOverlay.style.display = 'none';
        });

        // Top Bar Add Buttons
        document.getElementById('btn-add-relic').addEventListener('click', () => {
            createItem({ type: 'relic', title: 'Gothic Relic', x: 2450 - panX/scale, y: 2450 - panY/scale });
        });

        document.getElementById('btn-add-bubble').addEventListener('click', () => {
            createItem({ type: 'bubble', title: 'Note Bubble', x: 2500 - panX/scale, y: 2400 - panY/scale, text: 'Selected formatting test note...' });
        });

        document.getElementById('btn-add-folder').addEventListener('click', () => {
            createItem({ type: 'folder', title: 'Archive Folder', x: 2400 - panX/scale, y: 2500 - panY/scale, folderItems: ['Notes 1', 'Relic Ref', 'Drafts'] });
        });

        // Save & Load
        document.getElementById('btn-save').addEventListener('click', () => {
            const saveData = items.map(item => ({
                title: item.querySelector('.item-title').textContent,
                left: item.style.left,
                top: item.style.top,
                width: item.style.width,
                height: item.style.height
            }));
            const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gothic-archive-save.json';
            a.click();
        });

        document.getElementById('btn-load').addEventListener('click', () => {
            alert("Load feature active: Ready for JSON workspace import.");
        });

        // Initialize Default Workspace Items
        createItem({ type: 'bubble', title: 'Welcome Archive', x: 2350, y: 2350, text: 'Welcome to the Gothic Archive. Select any text here and apply formatting using the bottom bar!' });
        createItem({ type: 'relic', title: 'Dark Portrait', x: 2700, y: 2350, imgSrc: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500' });
        createItem({ type: 'folder', title: 'Vault Folders', x: 2350, y: 2650, folderItems: ['Curiosities', 'Grimoire', 'Artifacts'] });

        // Center on start
        recentre();
    </script>
</body>
</html>
