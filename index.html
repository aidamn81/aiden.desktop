<!DOCTYPE html>
<html lang="en" class="bg-black text-white select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aiden Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .edit-grid-bg {
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    .touch-none { touch-action: none; }

    .folder-cube {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .folder-cube:active { transform: scale(0.95); }

    .resize-handle {
      width: 28px;
      height: 28px;
      bottom: -4px;
      right: -4px;
      border-top-left-radius: 12px;
      touch-action: none;
      display: none;
    }

    body.edit-mode .resize-handle {
      display: flex;
    }

    .select-checkbox {
      display: none;
    }

    body.edit-mode .select-checkbox {
      display: flex;
    }

    #modal-text-input:empty:before {
      content: attr(data-placeholder);
      color: #71717a;
      pointer-events: none;
    }
    #modal-text-input { outline: none; }
  </style>
</head>
<body class="bg-black min-h-screen text-zinc-100 selection:bg-zinc-800 overflow-hidden">
  <div id="app" class="h-screen w-screen bg-black text-white flex flex-col overflow-hidden"></div>

  <!-- Hidden File Inputs -->
  <input id="file-input" type="file" multiple class="hidden" />
  <input id="photo-input" type="file" accept="image/*,video/*,audio/*" multiple class="hidden" />
  <input id="change-image-input" type="file" accept="image/*" class="hidden" />
  <input id="folder-cover-input" type="file" accept="image/*" class="hidden" />
  <input id="app-thumbnail-input" type="file" accept="image/*" class="hidden" />
  <input id="link-thumbnail-input" type="file" accept="image/*" class="hidden" />
  <input id="web-video-thumbnail-input" type="file" accept="image/*" class="hidden" />

  <script>
    const CONFIG = {
      ghRepo: 'aidamn81/aidenfiles',
      ghPath: 'aiden_meta.json',
      GRID_SIZE: 24
    };

    let state = {
      editMode: false,
      selectMode: false,
      selectedIds: [],
      currentFolderId: null,
      folders: [],
      files: [],
      textBubbles: [],
      ghToken: localStorage.getItem('af_gh_token') || '',
      isSyncing: false,
      activeMenuId: null,
      hamburgerMenuOpen: false,
      targetChangeImageId: null,
      targetFolderCoverId: null,
      quickViewFileId: null,
      showUploadModal: false,
      textEditorModal: null,
      checklistModal: false,
      checklistDraftItems: [],
      linkModal: false,
      linkModalThumbData: null,
      webVideoModal: false,
      webVideoModalThumbData: null,
      appModal: false,
      appModalThumbData: null,
      activeUploads: [],
      popupVideoUrl: null
    };

    const uid = () => Math.random().toString(36).substring(2, 9);
    const isFolder = item => !('fileType' in item) && !('isBubble' in item);
    const isBubble = item => item.isBubble === true;

    function isVideoFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('video/') || t === 'web-video' || n.endsWith('.mp4') || n.endsWith('.mov') || n.endsWith('.webm') || n.endsWith('.m4v') || n.endsWith('.mkv');
    }
    function isAudioFile(file) {
      const t = file.fileType || '';
      const n = file.name || '';
      return t.startsWith('audio/') || n.endsWith('.mp3') || n.endsWith('.m4a') || n.endsWith('.wav') || n.endsWith('.aac');
    }

    async function getOrCreateBlobUrl(file) {
      if (file.blobUrl) return file.blobUrl;
      if (file.rawBlob) {
        file.blobUrl = URL.createObjectURL(file.rawBlob);
        return file.blobUrl;
      }
      if (!file.dataUrl) return '';
      try {
        const res = await fetch(file.dataUrl);
        const blob = await res.blob();
        file.blobUrl = URL.createObjectURL(blob);
        return file.blobUrl;
      } catch (e) {
        return file.dataUrl;
      }
    }

    const DB_NAME = 'aiden_files_db';
    const DB_VERSION = 5;

    function openDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('textBubbles')) db.createObjectStore('textBubbles', { keyPath: 'id' });
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      });
    }

    async function loadData() {
      const db = await openDB();
      if (db) {
        state.folders = await new Promise(res => {
          const tx = db.transaction('folders', 'readonly');
          const req = tx.objectStore('folders').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.files = await new Promise(res => {
          const tx = db.transaction('files', 'readonly');
          const req = tx.objectStore('files').getAll();
          req.onsuccess = () => res(req.result || []);
        });
        state.textBubbles = await new Promise(res => {
          const tx = db.transaction('textBubbles', 'readonly');
          const req = tx.objectStore('textBubbles').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }

      for (let file of state.files) {
        if ((isVideoFile(file) || isAudioFile(file)) && file.fileType !== 'web-video') {
          await getOrCreateBlobUrl(file);
        }
      }

      if (state.folders.length === 0) {
        const root = { id: 'root', name: 'Aiden Files', parentId: null, width: 96, height: 96 };
        state.folders = [root];
        saveFolder(root);
      }
      render();
    }

    async function saveFolder(folder) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
      }
    }

    async function saveFile(file) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('files', 'readwrite');
        const fileToSave = { ...file };
        delete fileToSave.blobUrl;
        tx.objectStore('files').put(fileToSave);
      }
    }

    async function saveTextBubble(bubble) {
      const db = await openDB();
      if (db) {
        const tx = db.transaction('textBubbles', 'readwrite');
        tx.objectStore('textBubbles').put(bubble);
      }
    }

    function resetToken() {
      const token = prompt('Enter your GitHub Personal Access Token:', state.ghToken);
      if (token !== null) {
        state.ghToken = token.trim();
        localStorage.setItem('af_gh_token', state.ghToken);
        alert('New token saved successfully!');
      }
    }

    function render() {
      const app = document.getElementById('app');
      const currentFolder = state.folders.find(f => f.id === state.currentFolderId);
      const childrenFolders = state.folders.filter(f => f.parentId === state.currentFolderId && f.id !== 'root');
      const childrenFiles = state.files.filter(f => f.parentId === state.currentFolderId);
      const childrenBubbles = state.textBubbles.filter(b => b.parentId === state.currentFolderId);
      const items = [...childrenFolders, ...childrenFiles, ...childrenBubbles];
      const allChildrenSelected = items.length > 0 && items.every(item => state.selectedIds.includes(item.id));

      if (state.editMode) {
        document.body.classList.add('edit-mode');
      } else {
        document.body.classList.remove('edit-mode');
      }

      app.innerHTML = `
        <header class="shrink-0 z-50 bg-black/95 backdrop-blur-lg border-b border-zinc-950 px-3 py-2 flex flex-col gap-1.5 relative">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
                  <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                ${state.currentFolderId !== null ? `
                  <button onclick="navigateBack()" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1 text-xs font-bold shadow-md cursor-pointer shrink-0" title="Back">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back</span>
                  </button>
                ` : ''}
                <button onclick="toggleSelectMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.selectMode ? 'bg-indigo-500/20 border-indigo-500 text-indigo-300' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                  ${state.selectMode ? 'Cancel' : 'Select'}
                </button>
                <button onclick="toggleEditMode()" class="px-3 py-2 rounded-xl text-xs font-bold border ${state.editMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'} shrink-0">
                  ${state.editMode ? 'Edit Mode On' : 'Edit Mode Locked'}
                </button>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1 text-xs text-zinc-400 truncate px-2 shrink-0">
                <span onclick="navigateTo(null)" class="cursor-pointer hover:text-white">Home</span>
                ${currentFolder ? `<span class="text-zinc-600">/</span><span class="text-white font-semibold truncate">${currentFolder.name}</span>` : ''}
              </div>
            </div>
          </div>

          <!-- Two scrollable quick action menu lines -->
          <div class="flex flex-col gap-1 pt-1 border-t border-zinc-900">
            <!-- Line 1 -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 whitespace-nowrap">
              <button onclick="toggleEditMode()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-yellow-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit Mode
              </button>
              <button onclick="openUploadModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Item
              </button>
              <button onclick="openTextEditorModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="message-square" class="w-3.5 h-3.5"></i> Add Txt
              </button>
              <button onclick="openNewFolderModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> New Folder
              </button>
            </div>
            <!-- Line 2 -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 whitespace-nowrap">
              <button onclick="window.location.href='lyrics.html'" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="music" class="w-3.5 h-3.5"></i> Lyrics
              </button>
              <button onclick="openPercentageCalculator()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="percent" class="w-3.5 h-3.5"></i> % Calculator
              </button>
              <button onclick="openChecklistModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Add Checklist
              </button>
              <button onclick="openLinkModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> Add Link
              </button>
              <button onclick="openWebVideoModal()" class="px-2.5 py-1 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-lg text-xs font-bold text-amber-400 flex items-center gap-1.5 shrink-0 cursor-pointer">
                <i data-lucide="video" class="w-3.5 h-3.5"></i> Add Web Video
              </button>
            </div>
          </div>

          ${state.hamburgerMenuOpen ? `
            <div onclick="event.stopPropagation()" class="absolute top-14 left-3 w-64 bg-black border border-zinc-700/90 rounded-2xl shadow-2xl backdrop-blur-xl z-50 overflow-hidden text-xs py-2 flex flex-col gap-1 px-2">
              <button onclick="navigateTo(null); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="home" class="w-4 h-4 text-amber-400"></i> Home
              </button>
              <button onclick="openNewFolderModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder
              </button>
              <button onclick="openUploadModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4 text-amber-400"></i> Add Item
              </button>
              <button onclick="openLinkModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="link" class="w-4 h-4 text-amber-400"></i> Add Link
              </button>
              <button onclick="openWebVideoModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="video" class="w-4 h-4 text-amber-400"></i> Add Web Video
              </button>
              <button onclick="openChecklistModal(); closeHamburgerMenu();" class="w-full px-3 py-2.5 text-left hover:bg-zinc-900 rounded-xl flex items-center gap-2.5 text-zinc-200 font-bold cursor-pointer">
                <i data-lucide="check-square" class="w-4 h-4 text-amber-400"></i> Add Checklist
              </button>
            </div>
          ` : ''}
        </header>

        <main onclick="closeMenu(); closeHamburgerMenu();" class="flex-1 relative w-full h-full overflow-auto ${state.editMode ? 'edit-grid-bg' : ''}" id="main-scroll-container">
          ${state.hamburgerMenuOpen ? `<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40" onclick="closeHamburgerMenu()"></div>` : ''}

          ${items.length === 0 ? `
            <div class="flex flex-col items-center justify-center h-full text-center p-6 text-zinc-500 text-sm gap-3">
              <span>Folder is empty</span>
            </div>
          ` : `
            <div class="relative min-w-[1200px] min-h-[1200px] p-4 select-none" id="canvas-container">
              ${items.map((item, index) => renderItem(item, index)).join('')}
            </div>
          `}
        </main>

        ${state.showUploadModal ? renderUploadModal() : ''}
        ${state.linkModal ? renderLinkModal() : ''}
        ${state.webVideoModal ? renderWebVideoModal() : ''}
        ${state.appModal ? renderAppModal() : ''}
        ${state.checklistModal ? renderChecklistModal() : ''}
        ${state.quickViewFileId ? renderQuickViewModal() : ''}
        ${state.textEditorModal ? renderTextEditorModal() : ''}
        ${state.popupVideoUrl ? renderPopupVideoModal() : ''}
      `;

      if (window.lucide) window.lucide.createIcons();
    }

    function openPercentageCalculator() {
      let val1 = prompt('Enter the base number (or part):');
      if (val1 === null) return;
      let val2 = prompt('Enter the percentage or total:');
      if (val2 === null) return;
      let num1 = parseFloat(val1);
      let num2 = parseFloat(val2);
      if (isNaN(num1) || isNaN(num2)) {
        alert('Please enter valid numbers.');
        return;
      }
      let result = (num1 * num2) / 100;
      alert(`${num2}% of ${num1} is: ${result}`);
    }

    function getFileIcon(type, name) {
      if (type === 'link' || name.startsWith('http')) return 'link';
      if (type === 'web-video') return 'video';
      if (type === 'app' || type === 'ios-app') return 'smartphone';
      if (type.startsWith('video/') || name.endsWith('.mp4')) return 'video';
      if (type.startsWith('audio/')) return 'music';
      return 'file';
    }

    function renderItem(item, index) {
      const col = index % 4;
      const row = Math.floor(index / 4);
      const posX = item.x !== undefined ? item.x : (20 + col * 140);
      const posY = item.y !== undefined ? item.y : (20 + row * 160);
      const folder = isFolder(item);
      const bubble = isBubble(item);

      if (bubble) {
        return `
          <div style="left: ${posX}px; top: ${posY}px; width: 160px; min-height: 100px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false, true)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border border-zinc-700 rounded-2xl p-3 shadow-lg relative flex flex-col justify-between overflow-hidden">
              <div class="w-full h-full whitespace-pre-wrap break-words leading-tight select-none pointer-events-none text-xs text-zinc-200">${item.text || 'Empty bubble'}</div>
            </div>
          </div>
        `;
      } else if (folder) {
        return `
          <div style="left: ${posX}px; top: ${posY}px; width: 96px; height: 96px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', true)">
            <div class="folder-cube w-full h-full shrink-0 bg-gradient-to-b from-zinc-800 to-zinc-950 border border-zinc-700/60 flex flex-col items-center justify-center relative overflow-hidden">
              <i data-lucide="folder" class="w-10 h-10 text-amber-400 fill-amber-400/20 stroke-[1.5] pointer-events-none"></i>
              <span class="absolute bottom-2 left-2 right-2 text-[11px] font-bold text-white bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg truncate text-center pointer-events-none shadow-md">${item.name}</span>
            </div>
          </div>
        `;
      } else {
        return `
          <div style="left: ${posX}px; top: ${posY}px; width: 112px; height: 144px;" class="absolute flex flex-col items-center cursor-pointer touch-none" onclick="handleItemClick(event, '${item.id}', false)">
            <div class="w-full h-full shrink-0 bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg relative">
              <div class="w-full h-full bg-zinc-950 relative overflow-hidden flex items-center justify-center rounded-2xl">
                <i data-lucide="file" class="w-8 h-8 text-amber-400 pointer-events-none"></i>
                <span class="absolute bottom-2 left-2 right-2 text-[11px] font-bold text-white bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg truncate text-center pointer-events-none shadow-md">${item.name}</span>
              </div>
            </div>
          </div>
        `;
      }
    }

    function renderUploadModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeUploadModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white">Add Item</h3>
            <div class="flex flex-col gap-2.5 mt-2">
              <button onclick="openLinkModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="link" class="w-4 h-4 text-amber-400"></i> Add Link</button>
              <button onclick="openWebVideoModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="video" class="w-4 h-4 text-amber-400"></i> Add Web Video</button>
              <button onclick="openChecklistModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="check-square" class="w-4 h-4 text-amber-400"></i> Checklist</button>
              <button onclick="openTextEditorModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2"><i data-lucide="message-square" class="w-4 h-4 text-amber-400"></i> Text Bubble</button>
              <button onclick="openNewFolderModal(); closeUploadModal();" class="w-full py-3 bg-zinc-800/60 hover:bg-zinc-800 text-zinc-300 font-semibold rounded-2xl text-sm flex items-center justify-center gap-2 border border-zinc-700/50"><i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> New Folder</button>
            </div>
            <button onclick="closeUploadModal()" class="text-xs text-zinc-500 hover:text-zinc-300 mt-2 font-medium">Cancel</button>
          </div>
        </div>
      `;
    }

    function renderChecklistModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeChecklistModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white">Add Checklist</h3>
            <input id="checklist-title-input" type="text" placeholder="Checklist Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white text-xs outline-none focus:border-amber-500" />
            <div class="flex items-center gap-2 mt-2">
              <button onclick="closeChecklistModal()" class="w-1/2 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button onclick="saveChecklistModal()" class="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs">Create</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderLinkModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLinkModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white">Add Web Link</h3>
            <input id="link-url-input" type="text" placeholder="https://example.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white text-xs outline-none focus:border-amber-500" />
            <div class="flex items-center gap-2 mt-2">
              <button onclick="closeLinkModal()" class="w-1/2 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button onclick="saveLinkModal()" class="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs">Add Link</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderWebVideoModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeWebVideoModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-white">Add Web Video</h3>
            <input id="web-video-url-input" type="text" placeholder="https://youtube.com/..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white text-xs outline-none focus:border-amber-500" />
            <div class="flex items-center gap-2 mt-2">
              <button onclick="closeWebVideoModal()" class="w-1/2 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold rounded-xl text-xs">Cancel</button>
              <button onclick="saveWebVideoModal()" class="w-1/2 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs">Add Video</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderTextEditorModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onclick="closeTextEditorModal()">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 w-full max-w-md flex flex-col gap-4 shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-sm font-bold text-white">New Text Bubble</h3>
            <div id="modal-text-input" contenteditable="true" data-placeholder="Type your note here..." class="w-full min-h-[100px] bg-zinc-950 border border-zinc-800 rounded-2xl p-3 text-white text-xs"></div>
            <button onclick="saveTextEditorModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-extrabold rounded-xl text-xs">Save</button>
          </div>
        </div>
      `;
    }

    function toggleHamburgerMenu(e) { e.stopPropagation(); state.hamburgerMenuOpen = !state.hamburgerMenuOpen; render(); }
    function closeHamburgerMenu() { if (state.hamburgerMenuOpen) { state.hamburgerMenuOpen = false; render(); } }
    function toggleEditMode() { state.editMode = !state.editMode; render(); }
    function toggleSelectMode() { state.selectMode = !state.selectMode; render(); }
    function navigateTo(folderId) { state.currentFolderId = folderId; render(); }
    function navigateBack() {
      const cur = state.folders.find(f => f.id === state.currentFolderId);
      navigateTo(cur ? cur.parentId : null);
    }
    function closeMenu() { state.activeMenuId = null; render(); }
    
    function openUploadModal() { state.showUploadModal = true; render(); }
    function closeUploadModal() { state.showUploadModal = false; render(); }
    function openLinkModal() { state.linkModal = true; render(); }
    function closeLinkModal() { state.linkModal = false; render(); }
    function openWebVideoModal() { state.webVideoModal = true; render(); }
    function closeWebVideoModal() { state.webVideoModal = false; render(); }
    function openChecklistModal() { state.checklistModal = true; render(); }
    function closeChecklistModal() { state.checklistModal = false; render(); }
    function openTextEditorModal() { state.textEditorModal = { text: '' }; render(); }
    function closeTextEditorModal() { state.textEditorModal = null; render(); }

    async function saveLinkModal() {
      const url = document.getElementById('link-url-input').value.trim();
      if (!url) return;
      state.files.push({ id: uid(), parentId: state.currentFolderId, name: url, fileType: 'link', url });
      closeLinkModal();
      render();
    }

    async function saveWebVideoModal() {
      const videoUrl = document.getElementById('web-video-url-input').value.trim();
      if (!videoUrl) return;
      state.files.push({ id: uid(), parentId: state.currentFolderId, name: 'Web Video', fileType: 'web-video', videoUrl });
      closeWebVideoModal();
      render();
    }

    async function saveChecklistModal() {
      const title = document.getElementById('checklist-title-input').value.trim() || 'Checklist';
      state.textBubbles.push({ id: uid(), parentId: state.currentFolderId, title, isBubble: true, isChecklist: true, checklist: [] });
      closeChecklistModal();
      render();
    }

    async function saveTextEditorModal() {
      const text = document.getElementById('modal-text-input').innerText.trim();
      state.textBubbles.push({ id: uid(), parentId: state.currentFolderId, isBubble: true, text });
      closeTextEditorModal();
      render();
    }

    function openNewFolderModal() {
      const name = prompt('Enter new folder name:');
      if (name && name.trim()) {
        state.folders.push({ id: uid(), name: name.trim(), parentId: state.currentFolderId });
        render();
      }
    }

    function handleItemClick(e, id, isFolderItem, isBubbleItem) {
      if (isFolderItem) navigateTo(id);
    }

    loadData();
  </script>
</body>
</html>
