<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden Files </title>
    <style>
        :root {
            --bg-color: #0d0b12;
            --panel-bg: #16121f;
            --panel-border: #3b2a4d;
            --accent-purple: #8a4fff;
            --accent-glow: rgba(138, 79, 255, 0.3);
            --text-main: #e2d9f3;
            --text-muted: #9585b2;
            --danger: #ff4f4f;
            --danger-glow: rgba(255, 79, 79, 0.3);
            --success: #4fff8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar & Formatting / Controls */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo-area {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .formatting-bar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        button, .file-input-label {
            background-color: #221933;
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        button:hover, .file-input-label:hover {
            background-color: var(--accent-purple);
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Workspace & Grid Guide */
        .workspace {
            flex: 1;
            position: relative;
            padding: 2rem;
            overflow: auto;
            min-height: calc(100vh - 80px);
        }

        .workspace.edit-mode::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(59, 42, 77, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 42, 77, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Folders & Relics Containers */
        .folder-container {
            position: absolute;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            width: 320px;
            min-height: 220px;
            padding: 1rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: box-shadow 0.2s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
        }

        .folder-container:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .folder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
            cursor: move;
        }

        .folder-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            border: 1px solid transparent;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .folder-title:focus {
            border-color: var(--accent-purple);
            background: rgba(0,0,0,0.2);
        }

        .folder-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
            max-height: calc(100% - 40px);
        }

        .empty-folder-notice {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        /* Saved Notes / Items inside folders */
        .saved-item {
            background: #1e152d;
            border: 1px solid var(--panel-border);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .saved-item span {
            word-break: break-all;
            font-size: 0.85rem;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: var(--danger-glow);
        }

        /* Confirmation Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-box h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff6b6b;
            box-shadow: 0 0 10px var(--danger-glow);
        }
    </style>
</head>
<body class="edit-mode">

    <header>
        <div class="logo-area">Aiden Files - Gothic Archive</div>
        <div class="formatting-bar" id="formattingBar">
            <button id="toggleEditModeBtn">Toggle Edit Mode</button>
            <button id="addFolderBtn">Add Folder</button>
            <button id="saveBtn">Save State</button>
            <button id="loadBtn">Load State</button>
            <button id="recenterBtn">Recentering Formation</button>
            <button id="resizeOriginalBtn">Resize to Original</button>
        </div>
    </header>

    <div class="workspace edit-mode" id="workspace">
        <!-- Folders/Relics render dynamically here -->
    </div>

    <!-- Confirmation Modal for Deletions -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <h3>Confirm Deletion</h3>
            <p id="confirmMessage">Are you sure you want to delete this item?</p>
            <div class="modal-actions">
                <button id="modalCancelBtn">Cancel</button>
                <button id="modalConfirmBtn" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // State Management & Preservation
        let foldersData = [
            {
                id: 'folder-1',
                title: 'Gothic Relics',
                x: 100,
                y: 100,
                width: 320,
                height: 250,
                items: [
                    { id: 'item-1', name: 'IMG_4738.jpeg', type: 'image' }
                ]
            }
        ];

        let editMode = true;
        let activeDrag = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let pendingDeleteCallback = null;

        const workspace = document.getElementById('workspace');
        const toggleEditModeBtn = document.getElementById('toggleEditModeBtn');
        const addFolderBtn = document.getElementById('addFolderBtn');
        const saveBtn = document.getElementById('saveBtn');
        const loadBtn = document.getElementById('loadBtn');
        const recenterBtn = document.getElementById('recenterBtn');
        const resizeOriginalBtn = document.getElementById('resizeOriginalBtn');
        
        const confirmModal = document.getElementById('confirmModal');
        const confirmMessage = document.getElementById('confirmMessage');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        // Toggle Edit Mode
        toggleEditModeBtn.addEventListener('click', () => {
            editMode = !editMode;
            document.body.classList.toggle('edit-mode', editMode);
            workspace.classList.toggle('edit-mode', editMode);
            toggleEditModeBtn.style.borderColor = editMode ? 'var(--accent-purple)' : 'var(--panel-border)';
        });

        // Confirmation Dialog Helpers
        function showConfirmation(message, callback) {
            confirmMessage.textContent = message;
            pendingDeleteCallback = callback;
            confirmModal.classList.add('active');
        }

        modalCancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('active');
            pendingDeleteCallback = null;
        });

        modalConfirmBtn.addEventListener('click', () => {
            if (pendingDeleteCallback) {
                pendingDeleteCallback();
            }
            confirmModal.classList.remove('active');
            pendingDeleteCallback = null;
        });

        // Render Workspace Folders
        function renderFolders() {
            // Keep track of scroll or active inputs if needed
            workspace.innerHTML = '';
            
            foldersData.forEach(folder => {
                const container = document.createElement('div');
                container.className = 'folder-container';
                container.style.left = `${folder.x}px`;
                container.style.top = `${folder.y}px`;
                container.style.width = `${folder.width}px`;
                container.style.height = `${folder.height}px`;
                container.dataset.id = folder.id;

                // Folder Header (Draggable)
                const header = document.createElement('div');
                header.className = 'folder-header';

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'folder-title';
                titleInput.value = folder.title;
                titleInput.addEventListener('input', (e) => {
                    folder.title = e.target.value;
                });

                // Delete Folder Option with Confirmation
                const deleteFolderBtn = document.createElement('button');
                deleteFolderBtn.className = 'delete-btn';
                deleteFolderBtn.textContent = '✕';
                deleteFolderBtn.title = 'Delete folder with confirmation';
                deleteFolderBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showConfirmation(`Are you sure you want to delete folder "${folder.title}" and all its contents?`, () => {
                        foldersData = foldersData.filter(f => f.id !== folder.id);
                        renderFolders();
                    });
                });

                header.appendChild(titleInput);
                header.appendChild(deleteFolderBtn);
                container.appendChild(header);

                // Folder Content Area
                const contentArea = document.createElement('div');
                contentArea.className = 'folder-content';

                if (folder.items.length === 0) {
                    const emptyNotice = document.createElement('div');
                    emptyNotice.className = 'empty-folder-notice';
                    emptyNotice.textContent = 'Folder is empty';
                    contentArea.appendChild(emptyNotice);
                } else {
                    folder.items.forEach(item => {
                        const savedItem = document.createElement('div');
                        savedItem.className = 'saved-item';
                        
                        const itemName = document.createElement('span');
                        itemName.textContent = item.name;

                        const deleteItemBtn = document.createElement('button');
                        deleteItemBtn.className = 'delete-btn';
                        deleteItemBtn.textContent = 'Delete';
                        deleteItemBtn.addEventListener('click', () => {
                            showConfirmation(`Are you sure you want to delete "${item.name}"?`, () => {
                                folder.items = folder.items.filter(i => i.id !== item.id);
                                renderFolders();
                            });
                        });

                        savedItem.appendChild(itemName);
                        savedItem.appendChild(deleteItemBtn);
                        contentArea.appendChild(savedItem);
                    });
                }

                container.appendChild(contentArea);

                // Drag and Drop Logic with soft grid snap
                header.addEventListener('mousedown', (e) => {
                    if (!editMode || e.target === titleInput || e.target === deleteFolderBtn) return;
                    activeDrag = folder;
                    const rect = container.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left;
                    dragOffsetY = e.clientY - rect.top;
                    container.style.zIndex = 1000;
                });

                workspace.appendChild(container);
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (!activeDrag || !editMode) return;
            let newX = e.clientX - dragOffsetX - workspace.getBoundingClientRect().left + workspace.scrollLeft;
            let newY = e.clientY - dragOffsetY - workspace.getBoundingClientRect().top + workspace.scrollTop;

            // Soft grid snap (40px grid)
            const gridSize = 40;
            if (e.shiftKey) { // Optional strict snap or continuous soft snap
                newX = Math.round(newX / gridSize) * gridSize;
                newY = Math.round(newY / gridSize) * gridSize;
            }

            activeDrag.x = Math.max(0, newX);
            activeDrag.y = Math.max(0, newY);

            const el = workspace.querySelector(`[data-id="${activeDrag.id}"]`);
            if (el) {
                el.style.left = `${activeDrag.x}px`;
                el.style.top = `${activeDrag.y}px`;
            }
        });

        window.addEventListener('mouseup', () => {
            if (activeDrag) {
                const el = workspace.querySelector(`[data-id="${activeDrag.id}"]`);
                if (el) el.style.zIndex = 10;
                activeDrag = null;
                renderFolders();
            }
        });

        // Add New Folder Action
        addFolderBtn.addEventListener('click', () => {
            const newFolder = {
                id: `folder-${Date.now()}`,
                title: 'New Archive Folder',
                x: 120 + (foldersData.length * 30) % 400,
                y: 120 + (foldersData.length * 30) % 300,
                width: 320,
                height: 250,
                items: []
            };
            foldersData.push(newFolder);
            renderFolders();
        });

        // Recentering Formation Action
        recenterBtn.addEventListener('click', () => {
            foldersData.forEach((folder, index) => {
                folder.x = 100 + (index % 3) * 360;
                folder.y = 100 + Math.floor(index / 3) * 300;
            });
            renderFolders();
        });

        // Resize to Original Action
        resizeOriginalBtn.addEventListener('click', () => {
            foldersData.forEach(folder => {
                folder.width = 320;
                folder.height = 250;
            });
            renderFolders();
        });

        // Save & Load State persistence
        saveBtn.addEventListener('click', () => {
            localStorage.setItem('aiden_files_gothic_archive', JSON.stringify(foldersData));
            alert('Archive state saved successfully.');
        });

        loadBtn.addEventListener('click', () => {
            const saved = localStorage.getItem('aiden_files_gothic_archive');
            if (saved) {
                try {
                    foldersData = JSON.parse(saved);
                    renderFolders();
                    alert('Archive state loaded successfully.');
                } catch (err) {
                    alert('Failed to load saved state.');
                }
            } else {
                alert('No saved state found.');
            }
        });

        // Initial render
        renderFolders();
    </script>
</body>
</html>
