<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

  <!-- Main Header / Navigation -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <h1 class="text-sm font-bold tracking-wider uppercase text-amber-400">Canvas Platform</h1>
    </div>

    <div class="flex items-center gap-1.5 shrink-0 overflow-x-auto py-1">
      <button onclick="toggleHamburgerMenu(event)" class="p-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center shadow-md cursor-pointer shrink-0">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      
      <!-- Back button container rendered conditionally via JS if state.currentFolderId !== null -->
      <div id="back-button-container"></div>

      <button onclick="toggleSelectMode()" id="select-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0">
        Select
      </button>
      <button onclick="toggleEditMode()" id="edit-mode-btn" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0">
        Edit Mode Locked
      </button>
      
      <!-- Add Photos Button -->
      <button onclick="document.getElementById('photo-input').click()" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0" title="Add Photos">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span>Add Photos</span>
      </button>

      <button onclick="openTextEditorModal()" class="px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 hover:bg-zinc-800 text-amber-400 flex items-center gap-1.5 shrink-0" title="Add Text Bubble">
        <i data-lucide="message-square" class="w-4 h-4"></i>
        <span>Text Bubble</span>
      </button>
    </div>
  </header>

  <!-- Hidden File Input for iOS Photos/Files Selection -->
  <input type="file" id="photo-input" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)">

  <!-- Main Canvas / Content View Area -->
  <main class="flex-1 p-4 relative flex flex-col items-center justify-center">
    <div id="canvas-view" class="w-full max-w-4xl h-[70vh] border border-dashed border-zinc-800 rounded-2xl flex flex-col items-center justify-center text-zinc-500 gap-2">
      <i data-lucide="layers" class="w-10 h-10 text-zinc-600"></i>
      <p class="text-sm">Your canvas is empty. Use the top navigation buttons to add text bubbles or photos.</p>
    </div>
  </main>

  <!-- Script initialization -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Application state stub
    const state = {
      currentFolderId: null,
      selectMode: false,
      editMode: false
    };

    function toggleHamburgerMenu(event) {
      console.log('Hamburger menu toggled');
    }

    function navigateBack() {
      state.currentFolderId = null;
      render();
    }

    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      render();
    }

    function toggleEditMode() {
      state.editMode = !state.editMode;
      render();
    }

    function openTextEditorModal() {
      alert('Open Text Editor Modal triggered');
    }

    function handlePhotoUpload(event) {
      const files = event.target.files;
      if (files.length > 0) {
        alert(`Successfully selected ${files.length} file(s) from device storage/Photos.`);
      }
    }

    function render() {
      // Update Select Mode button UI
      const selectBtn = document.getElementById('select-mode-btn');
      if (state.selectMode) {
        selectBtn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-indigo-500/25 border-indigo-500 text-indigo-300 shrink-0";
        selectBtn.textContent = "Cancel";
      } else {
        selectBtn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0";
        selectBtn.textContent = "Select";
      }

      // Update Edit Mode button UI
      const editBtn = document.getElementById('edit-mode-btn');
      if (state.editMode) {
        editBtn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-yellow-500/25 border-yellow-500 text-yellow-400 shrink-0";
        editBtn.textContent = "Edit Mode On";
      } else {
        editBtn.className = "px-3 py-2 rounded-xl text-xs font-bold border bg-zinc-900 border-zinc-800 text-zinc-400 shrink-0";
        editBtn.textContent = "Edit Mode Locked";
      }

      // Update conditional Back button
      const backContainer = document.getElementById('back-button-container');
      if (state.currentFolderId !== null) {
        backContainer.innerHTML = `
          <button onclick="navigateBack()" class="px-3 py-2 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 text-amber-400 rounded-xl flex items-center gap-1 text-xs font-bold shadow-md cursor-pointer shrink-0" title="Back">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back</span>
          </button>
        `;
      } else {
        backContainer.innerHTML = '';
      }

      // Re-initialize dynamic Lucide icons rendered via JS state updates
      lucide.createIcons();
    }
  </script>
</body>
</html>
